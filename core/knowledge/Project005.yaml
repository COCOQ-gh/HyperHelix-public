  - id: N-Project005-20260901c
    text: "Project005 i.pximg.net 等ホットリンク防止の画像を MV3 拡張で保存する定石: (1) URL を chrome.downloads へ直渡しすると Referer が付かず 403(brave://downloads『アクセスできません』)。(2) 取得は **background SW の fetch** で行う — MV3 では content script の cross-origin fetch は CORS に阻まれ『failed to fetch』(host 権限バイパスは廃止)。cross-origin を CORS 回避できるのは host_permissions を持つ SW のみ。(3) Referer は DNR modifyHeaders(resourceTypes に xmlhttprequest を含め i.pximg.net を対象)が SW fetch に付与。(4) SW は FileReader/URL.createObjectURL 不可 → ArrayBuffer を btoa で base64 data URL 化(チャンク処理)→ chrome.downloads で保存(data URL は通信を伴わず 403 にならない)。関連: [[N-Project005-20260901a]] Referer/DNR。"
    tags: [Project005, i-pximg, referer, "403", cors, chrome-downloads, declarativenetrequest, data-url, mv3, hotlink, service-worker]
    project: Project005
    kind: leaf
    topic: N-Project005-20260901a
    strength: 4
    last_used: 576
    state: active
  - id: N-Project005-20260901d
    text: "MV3 で isolated world の content script から見えないページ側グローバル(Project005 の window.dataLayer 等)を取るには、world:'MAIN' の content script(WXT defineContentScript world:'MAIN')で読み、window.postMessage で isolated 側へ渡す(MAIN world は拡張API不可なので通信は postMessage のみ)。受け渡しは **共有 DOM 属性が堅牢**(MAIN が document.documentElement.setAttribute、isolated が getAttribute をポーリング)— postMessage は content script の起動順が不定で「見つけ次第1回 post」だと isolated リスナー登録前に取りこぼす(TASK-022 実バグ)。DOM は両 world で共有されるため起動順に依存しない。isolated は読めた値を chrome.storage へ保存し background/popup が読む。dataLayer/属性は未投入のことがあるので双方リトライ/ポーリング。関連: [[N-Project005-20260901b]] SPA/isolated world。"
    tags: [mv3, content-script, main-world, isolated-world, postmessage, datalayer, Project005, browser-extension, page-global]
