  - id: N-Project005-20260901m
    text: "**MV3 Service Worker では 30 秒を超える setTimeout は成立しない** — SW は約 30 秒のアイドルで停止し、タイマーも pending Promise も消滅する(fetch 等のイベントは延命するが sleep は延命しない)。したがってレートバックオフ・クールダウン待ち・ポーリング間隔を SW 内に置くなら**全て 30 秒未満**にし、それ以上の待機が必要な場面は『待つ』のではなく**即エラーを返してユーザー再実行(冪等)か chrome.alarms に倒す**。TASK-20260821-001 の実障害: 429/403 バックオフ 30s→2m→10m とクールダウン明け待ち(最長 10 分)の sleep 中に SW が停止し、runtime.sendMessage の応答が永遠に返らず UI が『処理中…』で固まった。**仮想時計の単体テストではこの制約を検出できない**(sleep をモックするため)— タイマーを導入する S 段階で『この環境でこのタイマーは発火まで生存するか』を確認すること。関連: [[N-Project005-20260901n]] rate-limit 監査(の『停止』軸の実装が本制約と衝突した)。"
    tags: [mv3, service-worker, timer, lifecycle, backoff, browser-extension, Project005, incident, testing-gap]
    project: Project005
    strength: 1
    last_used: 577
    state: active
  - id: N-Project005-20260901n
    text: "外部 API から『アクセス頻度』の注意を受けたときの監査は**間隔・並列・総量・停止**の 4 軸で行い、間隔だけを見ない。TASK-20260818-001(Project005)で判明した典型: (1) 1 req/s のゲートは守られていたが**コンテキストごとに別インスタンス**(background とダッシュボード)で合算 2 req/s、(2) 設定の間隔値が UI で保存されるだけで**クライアント生成時に読まれていない**(配線漏れ)、(3) 画像 fetch だけゲート外で連射、(4) **429/403 を各ループが個別に catch して次へ進む**ため『止まる』分岐がどこにも無い、(5) 操作のたびに『自分の全ブックマーク/全フォロー』を再列挙する固定費(5000 件で 200 req)、(6) 1 作品 1 リクエストのループ(1000 作品=1000 req)にバッチ API があるのに未使用。対策の要点: ゲートを 1 本に統一(他コンテキストはメッセージ委譲)・ジッター・**429/403 で全体クールダウン**(以降の新規リクエストは待たずに即エラーにして各ループを中断・入口でも拒否・永続化)・列挙結果の TTL キャッシュ+書込後の局所更新・バッチ API 化+標本推定。『間隔を守っている』と『総量が人間並み』は別物。"
    tags: [rate-limit, api-etiquette, audit, cooldown, cache, batching, browser-extension, Project005, incident]
    project: Project005
    strength: 2
    last_used: 577
    state: active
  - id: N-Project005-20260901o
    text: "『発見が頭打ち/鈍化する』の一般解は**発見ソースの多重化** — 固定母集団に対する探索(タグ×閾値検索など)は再実行しても同じ上位しか返さないので、**時間で入れ替わる母集団**(ランキング・新着)を並置する。Project005 実装知見(TASK-20260813-014 実証): /ranking.php の `original`/`male`/`female` は `content=illust` を付けると `{error:'ランキングが見つかりませんでした'}`(content を送らない=all のみ有効)。R-18 系(daily_r18/weekly_r18/male_r18/female_r18/r18g)は未ログインだと HTML が返るため JSON 形の実行時検証+**モード単位の失敗許容**が必須。ranking の contents 要素は tags を持つので users入り の N をその場で抽出でき、追加コストなしで Tier 証拠になる。関連: [[N-Project005-20260901i]] ranking の別系統仕様, [[N-Project005-20260901s]] 探索パラメータが暗黙の天井。"
    tags: [discovery, ranking, source-diversity, Project005, saturation, r18, content-param, verify-shape, browser-extension]
    project: Project005
    strength: 1
    last_used: 567
    state: active
