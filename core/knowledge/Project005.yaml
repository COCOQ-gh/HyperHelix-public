  - id: N-Project005-20260901i
    text: "Project005 ランキングは他 ajax と作りが違う。URL は `/ranking.php`(/ajax 無し)で `format=json`、応答は **{error,message,body} エンベロープを持たない直 JSON**({contents:[...]})。`/ajax/ranking.php` は error true で不可。よってエンベロープを剥がす共通 getJson では取れず、直 JSON を返す getJsonRaw を別に用意した。さらに contents 要素は検索/ブクマの IllustSummary と **キー名も型も別系統**(illust_id/user_id は数値、rating_count=いいね数、rank=順位、aiType は無い、xRestrict は illust_content_type.sexual から推定)。複数ソースを混ぜる時は共通中間型へ正規化アダプタを噛ませ、ソース固有のキー・型・欠落フィールドをそこで吸収する。実証スニペットで firstItem を丸ごと dump してから書くと一発で確定([[N-Project005-20260901f]] verify-shape, [[N-Project005-20260901h]] ソース別シグナル)。"
    tags: [Project005, ranking, ajax, envelope, normalization, adapter, browser-extension, verify-shape]
