  - id: N-Project005-20260901j
    text: "推薦/検索の手動チューニングノブは『除外(消す)』と別軸で『優先度を上下する(残す)』を用意する。ユーザーは『好きな絵師なので残すが食傷気味のタグは順位を下げたい』(苦手タグ)や『今の波を優先したい』(マイブームタグ)を求める — これは exclude では表現できない(exclude は候補からもブクマ対象からも消す)。実装は純関数スコアラの加減点で局所化: 既存の可変倍率(ScoreWeights)に boost/demote を足し、正規化済み Set(normalizeTag 再利用 旧Project005台帳#066(未移設))で一致判定、rankCandidates が Set を1回だけ構築して候補ごとの再正規化を避ける。『優先』は2面: 候補スコア加点 + 検索ソースのタグにマイブームを加える(能動的に探す)。苦手は除外フィルタには一切足さず順位だけ落とす(候補・ブクマには残る)。設定は storage schema の単一権威にネスト object で置き migration で浅くマージ。関連: [[N-Project005-20260901h]] ソース別シグナル・optional 設計。"
    tags: [Project005, scoring, candidates, recommendation, tuning, boost, demote, tag-preference, browser-extension]
    project: Project005
    kind: leaf
    topic: N-Project005-20260901a
    strength: 3
    last_used: 559
    state: active
  - id: N-Project005-20260901k
    text: "推薦/候補リストの2つの定番改善。(1)『見送り』の永続除外: ユーザーが不要と判断した候補が毎回再提示される不満は、明示的な dismiss アクション(✕ボタン)+ 永続集合(storage の Record<id,ts>)で解消。除外は候補生成の**単一入口ループ**に1行足すだけ(既取得/ブクマ済/除外と同列。list-API prefilter 旧Project005台帳#075(未移設))。無制限増加に備え options にリセットを必ず用意(一方向ラチェットの袋小路を防ぐ)。自動判定(閲覧=見送り)は誤検知するので明示アクションが堅牢。(2)検索優先タグ(マイブーム)の**結果保証**: 検索ソースに入れても(→ [[N-Project005-20260901j]])スコア順 topN で人気作に押し出され結果に0件になりうる。ランキング後『topN 内に該当が無ければ最上位の該当作を最後尾スロットへ差し替え』で最低1件を保証。スコアラ本体は汚さずランキング後の注入に局所化。関連: [[N-Project005-20260901j]] boost/demote 二軸, 旧Project005台帳#075 一覧prefilter, 旧Project005台帳#067(未移設) ハンドラは可変状態を固定しない。"
    tags: [Project005, candidates, recommendation, dismiss, persistence, guarantee, boost, browser-extension, ux]
    project: Project005
    kind: leaf
    topic: N-Project005-20260901a
    strength: 4
    last_used: 559
