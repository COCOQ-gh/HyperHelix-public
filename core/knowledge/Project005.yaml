  - id: N-Project005-20260901h
    text: "スコアリングの入力シグナルはデータソースごとに揃う項目が違う。Project005 検索(/ajax/search/artworks)・ブックマーク一覧の list アイテムは tags/userId/aiType/xRestrict/bookmarkData(自分のブクマ有無)を持つが **いいね/ブクマ数(人気度)は持たない**。人気度・ランキング順位は ランキング(/ajax/ranking.php: rating_count/rank)か detail 取得でしか埋まらない。純関数スコアラは全シグナルを optional にして『無い項目は加点しない』設計にし、ソース追加で徐々に埋める。新ソース(follow_latest/ranking)は応答形を非空データで実証してから parse を書く(旧Project005台帳#075(未移設) list-API prefilter, [[N-Project005-20260901f]] verify-shape)。"
    tags: [Project005, scoring, candidates, list-api, ranking, data-source, browser-extension, verify-shape]
