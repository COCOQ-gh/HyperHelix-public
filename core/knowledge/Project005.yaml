  - id: N-Project005-20260901b
    text: "Project005 は SPA — content script は初回注入後、ページ内遷移で再実行されない。WXT では ctx.addEventListener(window, 'wxt:locationchange', ...) で履歴遷移を検知してページ種別判定を再実行する(自前 history フック不要)。Brave 実機で初回ロード・SPA 遷移とも検知動作を確認済(TASK-20260705-005)。"
