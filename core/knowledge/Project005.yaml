  - id: N-Project005-20260901l
    text: "Project005 で『全期間の人気作』を Premium 無しで絞る定石: 人気順ソート order=popular_d は Premium 限定だが、Project005 は作品のブックマークが閾値を超えると公式タグ `{N}users入り`(100/500/1000/5000/10000/30000/50000...)を自動付与する。これを検索語に AND で足す(word=`${tag} ${N}users入り`)と、そのタグ AND 人気閾値超の作品=全期間の人気作が非Premiumで引ける。高ブクマ作は下位閾値タグも保持するため N は floor(N=1000 は 1000users 以上を全部拾う)。検索一覧は閲覧/いいね数を持たない([[N-Project005-20260901h]])ので閾値タグが人気フィルタの実体になる。実装は検索 word 組み立てだけの局所変更で下流(フィルタ/スコア/統合)は不変。閾値は既知の代表値のみ select 提供(存在しない N は0件)。追記(TASK-20260813-006 実証): users入り は**実タグとして作品 tags 配列に含まれる**(ジャンル接頭辞変種 `Fate/GO5000users入り` 等あり → 抽出は末尾 `/(\\d+)users入り$/`)。`/ajax/user/{id}/profile/illusts?ids[]=...&work_category=illust|manga&is_first_page=0` の一括サマリ(48件/バッチ)で全作品の tags を軽量取得でき、ユーザー単位の人気度集計(N 累計)が ~8req で可能。関連: [[N-Project005-20260901a]] 非公式ajax, [[N-Project005-20260901e]] 検索 word の忠実な組み立て。"
    tags: [Project005, search, popularity, users-iri, all-time, premium-free, ajax, browser-extension, candidates]
    project: Project005
    kind: leaf
    topic: N-Project005-20260901a
    strength: 5
