  - id: N-Project005-20260901e
    text: "Project005 ajax には『空でも必須』のクエリパラメータがある(例: /ajax/user/{id}/illusts/bookmarks は tag= を空でも要求。欠落すると HTTP 400)。URL ビルダは空文字を一律省かず、実証で動いた URL の全パラメータを忠実に再現すること(undefined のみ省く)。実証時に確認した動作 URL をそのまま生成できるかをテストで固定する。関連: [[N-Project005-20260901a]] 非公式ajax定石。"
