  - id: N-Project005-20260901g
    text: "WXT の HTML エントリ(options/popup 等)は manifest フィールドをエントリから自動生成し、一部を wxt.config の manifest 指定より優先して上書きする(実測: options_ui.open_in_tab を config で true にしても出力は false のまま)。config のノブが効かない場合は出力 manifest.json を grep で確認し、効かないノブは残さず、代替(options なら runtime.openOptionsPage + レスポンシブ CSS)へ委譲する。設定した=効いたと仮定しない。"
