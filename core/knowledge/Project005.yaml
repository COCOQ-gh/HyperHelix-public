  - id: N-Project005-20260901f
    text: "Project005 bookmarks 一覧応答の body.bookmarkTags は『そのページの各ブックマークのタグ』= {bookmarkId: tags[]} のマップ(タグが1つも無いページでは空配列 [] で返る)。ユーザーの集約タグ名配列ではない。ある作品の現在のブックマークタグは bookmarkTags[work.bookmarkData.id] で直接引ける(per-tag 絞り込み列挙は不要)。教訓: 応答フィールドの形は空データ([])だけで推測せず、非空データで確認する(空配列を『名前の配列』と誤解し検出が全件破綻した TASK-032)。未分類の絞り込みは ?tag=未分類。関連: [[N-Project005-20260901e]] Project005 ajax。"
