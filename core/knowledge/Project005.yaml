notes:
  - id: N-Project005-20260901a
    text: "Project005 連携拡張の定石: 公式の第三者向け API は非公開 → サイト内部 ajax(/ajax/... の JSON)をログイン済みセッション Cookie の文脈で呼ぶ。画像本体(i.pximg.net)は Referer 必須(無いと 403)→ MV3 では declarativeNetRequest でリクエストヘッダに Referer を付与する。認証はユーザーの既存セッションを利用し拡張に資格情報を保持しない。非公式エンドポイント依存は1箇所へ集約し差し替え可能に。ToS・レート制御(スロットリング/バックオフ)を最優先。"
    tags: [Project005, browser-extension, mv3, ajax, referer, declarativenetrequest, download, session, tos]
