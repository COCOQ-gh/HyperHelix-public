  - id: N-Project003z2dlabz2dh-20260828a
    text: "Project003 の縦レイアウトを行予算で組むときの落とし穴(正典は kit docs/58)。①**LINECOUNT は論理行、画面が消費するのは表示行で単位が違う** — logicalLineCount の加算条件は `line.IsLogicalLine && displayLineList[^1].IsLineEnd`(Project003Console.Print.cs:167-170)なので**折り返しの継続行は加算されない**。一方 OnPaint は displayLineList を行高ずつ描く ∴ **LINECOUNT で画面溢れは原理的に判定できない**。折り返し閾値は Config.DrawableWidth = WindowX - max(2,FontSize/6)(Config.cs:168-171)で、CLIENTWIDTH()=MainPicBox.Width(Project003Console.cs:226)とは別量。②**パディングで高さを揃える設計の target は下限であって上限ではない**(WHILE は PRINTL を足すだけで切り詰めない) ∴ 内容が可変な領域が target を超えると超過分がそのまま総行数になる。headroom = target - 実コンテンツ行数 が正の間は吸収されてテストが緑になり、上流が伸びて headroom が負になった瞬間に内容差が可視化される = **状態依存の条件付きバグ**。③**総行数だけのアサートは『配分だけ動く』と『折り返しで表示行だけ増える』を素通しする**。④自前折り返しグリッドの行数は 2*ceil(cells/cols)-1(行間に空行を入れる場合)で、cols は整数除算の knife-edge に乗るため窓幅数pxで階段状に跳ぶ。⑤計器には 予算/総数/内訳/**パディング前の実コンテンツ行数**/折り返し要因 の5種が要る — 『パディング量==0』は『ちょうど満たした』と『溢れた』の区別がつかない。"
