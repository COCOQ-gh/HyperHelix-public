  - id: N-Project003z2dlabz2dh-20260825b
    text: "G系・div背景の最新の正は kit docs/55(2026-08-25、Project001 spike 起点の総括): ①**GSETBRUSH の格納ブラシを使う塗りは命令を問わず即死**(GFILLRECTANGLE も G_POLYGON_FILL も access violation。設定のみは無害)。単色パネルは **GCLEAR gid,0xAARRGGBB の全面塗り**(半透明可)、部分塗りは GSETCOLOR ループ。GSETPEN+G_POLYGON_DRAW も RING-DYN-005 FAIL 記録つきで使用不可扱い。②**GRAPHICS でも div background_color は描画される**(実行ビルド 7b7dd3bf 実測)— 『無効』はソース checkout(d380408)の実装で、**同梱 exe はソースより新しい**(7b7dd3bf は履歴に無い)。③再発防止3原則: **fixture の存在は合格の証拠ではない**(kit には失敗再現用 fixture がある — 検証主張は docs/35 の PASS/FAIL 表など結果記録まで遡る)/ 実測主張にはビルドハッシュを添える(バージョン文字列 0.2.6.0 ではビルドを特定できない)/ ソース読解の断定は checkout と実行ビルドの一致確認後のみ。本件は docs/51→52→53 に2日間伝播した自前資料の誤りを外部プロジェクトの実測が検出した事例。"
