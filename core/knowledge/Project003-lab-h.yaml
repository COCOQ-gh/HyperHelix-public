  - id: N-Project003z2dlabz2dh-20260831a
    text: "codex exec をバックグラウンド Bash から dispatch する3点セット(欠くとハング/誤作業): ①**stdin を閉じる**(`< /dev/null`) — バックグラウンドの stdin はパイプで、codex が『Reading additional input from stdin...』のまま無限待ちする(2026-08-31 実測。wo-watch より先に気づけない)。②**-C <workdir> を明示** — cd 前置はシェルの cwd リセットで落としやすく、誤 cwd だと別リポジトリの AGENTS.md/SPEC.md を読んで作業する。③**出力をファイルへリダイレクト**し `wo-watch --stall --budget` を並走(HH-063 §9e)。委任品質側の教訓: **SPEC に挿入本文を丸ごと同梱**(索引行・手順文など)すると Codex の裁量が消え一発 green になる — 変更5点+3点の機械的指定で逸脱ゼロ(REPORT 実測、delegation/archive/2026-08-31-t007-t008)。"
