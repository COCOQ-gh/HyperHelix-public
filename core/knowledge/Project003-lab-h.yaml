  - id: N-Project003z2dlabz2dh-20260824c
    text: "Project003 の PRINT/PRINTC/PRINTLC 経路は flush 時にテキスト中の [数字] を**クリック可能ボタンへ自動昇格**させる — fromCssToButton -> createButtons -> ButtonStringCreator.SplitButton が [数字] パターンを検出し入力値つき ConsoleButtonString(IsButton true)を作る(PrintStringBuffer.cs:273-284, :330 / ButtonStringCreator.cs:36-)。∴『PRINTLC は非ボタン』は [数字] を含むラベルでは**偽**で、[105] 形式の選択不可コマンドを PRINTLC で出すとクリックできてしまう。自動昇格を受けないのは PRINTPLAIN/PRINTPLAINFORM 経路のみ(AppendPlainText -> createPlainButton、SplitButton を通らない)。ただし PRINTPLAINFORM はパディングしないので列幅は手動(CP932 バイトで colwidth+1 まで空白)。**この事実はソース読解だけでは見落とし、実行時アサート(HTML_GETPRINTEDSTR で <button 数を数える)が捕まえた** — 表示系の断定は runtime テストで裏取りすること。UI 崩壊対策の生成ツールは dev-support/tools/Convert-HtmlLayoutToErb.ps1(HTML モックアップ -> docs/50 §7 形式の ERB。列幅超過/行超過は生成時エラー、検証は Invoke-HtmlLayoutSmoke.ps1)。正典は kit docs/50(§3 訂正済み)。"
