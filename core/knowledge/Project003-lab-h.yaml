  - id: N-Project003z2dlabz2dh-20260718j
    text: "数字カウントアニメ再利用ヘルパは ui/カウント/COUNT_ANIME.ERB(kit 還元済)。部分更新=HTML_PRINT_ISLAND html で島を置き、毎フレーム再描画でその領域だけ更新、HTML_PRINT_ISLAND_CLEAR でクリア(THREE_COUNT.ERB と同手法)。**訂正 2026-08-24(kit docs/50 のソース調査)**: 『レイヤー番号』引数は Project003.NET 0.2.6.0 に**存在しない**。HTML_PRINT_ISLAND の第2引数は SP_HTML_PRINT の LineEnd で PrintHTMLIsland は使わない(Project003Console.Print.cs:107-110)。HTML_PRINT_ISLAND_CLEAR は FunctionArgType.VOID で、引数を書くと warn『引数は不要です』のみで黙って捨てられ**常に全消し**になる(Instraction.Child.cs:373-385 / ArgumentBuilder.cs:331-341)。島は本文とは別のオーバーレイ層(_htmlElementList)で、部分クリアはできない。DEMO_V2_COUNT_ANIME.ERB がこの存在しない API に依存している。公開API: COUNT_VALUE_AT(from,to,progress0-1000,ease)=純粋補間(端点厳密・0=linear/1=ease-out) / COUNT_FRAMES_BY_DURATION(ms,frame_ms)=時間逆算=MAX(ms/frame_ms,1) / COUNT_FRAMES_BY_SPEED(from,to,値/秒,frame_ms)=速度→フレーム数 / COUNT_ANIME_HTML(#FUNCTIONS ビルダ) / COUNT_ANIME_RUN(島ループ・最終値残す) / COUNT_ANIME_TIMED(時間逆算FE) / COUNT_ANIME_SPEED(速度FE)。**層別改行**: ui 層は CRLF+BOM 統一(graphics は LF)。SPEC で層の改行を明示すると Codex が初回から正しく出力し E4 是正が不要になる(N-Project003z2dlabz2dh-20260718h の予防が有効化)。"
