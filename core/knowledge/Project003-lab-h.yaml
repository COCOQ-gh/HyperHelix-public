  - id: N-Project003z2dlabz2dh-20260823a
    text: "Project003 のセーブデータ跨ぎキャラ移送は専用命令で完結する: SAVECHARA \"名前\",\"メッセージ\",登録番号... → dat/chara_<名前>.dat(通常セーブと別ファイル、VariableEvaluator.cs:1768)/ LOADCHARA \"名前\" は CharacterList.AddRange で**追加**(置換でない)し RESULT=1/0、**失敗しても例外は出ない**。事前検査 CHKCHARADATA(0=OK/1=無/2=ゲーム違い/3=版違い/4=他、RESULTS に理由)、列挙 FIND_CHARADATA(件数を返し RESULTS:0.. にファイル名)。**CSV 依存の正確な範囲**: キャラ登録 CHARA*.CSV は不要(ADDCHARA と違い LOADCHARA は CSV を見ない)、変数は**変数名キー**で保存され #DIM ユーザー定義変数も名前で保存・未知名は読み飛ばす。ただし**配列の添字の意味は CSV が決める**(ABL/TALENT/EXP/MARK/PALAM/ITEM)ため CSV の並びが違うと無警告で意味がズレる。ゲート3関門=種別 CharVar / ScriptUniqueCode 一致 / CheckVersion。**抜け穴**: 作品コード 0 は UniqueCodeEqualTo が無条件 true(GameBase.cs:40)。移送時の手当て3点=RELATION の添字はキャラ番号 / NO も保存され移送先 CSV と衝突しうる / 調教中パラメータも保存対象。詳細と実装レシピは kit docs/49。"
