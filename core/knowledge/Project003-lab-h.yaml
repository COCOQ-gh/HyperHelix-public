  - id: N-Project003z2dlabz2dh-20260824e
    text: "G系 sprite 方式の制約の要点(正典は kit docs/52): ①**GSETBRUSH 後の GFILLRECTANGLE は無音クラッシュ**(Phase 4a 実測・Project003.NET 0.2.6.0)。単独=既定ブラシ(Config.BackColor)なら動くが色付きには使えない。【訂正 2026-08-25・docs/55】**GSETBRUSH の格納ブラシを使う塗りは G_POLYGON_FILL も即死**(Project001 実機 bisect 0xC0000005。旧記述『smoke 済み』は失敗再現用 fixture の誤読 — 正しい記録は docs/35 RING-DYN-004 FAIL)。色付き矩形は **GCLEAR gid,ARGB の全面塗り**(半透明可・Project001 実測)か GSETCOLOR ピクセルループ(出荷済み graphics/枠/FRAME_CREATE.ERB)。②G系の色は **0xAARRGGBB**(ReadColor が最上位バイト=alpha)。0xRRGGBB 6桁だと alpha=0=完全透明で『エラー無しで何も描かれない』。HTML 側 #RRGGBB とは形式が別物。③WINAPI では G系全滅(CodeEE)、GRAPHICS/TEXTRENDERER は可 — GRAPHICS で div background_color が効かない環境の代替根拠。④ReadRectangle は w/h=0 を CodeEE 拒否(進捗0%バー等は事前ガード)。⑤資料執筆の教訓: docs/51 §2-3 で GFILLRECTANGLE 4辺を推奨してしまい、CODING_STANDARDS §5 の実測クラッシュ記録と矛盾した(翌日のまとめ直しで検出・訂正)。**engine ソースが平凡に見えても実測クラッシュ記録(CODING_STANDARDS §5 / AGENTS.md 落とし穴)との突き合わせを資料執筆チェックに含めること** — ソース読解は実測を上書きしない。"
