  - id: N-Project003z2dlabz2dh-20260718g
    text: "Project003 画像カットインアニメは2機構で実現可。機構A=自律フレームアニメ: SPRITEANIMECREATE/SPRITEANIMEADDFRAME(各フレーム delay ms)→CBGSETSPRITE 配置→SETANIMETIMER ms で再描画タイマー ON→ONEINPUTS 等の入力待ち中にフレームが壁時計時間駆動で自律再生(CroppedImage.cs GetCurrentFrame、実例 BATTLE.ERB:566)。機構B=位置スライド: GCREATEFROMFILE→SPRITECREATE→CBGSETSPRITE→ループで SPRITESETPOS/SPRITEMOVE+REDRAW 1+待機(スクリプトがコマ送り、イージング無し・自作)。制約: TextDrawingMode=WINAPI では SPRITEANIME 系が CodeEE(TEXTRENDERER/GRAPHICS 必須)。フレーム時間は .Milliseconds 成分使用で totaltime>1000ms は秒境界で巻き戻る癖。動きの自動テストは困難(目視)、生成状態は SPRITECREATED、色は GGETCOLOR/SPRITEGETCOLOR で検証可。"
    tags: [Project003, graphics, animation, sprite, cutin, cbgsetsprite, spriteanime, setanimetimer, redraw, project:Project003-lab-h]
    project: Project003-lab-h
    strength: 1
    last_used: 491
