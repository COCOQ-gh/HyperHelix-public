  - id: N-Project003z2dlabz2dh-20260823b
    text: "構造化 YAML(タスク記録・台帳)をスクリプトで編集するときの罠4件、同一セッションで実際に踏んだもの: ①**非一意アンカーでの一括置換** — Python str.replace は count 省略で全置換。`evaluate: []` はタスク記録の top-level と phase_evidence の2箇所にあり、両方に当たって記録が壊れた(同一セッションで2回発生)。置換は必ず count=1、かつ事前に `assert s.count(old)==1` で一意性を確認する。②**パッチの重ね掛け** — 壊れた構造化ファイルを部分置換で直そうとすると傷が深くなる。複数箇所を書き換えるなら決定的な**再構築**を選ぶ。③**コロンを含む値の未クォート** — `title: T-004/T-005: 説明` は BLOCK_AS_IMPLICIT_KEY で fail。値にコロンを含むなら必ずクォート。またバックスラッシュや正規表現を含む本文は二重引用符スカラーだと BAD_DQ_ESCAPE になるので**単一引用符スカラー**にする。④**宣言と実体の混同** — `d7.note_moves` は宣言であって実体ではない。`bump` はノートを追記しないので台帳へ実際に書かないと NOTE_MOVE_MATERIALIZED で fail(AP-016)。"
    tags: [hyperhelix, task-record, yaml, edit, replace, anchor, uniqueness, quoting, note-moves, ap-016, tooling, project:Project003-lab-h]
    project: Project003-lab-h
    strength: 1
