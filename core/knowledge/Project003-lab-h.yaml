  - id: N-Project003z2dlabz2dh-20260824a
    text: "git フックを書くときの罠2件、Project003LabH の pre-commit 実装で実測: ①**非 ASCII パスのクォート** — git diff --cached --name-only は日本語等を含むパスをダブルクォートで囲み8進エスケープして出力するため、grep の前方一致(^プレフィクス)が外れ**ゲートが無言で不発になる**。必ず --name-only -z と tr で NUL 区切りにする(または core.quotepath=false)。②**PowerShell 出力の文字化け** — git-bash から powershell -File x.ps1 を呼ぶと出力が cp932 になり日本語が化ける。ブロック時のメッセージが読めないのは実用上致命的なので、-Command で [Console]::OutputEncoding を UTF8 にしてから呼び LASTEXITCODE を exit する形にする。**どちらも陽性テスト(意図的に違反状態を作りブロックされることの確認)が無ければ気づけない** — HH-028 の検出器陽性テストはフックにも適用すること。設計面: host リポジトリに remote が無ければ pre-push は永久に発火しないので pre-commit が唯一の強制点。ただし全コミットを止めないよう、ステージされたパスが監視対象に触れたときだけ検査する。core.hooksPath は clone に伝播しないため導入手順を README に書くこと。"
    tags: [git, hook, pre-commit, quotepath, non-ascii, powershell, encoding, cp932, positive-test, hh-028, hookspath, project:Project003-lab-h]
    project: Project003-lab-h
    strength: 1
    last_used: 947
    state: active
  - id: N-Project003z2dlabz2dh-20260824b
    text: "Project003 の HTML_PRINT と文字色・ツールチップの関係、engine ソースで確定(kit docs/50 §11): ①**SETCOLOR は HTML_PRINT に効かない** — HtmlAnalzeState.GetSS() は Config.ForeColor から始まり FonttagList(初期値 空)に font タグが積まれたときだけ色を変える(HtmlManager.cs:112-132, :78)。HTML_PRINT の前後に SETCOLOR/RESETCOLOR を置いても中身は既定色のまま。色を付けるには HTML 内に font color タグを書く。②**非ボタンだから灰色になる、は誤り** — DrawTo に isButton は渡るが色の分岐に一度も使われない。色は StringStyle のもので、ホバー/選択時に ButtonColor、バックログかつ colorChanged=false のとき LogColor に変わるだけ(ConsoleStyledString.cs:97-121 / ConsoleButtonString.cs:222-226)。nonbutton は通常ボタンと同じ色で描かれる。③**ツールチップは非ボタンでも出る** — Title は IsButton の分岐の外で代入され(HtmlManager.cs:535-551)、ヒットテストでも canSelect だけが IsButton を要求し pointingString は無条件に代入される(Project003Console.cs:1792-1802)。④button と nonbutton は互いに入れ子不可だが font は別スタックなので nonbutton の内側に font を置ける。∴ ツールチップと文字色は両立する: nonbutton title 属性 + 内側の font color。ただし HTML_PRINT である以上 §1 の行分断は避けられず、同一行配置とは両立しない。⑤**フォントスタイル(太字等)も①と同じ非伝播**: 手段は `FONTBOLD`(現在の style に Bold を OR。Instraction.Child.cs:1236-1248)/ `FONTSTYLE n`(ビットマスク 1=Bold 2=Italic 4=Strikeout 8=Underline。Process.ScriptProc.cs:473-485)/ HTML の `<b>`(HtmlManager.cs:720-729)の3つで、解除は `FONTREGULAR`(Regular へ**全**解除、:1272)か `FONTSTYLE 0`、読み戻しは `GETSTYLE()`(Creator.Method.cs:599-621)。**FONTBOLD/FONTSTYLE は HTML_PRINT に効かない** — HtmlAnalzeState.FontStyle は Regular 初期化で(HtmlManager.cs:77)GetSS() はその state の値を使う(:112-133) ∴ HTML 内は `<b>` 一択。`<b>` の二重ネストと対応なしの `</b>` はいずれも CodeEE。Project003.config に太字の設定項目は無い。**幅への影響は描画モードで割れる**: フォントはスタイル別に生成され計測にも渡る(FontFactory.cs:16-32) ∴ TEXTRENDERER は太字ぶん幅が増えるが、GRAPHICS は半角セルへ量子化し量子の基準 fontDisplaySize は Config.DefaultFont(常に Regular)由来(StringMeasure.cs:20,63)なのでセル数が同じなら幅も同じ。WINAPI は GetDisplayLength が例外(:71-73)。`STRLENS` はスタイル非依存なので、桁揃え領域([[N-Project003z2dlabz2dh-20260828a]] / kit docs/57・58)で太字を使うなら対象ビルドで smoke すること。補助: `GETFONT()` フォント名 / `CHKFONT(名)` 存在確認。**組込関数の存否は Function/Creator.cs の登録辞書を正とする**(FunctionIdentifier.cs だけ見ると式関数を取り逃がす)。"
    tags: [Project003, html-print, setcolor, font, tooltip, nonbutton, color, printplain, printlc, project:Project003-lab-h]
