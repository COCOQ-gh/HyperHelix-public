    state: active

  - id: N-Project003z2dlabz2dh-20260718b
    text: "Project003 のレイアウト/表示確認は3層: (1)GID バッファ → GGETCOLOR(gid,x,y) でピクセル ARGB 検証(既存 graphics suite・TextDrawingMode=WINAPI 時は CodeEE で失敗するため TEXTRENDERER が必須); (2)コンソールテキスト → HTML_GETPRINTEDSTR(lineNo) でコンソール描画済み論理行の HTML 文字列を取得(色・スタイル・タグ構造を自動テスト可); (3)スクリーンキャプチャ → Win32 BitBlt/CopyFromScreen で PNG 保存(環境依存・Minimized ウィンドウ不可・高コスト)。ERB からテキスト折り返し幅(pixel)は直接取得不可。"
