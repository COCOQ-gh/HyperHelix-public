  - id: N-Project003z2dlabz2dh-20260718h
    text: "カットイン再利用ヘルパは graphics/カットイン/カットイン.ERB(kit 還元済)。公開API: CUTIN_MAKE_PANEL(gid,name,w,h,style,base,accent)=意匠付き静的スプライト / CUTIN_MAKE_ANIME(baseGid,name,w,h,style)=自律フレーム / CUTIN_DRAW_ISLAND(name,x,y,w,h)=HTML_PRINT_ISLAND 1コマ / CUTIN_SLIDE_POS(progress0-1000,startX,goalX,ease)=純粋イージング位置(RESULT返し、0=linear/1=ease-out) / CUTIN_RUN_SLIDE(...)=スライド全ループ(TWAIT)。意匠 L_STYLE は 0=カード/1=バナー帯/2=ネームプレート、未知は0にフォールバック。GID基点 CUTIN_GID=3000000。**改行の罠**: dev-support/erb-v2/graphics 層と対応 autotest・ERH は実態 LF 統一(リングバー/波紋/GID管理 等)。Codex は新規/編集ファイルを CRLF 化しがち→レビューで層の LF へ戻す(CLAUDE.md 改行を変えない)。Project003 は LF/CRLF どちらでも動くため機能影響は無いが diff ノイズ+層不整合を招く。"
    tags: [Project003, graphics, cutin, reusable, helper, api, style, line-ending, lf, codex-review, project:Project003-lab-h]
