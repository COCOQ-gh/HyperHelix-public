  - id: N-Project003z2dlabz2dh-20260826a
    text: "Project003 の描画は3レイヤーで、**スクロール量が入るのはログ行だけ**(正典は kit docs/56)。OnPaint(Project003Console.cs:1256-1318): ログ行は ScrollBar.Value 由来の pointY を受け取る / **CBG(CBGSETG)は MainPicBox 下端基準・island(HTML_PRINT_ISLAND)は y=0 上端基準で、式にスクロール項が無い**。当たり判定(:1697-1725)も同じ分裂で、見た目だけでなくクリック位置もズレる。**固定レイヤーを追随させる手段は無い**: ERB に SCROLL 系組込命令が0件、スクロールは vScrollBar_Scroll→RefreshStrings(MainWindow.cs:389-395)で完結し ERB へ非通知。∴ 解は『背景をログ行へ移す』か『スクロールさせない』の二択で、**恒久解は1行1背景の div**(div/img とも display 既定=Relative で描画点に pointY が入る。HtmlManager.cs:1070-1140 / ConsoleDivElement.cs:84-90 / ConsoleImagePart.cs:157-182)。複数行を1枚の高さNpx div で塗る手は、**アンカー行が可視上端を抜けた瞬間に背景ごと消える**。SPRITECREATE と <img src> は同一辞書(AppContents.cs:36-64)なので既存 GCLEAR スプライトは img 専用行で流用できる。CBG の z は -zdepth 降順(:110-116、z=0 が本文の番兵)= **大きいほど奥**。"
