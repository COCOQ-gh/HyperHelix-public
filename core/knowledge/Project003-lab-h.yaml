  - id: N-Project003z2dlabz2dh-20260824d
    text: "Project003 で点線にならない完全な枠線を描く方法(kit docs/51、engine ソース確定): DRAWLINE/CUSTOMDRAWLINE/手書き文字罫線は Config.DrawLineString(既定\"-\")の**文字を DrawableWidth いっぱいに繰り返しているだけ**(構造上、線ではなく文字列)で、点線に見えるのは仕様でありバグではない(Project003Console.Print.cs:592-608 getStBar)。**GDRAWRECTANGLE は存在しない** — C# 側に実装のみあり(GraphicsImage.cs:140)ERB へ未登録(Creator.cs にエントリなし・Project003-builtins.json でも False)。完全な線を描くには GDI+ の Pen を使う2経路: ①`<div border_width='N' border_color='#RRGGBB'>`(HTML_PRINT/HTML_PRINT_ISLAND)= ConsoleDivElement.DrawTo が TextDrawingMode 分岐の外で graph.DrawRectangle(Pen,...) を呼ぶため WINAPI でも動く。②`GSETPEN(ID,cARGB,width)` + `G_POLYGON_POINT_ADD` + `G_POLYGON_DRAW` = g.DrawPolygon(Pen,...)。【訂正 2026-08-25・docs/55】この経路は**使用不可扱い** — 『三角形描画実績』は失敗再現用 fixture(docs/35:417)の誤読で、検証記録は RING-DYN-005 **FAIL**(ログ無し終了・docs/35:408)、出荷 ERB に使用実績ゼロ。枠線は div border 一択。ただし TextDrawingMode=WINAPI では CodeEE 例外(非互換)。太い Pen は外周がキャンバス外にはみ出るので線幅の半分だけ内側にオフセットする。**落とし穴**: GraphicsImage.cs の GFILLRECTANGLE doc コメントは実装と不一致(cARGB引数は無い。実際は ID,x,y,w,h で色は GSETBRUSH 別指定)— C# の doc コメントを鵜呑みにしない。"
