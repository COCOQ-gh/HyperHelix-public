  - id: N-Project003z2dlabz2dh-20260718f
    text: "Project003 PRINTW/PRINTFORMW/WAIT テストパターン: 全て ReadAnyKey(InputType.EnterKey) で待機するため WAITING_ONEKEY ENTER で解除可能。手順=(1) PRINTL [[AUTOTEST]] WAITING_ONEKEY ENTER を PRINTW より前に置く→(2) ランナーがログ検出→200ms sleep→WM_KEYDOWN 0x0D(Keys.Return)を PostMessage→richTextBox1_KeyDown→PressEnterKey→WaitInput 解除。WAITING_ONEKEY <char> / WAITING_INPUT <val> は不可(文字入力を受け付けない)。既存インフラへの変更不要。出力内容アサートは HTML_GETPRINTEDSTR または GETLINECOUNT で行う。"
