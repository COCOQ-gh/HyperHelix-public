  - id: N-Project003z2dlabz2dh-20260826b
    text: "Project003 HTML の同一行・複数 div レイアウト(枠を左右に分けるなどの実務): ①**1行に置ける div の数に上限は無い**(state.IsDiv は『解析中』フラグで </div> で解除、HtmlManager.cs:1072/:691)。②ただし **ConsoleDivElement.SetWidth は width 属性を無視して内側テキストの幅しか flow に返さない** ので、2つ目以降の div は1つ目の消費幅ぶん右へずれる。③解決は **<nonbutton pos='N'> で包んで PointX を固定**すること — CalcPointX は PointXisLocked なら渡された pointX を捨てて locked 値を使う(ConsoleButtonString.cs:194-213)。pos の単位は rel_px*FontSize/100。④div の xpos/width/height は **px サフィックス付き=絶対px / 無し=値*FontSize/100**(ParseSizeValue, HtmlManager.cs:1186-1199)。**単位無しで書けばフォントサイズ非依存の桁指定**になる(半角1桁=50)。⑤**版ずれ注意**: ソース d380408 は pos 使用行に <nobr> と align=left を要求し無ければ CodeEE(HtmlManager.cs:397-407)だが、Project001 SHOP.ERB は <nobr> 無しで pos を実用している(SHOP_TAB_DIVS/SHOP_FRAME_DIV, SHOP.ERB:646-700)∴ 実行ビルド 7b7dd3bf では要求されていない。CodeEE が出たら行頭に <nobr> を足す。⑥relative div なのでスクロールに追随する([[N-Project003z2dlabz2dh-20260826a]] / kit docs/56)。⑦**空 div は要素そのものが生成されない**(ConsoleDivElement の生成は『div の内側にテキストがある』分岐の中だけ、HtmlManager.cs:313-341)— 必ず半角空白1つ等を入れる ∴ 塗り div は必ず半角1桁の flow 幅を発生させる。⑧∴ 塗り div は本文行に混ぜず**キャリア行**(直前の空行を HTML_PRINT へ置換)にまとめ ypos で送る — 本文行を1文字も変えないのでズレ0。本文側で打ち消す案は nonbutton の入れ子が CodeEE(:947-948)のため実質不可。⑨**文字の桁と塗りの px を噛み合わせる実務は kit docs/57 が正典**。吸収できるのはサブピクセル級(セル左に1桁余白)だけで、**パディング下限による1桁単位の押し出しは塗り幅では吸収できない**(値が右揃えかつ右ブロック右端が行幅と一致するため) — 左ブロック幅の不変条件で潰す。"
