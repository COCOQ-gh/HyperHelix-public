  - id: N-Project003z2dlabz2dh-20260823c
    text: "dev-support -> kit の還元漏れは **ERB 層だけを見ると過小評価する**。実測: ERB 層の diff は TEXT_REVEAL.ERB 1件だけだったが、tools/ まで調べると AUTOTEST_V2_UI が pass=41(dev-support 72)、AUTOTEST_V2_GRAPHICS が pass=26(同 36)で、直近3サイクル分(カウントアニメ/カットイン/テキストリビール)の**テストが丸ごと取り残されていた**。ノートに『kit 還元済』と書いてあっても ERB のみを指している場合がある。**還元の確認は4層 ERB + tools/AUTOTEST_* + runner の expectedPass の3系統を必ず見る**。注意: kit の Invoke-GenericV2Smoke.ps1 は dev-support 版と**別実装**(kit 内パス解決)なので丸ごとコピー禁止 — expectedPass の数値だけを合わせる。display suite と DEMO_* は kit に対応物が無く還元対象外。恒久的な検出は `dev-support/tools/Test-KitSyncDrift.ps1`(引数なしで exit 0/1、-Quiet あり、SHA-256 バイト一致、改行差も検出)。同期済みで `kit sync: OK (139 files compared)`。"
