  - id: N-Project003z2dlabz2dh-20260718e
    text: "Project003 HTML_PRINT 既知の罠: (1) HTML_PRINT 'str' はデフォルト lineEnd=true で行を終了する。(2) ConsoleDivElement.SetWidth は width 属性を無視してテキスト幅のみ使う→背景矩形が重複。横並び固定幅は display='absolute-lefttop'+xpos。(3) addDisplayLine は SetAlignment を merge 前に呼ぶ→ALIGNMENT RIGHT+複数 PRINT で値が画面外へ。ALIGNMENT RIGHT は PRINTFORML 1命令で完結。(4) SETBGCOLOR は全体背景のみ。文字単位背景は div background_color。(5) HtmlAnalzeState は Config.ForeColor で初期化→SETCOLOR は HTML_PRINT テキスト色に無効。"
