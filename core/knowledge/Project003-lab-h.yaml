  - id: N-Project003z2dlabz2dh-20260718a
    text: "Project003 autotest で TRAIN フローを自動駆動するには: (1)BEGIN TRAINを使わず @EVENTTRAIN/@SHOW_STATUS/@COM_ABLExx/@COMxx 等を @SYSTEM_TITLE から CALL で直接呼ぶ。(2)NEXTCOM変数が>=0なら C# 側が入力待ちをスキップして自動コマンド選択する(Process.SystemProc.cs endCallEventTrain)。(3)INPUT/PRINTWが内部にある関数はI/O分離(純粋計算部を別関数化)か Win32 PostMessage注入(ランナーがMAINWINDOWHANDLE経由でWM_KEYDOWN VK_RETURN送信)で解消。PRINTFORM/PRINTLの全テキストはOUTPUTLOGでファイルキャプチャ済み。"
    tags: [Project003, autotest, train, nextcom, input, io-separation, project:Project003-lab-h]
    project: Project003-lab-h
