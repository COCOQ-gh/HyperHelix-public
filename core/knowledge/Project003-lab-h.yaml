  - id: N-Project003z2dlabz2dh-20260718i
    text: "Project003 はウィンドウ非アクティブ(フォーカス喪失=OS 非フォアグラウンド)でも処理継続。スクリプト実行/アニメ再描画/時間待機はフォーカス非依存: redrawTimer は System.Windows.Forms.Timer(WM_TIMER メッセージループ駆動、Project003Console.cs:79)、TWAIT/時間制限INPUT のタイムアウトは System.Timers.Timer(スレッドプール、:568)。IsActive=Form.ActiveForm!=null(:240)。デアクティブ時 pause/suspend 無し。停止するのは入力系のみ: GETKEY/GETKEYTRIGGERED は非アクティブで 0(Creator.Method.cs:4070)、ISACTIVE も 0。ただし PostMessage(WM_KEYDOWN 直接投函)は非アクティブ/最小化でも届く(オートテスト注入の根拠)。**最小化は別**: タイマー/スクリプトは進むが OnPaint 実描画されず視覚的に描かれない(capture 不可)。含意: 機構A 自律アニメは Alt+Tab しても再生継続。詳細 kit docs/48。"
