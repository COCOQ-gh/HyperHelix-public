  - id: N-Project003z2dlabz2dh-20260825a
    text: "Project003 の ERB 汎用テキストファイル IO は SAVETEXT/LOADTEXT の2式中関数のみ(正典は kit docs/54): SAVETEXT(str,fileNo{,force_savdir,force_UTF8})→1/0、LOADTEXT(fileNo{,...})→全文。**ファイル名は txtNN.txt 固定**(自由名不可・番号スロット方式、Creator.Method.cs:4250)、既定の保存先は**ゲームルート直下**(UseSaveFolder 既定 false、Config.cs:172-176)、既定エンコーディングは **Shift-JIS**(Config.cs:17。config か引数で UTF-8)。**存在検査・列挙・削除の命令は無い** — LOADTEXT は不在も例外も空文字で区別不能なのでマジックヘッダ行を自作必須。読み込み時 \\r 全除去(改行は LF 前提で設計)。SPLIT は分割先配列超過を無警告切り捨て。両関数とも例外を握り潰すため失敗検知は戻り値のみ。Project001 2026-08 実測(動作・ルート直下 CP932)とソース読解一致。キャラ移送の名前=値形式設計案と SAVECHARA 比較は docs/54 §3-4。"
