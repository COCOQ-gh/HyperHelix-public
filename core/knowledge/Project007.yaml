  - id: N-070
    text: "プロジェクト基本方針(2026-07-05 ユーザー決定): Project006(Project006 K 0.5)をゲーム開発基盤とし、Project007 の防衛TD要素(ダンジョン防衛・罠・モンスター配置・勇者侵攻・迎撃 — Project007/ERB/07_ダンジョン/ + docs/04,06,07)を Project006 へ移植する。Project006=改修対象・Project007=読み取り専用の移植元。移植作法は portable-kit(名前衝突grep=N-023 の教訓を含む)。全タスクの S1 はこの方針との整合を確認する。"
