  - id: N-072
    text: "Project006 の autotest ハーネス手順(TASK-20260715-001 で実証・pass=7 fail=0)。(1)**config 乖離なし**: Project006 の実 config は元から『システム関数の上書きを許可する:YES』なので autotest 用 config は**実 config の逐語コピー**でよい(N-057 が Project001 で警告する config 乖離が起きない)。バイナリセーブ:YES のため #DIM SAVEDATA も素直に使える(N-012 のブロッカーは非該当 — ノートは結論でなく条件を見る)。(2)**QUIT ではプロセスが終了しない**: WindowStyle Hidden 起動だと QUIT 後も 240秒生存する。WaitForExit を完了シグナルにするのは誤り。**Project003.log に `[[AUTOTEST]] SUMMARY` が出るまでポーリング(約10秒で出る)→ kill** が正解。(3)**probe は値を表明する**: Project003 は未宣言変数の参照をロード時エラーにするため、変数を名前で読み書きし値一致を assert すれば『AUTOTEST がロードでき pass する』こと自体が ERH/CSV ロード成功の機械的証拠になる(N-057 の load 系偽通過を構造的に塞ぐ)。(4)**警告の帰属はベースライン差分で**: Project006 出荷時の Project003.log(**UTF-16LE**・2023-08-26)がロードログとして同梱されており無料のベースラインになる。Project006 は**出荷時から** Lv2 約3500件(`IS_COM_FIRST` 未定義・`@KOJO_EVENT` 未定義など)+エラー1件を抱えるので、これを自分の変更のせいと誤認しない。判定は『ベースラインに無い警告種別が増えたか』。(5)**grep 前に `file` で encoding 確認**: UTF-16 のログへ UTF-8 前提の grep をかけると 0件=正常と読めて検証を偽通過させる(実際に発生)。(6)@SYSTEM_TITLE は ERB/SYSTEM/NEWGAME.ERB が唯一の定義元 — 隔離ツリー内でその1行だけ改名して無効化し AUTOTEST.ERB へ定義(ファイルごと落とすと同居関数が未定義化してノイズ化。上書き precedence にも依存しない)。"
    tags: [Project006, Project003, autotest, harness, quit, process-exit, polling, baseline, Project003-log, utf16, encoding-grep, false-pass, load-verify, erh, savedata, config, erb-port]
