  - id: N-079
    text: "Project006 の階層戦(防衛TD)は **ABL_POWER** で組む。**BATTLE_CALC(SLG_COMBAT.ERB:423)は不採用** — `@BATTLE_CALC(攻撃側勢力, 攻撃側部隊, 対象勢力, 対象部隊)` は勢力+部隊(軍団)単位で GET_COMMANDER_ALL / BATTLE_SOL(兵数) / CITY_OWNER / KOJO_BATTLE_DIALOGUE_MATCH を要求し、1体 vs 1体へ通すには偽の勢力/部隊の捏造が要る。**@ABL_POWER(Lv, キャラ番号 = -1)**(SLG_FUNCTION.ERB:1905)が per-chara 戦闘力の正しい原始関数: (1)`#FUNCTION`= **式メソッドなので CALL 不可**、`変数 = ABL_POWER(ABL:(キャラ):武闘, キャラ)` の形(定石 SLG_AI_FUNCTION.ERB:60)。(2)基礎値 = 500 + 400*Lv → Lv0=500 / Lv2=1300 / Lv5=2500。(3)**RAND 0箇所 = 決定的**なので autotest に載る。(4)**第2引数は省略可(-1 = 補正なし)** → 敵を**実キャラ無しで Lv だけ**で評価できる(Project006 は docs/04 が敵用に推奨する帯 288-399 に **Chara CSV が1枚も無く ADDCHARA 不可**、R_CHARA 生成は乱数で autotest の決定性を壊すため、この省略が逃げ道になる)。(5)第2引数にキャラを渡すと妊娠/崩壊/好感度/従属度/難易度(CONFIG:314)の補正が乗る → autotest は**素の新規キャラ**(好感度0・素質なし・MASTER と同一勢力)で補正100%にする。実証 TASK-20260715-008: 与ダメージ = BASE*守将戦闘力/侵入者戦闘力 で Lv5→961(撃退)/ Lv2→500 / Lv0→192(突破)、手計算と完全一致・2回実行で決定的。"
    tags: [Project006, Project003, abl-power, battle-calc, slg, combat, dungeon, tower-defense, function-expression, determinism, autotest, addchara, r-chara, erb-port]
    project: Project007
    strength: 6
