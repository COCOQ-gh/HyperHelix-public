  - id: N-083
    text: "Project003 の SHOP 系 UI は autotest で画面駆動しない — UI 関数を**直接 CALL して状態遷移を表明**する(TASK-20260716-007 で pass=16 実証)。(1)入力経路の実測(Project006 SHOP_LIFE.ERB): 入力 < COLUMN_LEFT_MENU_START_VALUE(=11)→ `EVENTBUY_SUB{NN}(入力)` / 100+キャラNO → 変換されて `USERSHOP{NN}(キャラ)`。カスタムボタンは 0-9 帯に置けばキャラ変換と干渉しない。(2)**SKIPDISP 1 は WAIT だけでなく表示も殺す** — PRINTFORMW を含む UI 呼出だけを SKIPDISP 1/0 で挟み、probe の表明出力は挟まない(全体に掛けると SUMMARY ごとログから消えテストが無音化する)。(3)メニュー選択状態は MENUVAR が使える(メニュー移動時に EVENTBUY_LIFE が `VARSET MENUVAR, 0` するため新 FLAG 不要)。(4)新規コマンドは `SHOP_LIFE{NN}_{名前}.ERB` を置くだけで自動登録(TRYCALLFORM 走査)— 既存ファイル修正ゼロで UI が足せる。(5)probe 用キャラは ADDCHARA 1 の素の新規キャラ(CHARANUM-1)。タイトル時点は CHARANUM=0 なのでキャラ番号は 0 になる — 期待値は定数でなく変数(TESTC)で持つ。"
    tags: [Project006, Project003, autotest, ui, shop-life, skipdisp, printformw, menuvar, eventbuy-sub, usershop, direct-call, erb-port]
    project: Project007
    strength: 3
    last_used: 538
    state: active

  - id: N-082
    text: "Project006/Project003.NET の実機検証2教訓(TASK-20260716-008)。(1)**Project003.NET は未定義関数への CALL 到達で致命停止する** — 旧 Project003 でロード時 警告Lv2『存在しません』止まりだった参照は全て実行時の地雷。Project006 K 0.5 は口上共通ディスパッチャ16関数(KOJO_EVENT/IS_KOJO 等)が配布物から欠落しており **vanilla では新規ゲームを開始できなかった**(NEWGAME→INIT_COMMON→CREATE_KOJO_DAILY_MAP、NEWLOOP→TALENT_CHECK→KOJO_EVENT で停止。出荷 Project003.log に同エラーの記録あり=出荷時から)。是正は TRYCALL 化(単発)+ SYSTEM/PATCH_口上スタブ.ERB(no-op スタブ・表示層のみでロジック非干渉・警告72種が解消)。autotest は @SYSTEM_TITLE を乗っ取るため**起動経路のこの種のバグを構造的に踏めない** — 通しプレイ(実発火)検証の存在価値。(2)**実機通しプレイの駆動定石**: 全ボタンは PRINTBUTTON の入力値で押せる(値はソース grep で確定 — 勢力[ランダム]=97/主人公一覧=99/開始=0/完了=100/特殊勢力完了=9999/次期へ=81/一回待機=82/キャラ=100+NO)。kit(automation-portable)推奨の PostMessage 注入は本 RichEdit では不発 → SetForegroundWindow+SendKeys が確実。**[ランダム]系ボタンは乱数で結果が変わるため固定入力列が脱調する** — 画面(ウィンドウキャプチャ)を確認してから次を送る段階駆動が正。おまけ: codex exec はプロンプト引数が空だと stdin を待ち続ける — WO はファイル→stdin パイプで渡し、出力は tail 経由でなく直接ファイルへ。"
    tags: [Project006, Project003, Project003-net, undefined-function, trycall, stub, kojo, fatal-call, playthrough, sendkeys, postmessage, printbutton, input-value, codex-exec, stdin, erb-port]
    project: Project007
