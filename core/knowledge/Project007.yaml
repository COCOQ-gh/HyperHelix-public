  - id: N-080
    text: "Project007 の罠(ERB/07_ダンジョン/DUNGEON_TRAP.ERB・1561行)は **26種すべてキャラ結合**で、Project006 へ literal 移植できない(TASK-20260715-009 で全数計測)。作用先は BASE:A:0(体力)/ BASE:A:1(気力)/ CFLAG:A:503(状態)/ CFLAG:A:680-682(能力ダウン)/ TALENT:A:*(天使・痛みに弱い)/ SAVESTR:A(名前)で、加えて NET_TRAP 以外の全種が RAND(回避率・クリティカル・ダメージ幅)を持ち決定的 autotest とも衝突する。**侵入者に実キャラを持たない設計**([[N-079]])では適用先が無い → **状態異常・能力ダウン系の罠は『侵入者の実キャラ化』とセット**であり、実キャラ化(キャラ帯/生成方法。docs/04 推奨帯 288-399 は Chara CSV 不在で ADDCHARA 不可)が決まるまで着手できない。移植は**概念の移植**に留め、ダメージ罠1種(効果ハードコード)で受入『罠が敵にダメージ/状態異常を与える』を満たした。**配置上の罠**: 罠は `@DUNGEON_FLOOR_BATTLE` の**中に置いてはいけない** — 同関数は守将 < 0 で早期 RETURN するため、守将のいない階で罠が作動しなくなる。`@DUNGEON_DEFENSE_TURNEND` 側の階層戦呼出**より前**に置き、罠死なら戦闘を省く。教訓の一般形: **『Xの直前に挿入せよ』という計画は X の早期 return を確認してから従う**。また移植可否は数種でなく**母集団を全数計測**して判断する(数種だけ見ると『たまたま結合している』で済ませ、構造的不可を見落とす)。"
    tags: [Project007, Project006, trap, dungeon, tower-defense, erb-port, chara-coupling, rand, determinism, early-return, scope, porting-feasibility]
    project: Project007
    strength: 1
    last_used: 520
