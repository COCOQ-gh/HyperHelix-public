  - id: N-085
    text: "Project003 の配列変数の既定値は0であり、『-1=なし/未配置』契約の SAVEDATA を DELETE_CHARA/BASE 参照などの**生存操作**に使うと、契約が確立する前(新規ゲームの初回 INIT・キャラ未登録時)に **index 0(=マスター)を誤操作 or 範囲外エラー**になる(TASK-20260716-016 で実キャラ化した侵入者 handle がクラッシュ)。ガードは `>= 0` では不十分 — **『生存範囲内(< CHARANUM)かつ 種別判定(IS_SP_CHARA 等)』**で守り、削除処理は1関数へ集約する(RESET/INIT から共用)。この『既定値0を生存値と誤認』は Project006 防衛TD で **P6(守将 DUNGEON_FLOOR_DEFENDER)と P8(侵入者 DUNGEON_INVADER_CHARA)で2回**発生した横展開漏れ — 新たに『-1=なし』の handle を足すたびに『既定値0でこのコードは何をするか』を必ず問う。関連: 侵入者の実体は **@ADD_VOID_CHARA()**(CSV 不要・NO≥2000 の SP キャラ帯・IS_SP_CHARA で各リストから自動除外・DELETE_CHARA の ELSE 分岐で綺麗に消滅)が敵キャラの正しい生成法。ただし ADD_VOID_CHARA は #FUNCTION でなく CALL 用 — `変数 = ADD_VOID_CHARA()` は不可で `CALL ADD_VOID_CHARA` → `RESULT`([[N-079]] の #FUNCTION/CALL 区別を生成側にも適用)。HPは BASE:体力・戦闘Lvは ABL:武闘 に載せれば ABL_POWER 第2引数に実キャラを渡せ、状態異常/能力ダウン罠の土台になる。"
    tags: [Project006, Project003, default-zero, sentinel, chara-handle, delete-chara, add-void-chara, is-sp-chara, function-vs-call, result, invader, dungeon, tower-defense, cross-application, erb-port]
    project: Project007
    strength: 5
    last_used: 553
    state: active

  - id: N-Project007-20260717c
    text: "Project003 ERB の実機で判明したカスタム変数/返却/局所値の三点セット(TASK-20260717-008 P14)。(1) `#DIM SAVEDATA CHARADATA X` の scalar も参照は `X:キャラ:0` と末尾要素添字が必要。`X:キャラ` はキャラ次元がずれて範囲外になる。(2) CALL用procedureの返値は終端で `RETURN n` を使う。`RESULT=n` だけ置いてfallthroughすると呼出側は0を受け得る。(3) `#DIM` の局所作業変数は再呼出時の0初期化を仮定せず、dispatcherの分岐キー/ID/価格は関数冒頭で明示初期化する。静的な括弧・block数検査では捕捉できず、値を表明するdirect-call probeで検出する。"
    tags: [Project006, Project003, erb, charadata, procedure-return, result, local-variable, explicit-init, autotest, p14]
    project: Project007
    strength: 1
    last_used: 541
    state: active

  - id: N-074
    text: "Project003 ERB の静的解析ツール(重複検出・関数抽出)は3つの仕様を織り込む: ①イベント関数(EVENTTRAIN 等)は複数定義が正規仕様(#PRI/#LATER)なので重複警告から除外 ②[SKIPSTART]〜[SKIPEND] はパーサー不活性領域なのでスキャン除外 ③行頭 @\" は文字列補間の継続行であり関数定義ではない(Project006 で偽陽性21件)。新しいコーパスに掛けるたび新方言が出る前提で、検出リストは必ず現物サンプル照合してから使う(AP-009)。Project007 初回は①②漏れで偽陽性70件(実重複0件)、Project006 は③漏れ(実重複216件は新旧ファイル併存)。"
    tags: [Project003, erb, static-analysis, detector, false-positive, skipstart, event-function, string-interpolation]
    project: Project007
