    state: active

  - id: N-087
    text: "Windows(case-insensitive FS)で Project001 の autotest `-Clean` が突然『解釈できない識別子』(CSV由来の名前 性知識/オトコ 等)で line 54 付近 pass=0 halt する場合、**CSV の大小文字衝突**を疑う: git の追跡名は `Data/CSV/exp.csv`(小文字)だが、何かが `Exp.csv`(大文字)を作ると git が追跡ファイルを deleted 扱いにし、-Clean リビルドが Abl.csv/Talent.csv/exp.csv を欠いた Data ツリーをコピー→全CSV名が未定義化する。復旧: `git checkout -- Data/CSV/Abl.csv Data/CSV/Talent.csv Data/CSV/exp.csv`。委譲executorも踏みうるので autotest 失敗時の鑑別に含める(コード修正より先に git status でCSV deleted を確認)。"
    tags: [Project001, autotest, csv, case-fold, windows, git, clean-rebuild, delegation, gotcha, troubleshooting]
    project: Project001
    strength: 1
    last_used: 604
    state: active

  - id: N-088
    text: "Project001 の `BEGIN SHOP`(EVENT.ERB:11 等)では PRINTBUTTON の値域で挙動が分岐: **0-99 は Project003 の購入レンジ**(その番号の Item.csv アイテムを購入処理→売り物未登録(ITEMSALES==0)なら内蔵メッセージ『(品名)は売っていません』、on-saleなら@EVENTBUY)、**≥100 は @USERSHOP 行き**(コマンドコード)。∴ショップのコマンド/カードボタン値は **必ず≥100、かつ既存コマンド(100-160/751-755/900/999)とも Item.csv定義IDとも非衝突**にする。実害例: 巫女カードのボタンが値10-32(=10ビデオカメラ/12搾乳器/30鞭等の実アイテムID)で『売っていません』だけ出て機能せず(TASK-280設計欠陥, playtest未実施で潜伏)→TASK-350で810-832へ退避し@USERSHOP+@MIKO_CARD_ACTIONで処理。クリック→経路はProject003内部=autotest不可、helper化して陽性test+playtest視認。"
