  - id: N-051
    text: "Project002→kami の ERB 移植で頻出する Project003 文法/環境の落とし穴: (1) CALL に文字列リテラル引数を渡す時は必ずクォートする(CALL F(\"基礎\",0); 無クォートだと『\"基礎\"は解釈できない識別子です』)。(2) PRINTFORM/PRINTFORML 内で整数式は {式}、文字列式は %式% (整数に %% を使うと『%%の中の式が文字列式ではありません』)。(3) #DIM I / #DIM N は Project003 予約変数名と衝突し警告Lv2(『変数名\"I\"はProject003の変数名として使われています』)→ ローカルは L_I 等にする。(4) autotest 回帰ブロックで ADDCHARA など CHARANUM/キャラ前提を変える処理を suite 途中に置くと後続テストの index 前提を撹乱し count 不一致(fail=0 のまま pass が1足りない)→ chara 変異を伴う回帰は suite 末尾に置く。(5) literal 丸写しは依存差で不能なことが多く『構造を忠実移植+kamiデータ流用(ABLNAME名前ベース反復)+未実装はプレースホルダ/仮値』が現実解。実証: 能力表示8タブUI移植(TASK-235)。"
    tags: [Project001, Project003, erb-port, syntax-gotcha, printform, reserved-var, autotest, info-screen]
    project: Project001
    strength: 8
    last_used: 458
    state: active

  - id: N-052
    text: "『UI変更が反映されない』報告は、同一機能の入口経路を全 grep して真因を特定する。Project001 の能力表示は2経路: (A) ステータスメニュー SHOP→SHOW_CHARADATA_MENU→SHOW_CHARADATA_PAGE(+SHOP_SEARCHCHARA) は TASK-235 で新8タブUI に差替済、(B) 調教画面 PRINT_TRAIN→SHOW_INFO_PAGE_1→SHOW_INFO_ABL は旧共有レンダラのまま。最頻は (B)。新UIだけ作っても (B) には波及しないので『反映されない』。共有レンダラ(SHOW_INFO_ABL)を直すと両経路に効く=波及効率が高い。また SHOW_INFO_ABL は ABL>0 でレベル0能力を隠していた→全mapped能力を常時表示に(性技/奉仕が値0でも見える)。"
    tags: [Project001, info-screen, entry-points, shared-renderer, abl, train-screen, not-reflected]
