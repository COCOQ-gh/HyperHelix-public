  - id: N-Project001-20260823e
    text: "**「この番号/値でも動くはず」という主張の検証は、経路ごとに分けて測る — 同じ値でも層によって答えが逆になる。** 実例(TASK-Project001-20260823-053): 『キャラは NO 250 以上でも口上呼び出しに問題ないはず』というユーザー指摘は、**口上については完全に正しく、CSV 参照については誤り**だった。口上ディスパッチは `TRYCCALLFORM TRY_{NO}` → 本体 / `CATCH` → `_X`(TEXT_KOJO.ERB:43-48 ほか全ディスパッチが同形)なので **NO に依存しない**(実測: NO=251 で `KOJO_CATCH_TAKEN` → 生存 / 対照 NO=1 は `TRY_FOUND`)。一方 **CharaCSV を持たない NO は落ちる**: `CSVNAME`/`CSVTALENT`/`CSVCFLAG` は **0 や空文字を返さず『定義していないキャラクタを参照しようとしました』で実行時エラー**、`ADDCHARA` は『作成しようとしました』。**最重要の本番経路**は能力ページの説明タブ — `SHOW_INFO_UI.ERB:470-472`(と `SHOW_CHARA.ERB:421-423`)が `TFLAG:201 = NO:対象` を置いて `@CHARA_PROFILE` を呼び、その冒頭の `CALL CALC_CHARABUY` が **買値算出のために `ADDCHARA ARG`(SHOP_CHARALIST.ERB:448)で CSV から一時キャラを実体化する**ため、CSV 不在番号では**無条件に落ちる**(実測: NO=250 生存 / NO=251 で :448 エラー)。∴ **制約の正体は『250 固定』ではなく『CharaCSV が実在する番号であること』** — `Chara251-299.csv` を用意すれば 251-299 も使え、生成巫女が個体別 NO を持てるようになる([[N-Project001-20260821e]] の `TFLAG:210` 回避策が不要になる)。**教訓の一般形**: (1) 反証は『真か偽か』の二値で扱わず、**経路(層)ごとに独立のプローブ**を立てる。片方の結論でもう片方を塗り潰さない。(2) **コードのそばにある前提コメントを信じない** — `TALENT_NEWBORN.ERB:77` は『CSV に無い場合 CSVTALENT は 0 を返す』と書いていたが実測と逆で、誤情報が実装のすぐ上に居座っていた(本タスクで是正)。(3) ガードの有無で結論が変わるので、**同じ関数でも `EXISTCSV`/`GETCHARA` ガード済みの呼び出しと素の呼び出しを分けて数える**(実測: 家系表示・`@CHARA_PRICE`・名前テーブルはガード済みで安全、`@CALC_CHARABUY`・`@SHOW_ADDITIONAL_INFO`・`@PARENT_TALENT` が素)。関連 [[N-Project001-20260823d]] [[N-049]] [[N-Project001-20260823b]]。"
