  - id: N-Project001-20260821b
    text: "この Project003 ビルドは SET_BUTTON_TAG(label, \"\", tooltip) の空ボタン値で <nonbutton title='...'> を生成し、クリック不可・SHOP 入力値にならないグレー可のツールチップ要素になる。条件つきコマンドを『満たすまで選べないが条件はホバーで分かる』形にできる(選択可能ボタンにはしない)。tooltip の実ホバー表示は autotest 不能で、HTML/title 文字列の存在までを assert で固定し見た目は playtest 委譲。適用例: SHOP 巫女カテゴリ [101]交神の儀/[116]人化逢瀬 の未達時グレー非選択エントリ(TASK-Project001-20260819-034, WO-015)。dispatch 側の既存ガードは維持し未達押下は no-op にする(表示層だけで実行可否を判断しない)。"
