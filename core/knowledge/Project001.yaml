  - id: N-103
    text: "大規模 worklist(コード埋め込みフック等)の機械棚卸しは第一次分類として扱い、精密判定は抽出時の per-function サーベイで確定する(手順 §6-C ルール1)。Project001 口上 `CALL SELF_KOJO` 走査(TASK-20260701-003, 手順書 §6-D)の教訓: (1)隣接±N行の PRINT 有無ヒューリスティックは台詞が関数内に散在する複雑関数(例 EVENT_NINSHIN 妊娠出産 170/171/172/174)を false-negative で『空』に誤分類する。(2)ID 抽出の単純正規表現 `,\\s*<数字>` は構文バリアント(`SELF_KOJO(話者,ID)` 括弧形式・変数ID・`SELF_KOJO_X` 既定ハンドラ)を取りこぼす。(3)空プレースホルダ(`;CALL` のみ・隣接台詞無=要原典台詞authoring, [[N-101]])と抽出可能を機械では確実に弁別できない。→機械走査は gross な内訳(総数94=済26/残68・SYS36/COMF32・カテゴリ別)とクリーン候補プール提示に使い、enshrine しない(限界を明記)。実証: TASK-20260701-003。関連 [[N-102]]。"
