  - id: N-Project001-20260819a
    text: "executor(Codex)成果物の受入で機械ゲートが赤になったら、直す前に『変更あり／HEAD(stash)』を交互に各2〜3回回して変更由来か harness 由来かを切り分ける。実例: WO-004(UI 4件)の受入で Interactive suite の pd.omikuji.text が 3/4 で text-fail、HEAD では pass、executor 側の run では pass — 最終 Project003.log には期待文字列が存在しており、原因は Run-Project001Autotest.ps1 の in-loop EXPECT_TEXT 判定が OUTPUTLOG の truncate+rewrite 途中の部分ログを読んで偽 fail を確定し、final pass が processed 済みとしてスキップしていた race。修正=final pass で $textPass/$textFail/$textProcessed を最終ログから再計算(以後 3/3 pass)。教訓: (1)『判定を最初に見た時点で確定し後で再評価しない』設計は部分観測の race を抱える=最終状態で再計算する。(2)偶発 fail を『flaky』で流さず切り分ける(過去に流された可能性がある)。(3)executor 側 pass/orchestrator 側 fail の食い違いは harness 由来を疑う根拠になる。"
