  - id: N-Project001-20260826f
    text: "**検証ゲートが『遅い』とき、待っている対象が成果物ではなく実行主体になっていないか疑う。そして『フレーキーだ』と言う前に、そのゲートが陽性を検出できることを先に証明する。** 実測(2026-08-26・§1-V㉗): 起動警告ゲートは `QUIT` を書いたスタブで Project003 を起動し、プロセス終了を待って起動ログを読んでいた。**時刻を分離して測ると、ログは 2.62 秒で最終サイズに達するのに、プロセスは 100 秒観測して一度も自力終了しなかった**(タイトル起動の Project003 は QUIT で終わらない)。∴ ゲートは毎回 TimeoutSeconds(既定90秒)を待ち切ってから強制終了しており、**有効な仕事は先頭 2.6 秒だけ**だった。待機条件を『成果物の出現かつサイズが2回連続不変』へ変えるだけで **93秒 → 4.7秒**。**副次的だがこちらが重い**: `Stop-Process -Force` の後に `WaitForExit` が無く、既定 RunName のサンドボックスを `-Clean` 無しで使い回していたため、**死にかけのプロセスがハンドルを掴んだまま次回準備段の `robocopy /MIR` に重なる窓**が毎回開いていた — 部分ミラーは『警告1件』という、真の不具合と見分けのつかない形を作る。**調査手順として効いたのは陽性対照を先に打ったこと**: サンドボックスへ既存ファイルの複製を注入して意図的に多重定義を起こし、`7行/警告0 → 19行/警告6` を確認した。これで『門が壊れている』と『門が何も見えていない』が分離でき、以後の測定が全て意味を持った。**一般形**: (1) 待つべきは成果物の確定であって実行主体の終了ではない。プロセス終了を完了シグナルに代用すると、成果物が確定済みでも待ち続ける。(2) 強制終了は `WaitForExit` まで見届ける。掴んだままのハンドルは次の実行の入力を壊す。(3) **緑のゲートは『問題が無い』の証拠ではない** — 陽性対照を通していない緑は、検出能力が生きている証拠を1つも持たない。関連 [[N-Project001-20260826c]](テスト環境を変える変更は緑のまま無意味化する)・[[N-034]](起動は必ずハーネス経由)。"
    tags: [Project001, autotest, harness, boot-warnings, gate-design, flaky, false-green, positive-control, process-exit, waitforexit, artifact-completion, timeout, sandbox, robocopy, handle-leak, powershell, scope:framework]
    project: Project001
    strength: 2
    last_used: 1081
    state: active
  - id: N-Project001-20260826g
    text: "**共有名前空間のスロットは、編集中のファイルではなく名前空間の全体を検索してから確保する。** 実測(2026-08-26 TASK-Project001-20260826-072): メイン画面の行予算の基準行を置くため `TFLAG:756` を選び「参照 0 件」と報告したが、その検索が `SHOP.ERB` 内に閉じていた。実際には `EVENT.ERB` の `@EVENT_NEWDAY` が同じスロットを日跨ぎガード(`SIF TFLAG:756 == DAY / RETURN`)に使っており、ショップ描画が行番号を書くと**新日イベントが黙って飛ぶ**、逆に新日が `DAY` を書くと**行予算の基準が日番号で壊れる**、という双方向の破壊になる。**autotest 1886件は全緑のまま通った** — 両方の所有者を1回の実行で触るテストが無かったため。∴ (1) スロット確保の検索範囲は**編集範囲ではなく名前空間**で決める、(2) 確保したら定義箇所に**誰がどのスロットを持つか**を書き残して次の確保者に検索をやり直させない、(3) **番兵値**による回帰テストを置く(番兵を置いて所有者の入口を通し、生き残るかを見る)。Project001 の実際の割り当て: `TFLAG:750-755` = ショップのタブ状態 / `TFLAG:756` = `EVENT_NEWDAY` の日跨ぎガード / `TFLAG:757` = メイン画面の開始行。関連 [[AP-028]]。**併せて**: メイン画面の入口は2つあり `EVENTSHOP`(画面を消さない)と `SHOP_WAFU_EXIT_MAIN`(`SCREEN_CLEAR_ALL` で消す)で開始 `LINECOUNT` が違う ∴ 行予算を絶対 `LINECOUNT` で測ると入口ごとに画面が変わる。**この差はハーネス既定の窓高(461)では両下限側に入って再現せず、実機相当(1200x700 / CLIENTHEIGHT 681)で初めて 4 行差として現れた** ∴ レイアウトの回帰は実機相当の高さで測ること。"
    tags: [Project001, Project003, tflag, shared-namespace, slot-allocation, collision, search-scope, sentinel-test, linecount, screen-entry, row-budget, clientheight, harness-config, layout-regression, measured]
    project: Project001
