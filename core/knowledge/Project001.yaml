  - id: N-090
    text: "Project001/Project003 で `PRINTBUTTON @\"[{値}]ラベル\"` のようにボタン値をラベルに埋め込むと、**値の桁数が増えるとボタン幅が変わり多列レイアウトが崩れる**。実害: 巫女カード3列(@SHOW_MIKO_CARDS)で TASK-350 が値を10-32→810-832に退避(2桁→3桁)した結果、各ボタンが8hw→9hwになり1列のボタン行が列幅24hwを超過→横3列がずれて崩れ、ユーザーには『コマンドが機能しない』に見えた(実際はディスパッチ正常)→TASK-356で `[{値}]` を除去し固定幅ラベル(筆頭/助手/変更+全角pad=各8hw)に。**ボタン値はクリック処理用で表示不要**(PRINTBUTTONの第2引数で保持されるので表示から外してもディスパッチ不変)。多列セルのボタンは値非表示の固定幅に。幅崩れはboot smokeで検知不可→playtest視認([[N-089]])。参照: buy-range/値域は [[shop-button-value-ranges]]相当のN-088。"
