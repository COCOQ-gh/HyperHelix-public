  - id: N-Project001-20260817e
    text: "同じ『ファミリー』(例: tools/Project003-autotest/ 配下の AUTOTEST*.ERB 群)でも、ファイルごとに encoding が異なりうる — 決め打ちしない。実例: AUTOTEST.ERB は UTF-8(BOMなし)だが、隣接する AUTOTEST_INTERACTIVE.ERB は CP932 だった。先頭バイトが両方 ASCII 範囲('; '等)のため BOM 有無チェックだけでは区別できない。誤って UTF-8 で ReadAllText/WriteAllText すると CP932 の日本語バイト列が silent に文字化けし(.NET の既定 UTF8Encoding は無効バイト列を例外なく U+FFFD へ置換)、そのまま書き戻すと**元データを破壊的に失う**(TASK-Project001-20260817-007 で実際に発生・62行相当の破損)。対策: 編集前に FFFD カウントで検証するだけでなく、疑わしい場合は strict decode(`New-Object Text.UTF8Encoding($false,$true)` で GetString)を試し、無効バイト列で例外が出れば UTF-8 でない証拠として扱う(CP932 は無効バイト列がほぼ無く FFFD=0 で『成功』したように見えても実は誤読=false negative になりうるため、CP932 decode の FFFD=0 だけでは正しさの証明にならない)。書込み後は必ず git diff --stat で『意図した行数だけ変化したか』を確認し、想定外の広範な差分が出たら即 git restore で復旧する(tracked ファイルなら実害ゼロで戻せる)。同じ理由で Project003.log 自体も実行コンテキストによって encoding が変わりうる(同タスクで CP932 decode が実際には誤読=文字化けを生み、UTF-8 decode が正しかった例を確認)。"
    tags: [Project001, encoding, cp932, utf8, bom, autotest, false-negative, strict-decode, git-restore, safe-edit, near-miss, Project003-log]
    project: Project001
    strength: 5
    last_used: 899
