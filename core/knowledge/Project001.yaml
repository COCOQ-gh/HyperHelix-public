  - id: N-Project001-20260824c
    text: "**Project003.NET 0.2.6.0 の `<div>` でコンソール内へベクター実線を引くときの4つの罠と正解形(全て実測)。** 背景: テキスト罫線(`|`/`-`)は文字繰り返しの構造上必ず点線に見える。完全な実線は `HTML_PRINT` の `<div border_width>`(GDI+ Pen・DashStyle=Solid)で描く(Project003LabH docs/51 の裏取り = RESEARCH-solid-frame-border.md)。**罠①: 空 div は要素を生成しない** — div 要素はタグ内テキスト検出時にのみ作られ、`</div>` は状態を戻すだけ(HtmlManager.cs:316/690)。半角空白1個を入れて回避。**罠②: PRINT バッファ→HTML_PRINT の順で行結合は不可** — `PrintHtml` が先行バッファを行として確定させる(Project003Console.Print.cs:389)。結合は `HTML_PRINT s,1`→PRINT の一方向のみ。**罠③: div の空白テキストはコンソール等幅と別のフォント計測**でフロー幅が 9px にならない(実測 ≈6.4px)。同一行に div を積んで `-k*9` 補正する設計は必ずずれる。**正解形 = 各 div を `<nonbutton pos='0'>` で包む**: pos は PointX を絶対ロックする(単位 FontSize% だが 0 は無次元)ので、div の `xpos='Npx'` がそのまま絶対座標になる。全 div を1本の空行(スペーサ行)へ集約し、ypos 負値で上の行へ・大きい height で下の行へ延伸すれば、本文行は純テキストのまま(桁計算も既存アサートも無傷)。縦線は width=0・横線は height=0 の縮退矩形で実線になる(実機PNG確認)。**罠④: div は `HTML_GETPRINTEDSTR` に直列化されない**(DisplayLine2Html は StyledString/Image/Shape のみ)ので捕捉ベースの回帰は書けない — 生成側純関数の戻り値(`STRCOUNT(…,\"border_color\")` 等)で検証し、見た目は実機PNGへ。純空行の直列化署名は `<p align='left'><nobr> </nobr></p>`(空白1個)。付随: FORM 代入の `%…%` は文字列式専用で整数ローカルは `{L_X}`(混用は実行時エラー)。`描画インターフェース:GRAPHICS` では div の塗り(background_color)は描かれない(枠線は描画モード非依存)ためチップ/パネル背景には使えない。行の高さは `GETCONFIG(\"一行の高さ\")`(既定19px)。関連 [[N-Project001-20260824a]] [[N-Project001-20260824b]]。"
