  - id: N-089
    text: "Project001 のショップHUD(@SHOW_SHOP)グリッドは `@PRINT_GRID_PAD`(`CLIENTWIDTH()/9` ベースのフラッシュ右パディング=右端まで伸ばす)で**常時HUD専用**。これをタブのコマンドブロック等へ移設するとコマンドボタンと混在しレイアウトが崩れる(TASK-351 HUD3 で布教力+グリッドを752タブへ移動→崩れ→TASK-352でrevert)。**重要: HUD/UIレイアウト変更は autotest(boot smoke)では崩れを検知できない**(parseは通る=falseな緑)。∴ブラインドで大きくレイアウトを動かさない。UI変更は **playtest反復(小変更→ユーザー実視→調整)** で行い、**崩れたら即revert**。grid helper はHUD文脈の幅前提を持ち再配置に弱い。委譲executorのDISPLAY系WOも『boot緑≠視覚OK』を明記。"
