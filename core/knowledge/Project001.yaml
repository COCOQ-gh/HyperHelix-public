  - id: N-Project001-20260818d
    text: "乱数を含む生成手続き(ランダム巫女生成の APPLY_ROLL 等)の『不変条件×Nロール』autotest は、1回 PASS しても確率的欠陥を見逃す — RAND を使う調整ループ(例: 体質ペア数を 2-4 に整える『ランダム試行×40回で当たりを引くまで』)は当たり確率が低いと収束せず、約2割の run で違反が出るのに初回は緑で通った(TASK-Project001-20260818-012 でコミット→-013 の再実行で 4連続 FAIL として顕在化)。対策: (1) 調整ループは『ランダム開始点から全候補を走査して必ず1件処理する』決定的収束に書く(試行回数上限に頼らない)。(2) 必須素質を最後に再保証するなら相方(対立ペア/排他ペア)を同時に落とす — 排他修正の後に必須を立て直すと両立違反が復活する。(3) 不変条件テストを追加した直後は同じ suite を最低 3-4 回連続で回して安定を確認してからコミットする(1回の緑は証拠にならない)。(4) 違反時の切り分けは『SIF 条件 → カウンタ+1』を『IF 条件 → カウンタ+1 → PRINTFORML [[DBG]] t={型} r={回} v={番号} → ENDIF』へ機械変換して種別を特定する(SIF の直後に行を足すと無条件実行になるので必ず IF/ENDIF 化)。"
    tags: [Project001, autotest, randomness, invariant, flaky, stochastic, generator, randchara, deterministic-termination, exclusive-pair, must-talent, debug-instrumentation, sif-pitfall]
    project: Project001
    strength: 4
