  - id: N-Project001-20260824a
    text: "**engine ソースを読める相手への調査委託でも、(a) こちらが渡した前提が実機で効いているか (b) 回答の『〜にはならない』という否定的主張が実物のマークアップでそうか、の2点は自分で測り直す。** 実例(TASK-Project001-20260824-003 / §1-V④ 1行3コマンド): Project003LabH の回答(doc/project-notes/RESEARCH-shop-command-layout.md)は `HTML_PRINT` が直前の printBuffer を `IsLineEnd=true` で flush する件も `PRINTCを並べる数` が ERB に効かない件も**ソース行つきで正しかった**が、2箇所で実装が通らなかった。**(1) 回答 §3『PRINTC / PRINTLC は非ボタン』は `[数字]` で始まるラベルでは偽** — Project003 は印字テキスト中の `[数字]` を入力値つき要素へ**自動でボタン化**する(eramaker 系の標準挙動。`SHOP.ERB` のページ送り `PRINTFORMLC ... # [1001]` 自身がこれに依存)。実測マークアップは `<button value='902'><font color=…>[902] …</font></button>` で、条件未達コマンドが**全部クリックできる状態**になっていた。正解は `PRINTPLAINFORM`(入力値を持たない → `<font color=…>` だけ)＋**列幅 `PRINTCLENGTH()+1` バイトの自前パディング**(`PRINTPLAIN` 系に C/LC 変種は無い。`PRINTCLENGTH()` は回答に無いが実在)。**この誤りを捕まえたのは既存の否定アサート**(`shop.cmd103.button_hidden_no_target` 等『未達コマンドが button として出ないこと』)10件 — **機能を作り替えるとき、古い実装を前提にした回帰テストは『邪魔な赤』ではなく最良の受入条件**。**(2) WO §2 に載せた config 値(`PRINTCの文字数:26` ほか)は実際には効いていなかった** — Data 直下の Project003.config は読まれない([[N-Project001-20260721n]])のに前提として渡してしまい、回答の幅計算が既定値 25 とずれた。∴ **委託前に『渡す前提が実機で効いているか』を1回測る**。**ERB/autotest 側の付随の罠(いずれも本タスクで踏んだ)**: ①引数なしの `RETURN` は **`RESULT` を 0 に戻す** → 値を返す関数は必ず `RETURN 式`(『期待1が全部0、期待0だけ通る』はこの症状) ②`STRCOUNT` の needle は**正規表現**で、かつ ERB の文字列リテラルがバックスラッシュを食うため**角括弧をエスケープできない** → 角括弧を含む needle は使えず数字だけで照合する ③`HTML_GETPRINTEDSTR(0)` は**最新行**で、`AUTOTEST_ASSERT` の `PRINTFORML` が索引をずらす → **計測は全部アサートより前に済ませて変数へ退避する** ④文字列変数の `=` は FORM(`%…%` が要る)・`+=` は式(`%…%` を書くと『式が異常です』)。**視覚要素の検証は最悪ケースを実機で撮るのが最短** — 『巫女なし＝未達コマンド最大』の PNG キャプチャが ④のクラッシュも凡例の行数(実測4行)も一発で出した。関連 [[N-Project001-20260721n]] [[N-Project001-20260823b]] [[N-034]]。"
