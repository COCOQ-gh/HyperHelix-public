  - id: N-Project001-20260829b
    text: "**測定結果が予想と食い違ったら、対象を疑う前に測り方を疑う。本セッション(2026-08-29)で4度、原因は毎回こちら側だった。** ①**decoder**: UTF-8 の検索語を CP932 ファイルへ当てて『該当なし』(淫具創造の対象ファイルが見つからない / 『はい』が6ファイルと出たが正しくは23ファイル64件)。②**数えた対象の取り違え**: executor の『95件』を `FLAG:5 == 9` の件数と解して自分の26と比較したが、実際は `FLAG:5` の参照数95で相手が正しかった。③**走査範囲**: `MODC_PRINT_LIVE_PAGE` の呼出が1ファイル内で2件しか無く『3画面同型』と合わないと疑ったが、全 ERB へ広げると定義1+呼出3で整合した。④**複合語の語順**: 『総合神社レベル』を `神社総合レベル`/`総合レベル` で検索して0件と判定し、**駆動源が存在しないとユーザーへ報告した**(実際は21出現)。日本語の複合語は語順が違うと部分一致しない ∴ 構成要素の最短単位(『神社』『レベル』)でまず当たりを取る。**共通の型**: 『0件』『合わない』は**発見**ではなく**測定失敗の第一候補**である。とくに ④ のように**不在を根拠にユーザーへ報告する**場面は、報告前に別の語・別の範囲・別の decoder で再測定する。関連: 全数と標本の区別([[N-Project001-20260826a]] の『4種』は標本で実際は全807ファイルで8種)・AP-032(資材に答えがあるのに手順が届かない)。"
