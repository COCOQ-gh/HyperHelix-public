  - id: N-Project001-20260819c
    text: "era 系の一括経過(参籠)は EVENTTURNEND_CORE(PRINTW/BEGIN SHOP を含む対話プリミティブ)を流用せず、EVENT_NEXTDAY→DAY/TIME/CALENDAR_CHECK→朝処理を呼ぶ非対話 1 日関数を新設し、ランダム日次イベントは進行フラグ(FLAG:402)で抑止する。朝処理が二重実行され得る場合は当日ガード(TFLAG:日付==DAY)を挿す。autotest は実 N 日送りを回して完走(ハング=runner timeout で検出)を assert する。適用例: SANROU.ERB @SANROU_ONE_DAY/@SANROU_RUN(TASK-Project001-20260819-024, WO-010)。"
