  - id: N-Project001-20260721r
    text: "kami UI の色は **`Data/ERB/システム/UI_COLOR.ERH` の `#DIM CONST カラー_XXX` 定数を使う**(生 `0xRRGGBB` を直書きしない)。Project003 は**色用の組込CSVスロットを持たず**、任意CSVのランタイム読込も非標準のため、`#DIM CONST` ERH が idiomatic な色の中央集約手段(既存 `_CONSTANTS.ERH`/`VARIABLE.ERH` と同方式、ERHはサブディレクトリ含め自動ロード)。`#DIM CONST` は global int=`SETCOLOR カラー_状態良` や `CALL F,…,カラー_役割` にそのまま渡せる。**ランタイムで同hexに解決**するため `<font color='#78B783'>` は不変→色アサート(STRCOUNT(cap,'#78B783'))は破綻せず=値不変リファクタの安全網。パレット(TASK-304): 状態良/注意/危険=0x78B783/E0C060/E06666・役割=76ADC8・ラベル金=FFD479・バー背=404040・補助=9090A0・ランクS/A/B/C/D/無=CC66FF/FF99CC/FF6666/FFAA33/FFEE44/808080。注意: HTML文字列内 `'#RRGGBB'` は 0x形式でないので別管理(`%TOSTR_HTML(カラー_XXX)%` で揃えられる)。集約完了範囲: `システム/` 全UI画面(TASK-304/305/306, HTML色含む)。 **是正(TASK-307): `汎用関数v2/` は集約対象でない** — 既に `@COLOR(名前)→hex` の名前キー色API + 拡張点 `COLOR_EXT.ERB`(現状スタブ, ここに固有色登録) + `@BARCOLORSET` + `RAINBOW` 定数配列として**整理済**で、`COLOR.ERB` 冒頭が**本体編集禁止**を明記。さらに `汎用関数v2/ui/` の `0x100000` 等は**色でなく入力(クリック)ビットマスク**(誤検出注意)。∴kami の色は2系統が補完的に併存: (1) UI_COLOR.ERH `#DIM CONST`(コンパイル時・描画ループ高速・固定パレット) (2) ライブラリ `@COLOR/COLOR_EXT`(ランタイム名前引き・動的/拡張色)。値の重複は バー背=@COLOR\"暗灰色\"・銀=@COLOR\"白\" の2件のみ(他はkami固有)。関係は UI_COLOR.ERH ヘッダ + COLOR_EXT.ERB に明文化済(ユーザー裁可: 現状維持+明文化)。Project002 ports は別領域・別オーナーシップで非対象。"
