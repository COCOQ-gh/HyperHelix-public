    text: "対話 autotest スイート ERB を隔離ツリーへ注入する際、PowerShell [System.IO.File]::ReadAllText は BOM 無し CP932 を UTF-8 と誤読し日本語を ???? 化する。marker と描画が両方化けると EXPECT_TEXT が偽 pass(????同士一致)、片方だけだと偽 fail になる。対策: CP932 no-BOM ソースは Copy-Item でバイト保全注入(Project003 は CP932 no-BOM を正しく読む=本番 ERB と同条件)、または UTF-8 BOM ソースなら ReadAllText(BOM検出)+WriteAllText cp932。Invoke-Project001Interactive.ps1 は Copy-Item 方式。実証: SELECT_ASSI marker 助手 が ???? 化し fail→Copy-Item で pass。"
