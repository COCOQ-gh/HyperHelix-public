  - id: N-Project001-20260826a
    text: "**このリポジトリの ERB はファイル単位でエンコーディングと改行が別々であり、『Data/ERB は CP932+CRLF』という一般則はもはや目安ですらない(2026-08-26 に4種を確認 → **2026-08-29 に Data/ERB 全 807 ファイルを全数計測して 8 種と判明**)。** 全数の内訳(2026-08-29): UTF-8 BOM+CRLF **431** / CP932+CRLF **317** / CP932+LF **26** / UTF-8 BOM+LF **16** / CP932+CRLF に bare-LF 混在 **6** / UTF-8 BOM無+CRLF **4** / UTF-8 BOM無+LF **4** / UTF-8 BOM+CRLF に bare-LF 混在 **3**。∴ **最多の CP932+CRLF ですら全体の 39% しかない**。加えて ASCII のみでバイト列から CP932/UTF-8 を判別できないファイルが数件ある(どちらで読んでも同じなので実害は無いが、『判定した』と言えない)。初回計測(4種)は標本が小さく、種類数を過小に見せていた — **『実測した』は『全数を測った』ではない**。さらにハーネス側も不統一で `AUTOTEST.ERB` = UTF-8 BOM無 / `AUTOTEST_INTERACTIVE.ERB` = CP932。∴ **WO の環境ルールに一般則を断定として書いてはいけない** — 書くべきは『編集前に実バイトを測り、元形式を維持せよ』だけ。**書き込み側の罠(実害あり)**: BOM 付きファイルを read-modify-write すると **BOM が二重化する** — `UTF8Encoding($true).GetString()` は BOM を文字(U+FEFF)として残し、`WriteAllText` が同じ encoding でもう1つ付けるため。症状は PowerShell なら `ParserError`(先頭の見えない文字で構文が壊れる)。対処は読み側で `TrimStart(U+FEFF)` するか、先頭3バイトをバイト列として別扱いする。[[N-Project001-20260811d]](WO 発行前に BOM を機械確認せよ)の**書き込み側の対**にあたる。"
    tags: [encoding, cp932, utf8-bom, bom, crlf, lf, mixed-encoding, erb, autotest, read-modify-write, powershell, parsererror, work-order, Project001]
    project: Project001
    strength: 19
    last_used: 1098
    state: active

  - id: N-Project001-20260826c
    text: "**テストが走る「環境」を変える変更は、テストを赤くせずに緑のまま無意味化する。結果ではなく『何を測っているか』を見ないと検知できない。** 実例(2026-08-26・裁可時に予見して先に潰した): `[117]流れ巫女を招く` のコストをデバッグ時だけ神力10にする要望に対し、判定フラグとして既存のテストモード規約 `FLAG:9000` を流用してよいと裁可された。しかし **autotest 自身が `FLAG:9000` を立てて走る**(`AUTOTEST.ERB` に **266箇所**・実測)ため、そのまま入れると **autotest 中は常にコスト10**になり、`§1-R①` が固定した**コスト境界テスト6件**(`randchara.summon*`)が通常式を一切検証しなくなる。**このときテストは Fail しない** — 期待値も実測値も10で一致するので緑のまま通る。∴ CI も人も気づかない。**一般形**: テストモード判定フラグ(`FLAG:9000` 等)を**プロダクトの機能分岐にも流用する**と、テスト環境とプロダクト挙動が結合し、テストは自分が偽の条件下にいることを検出できない。**対策の優先順**: ① **計算部を純関数へ切り出し、デバッグ分岐の外で直接テストする**(分岐とロジックが分離され以後この汚染が起きない・推奨) ② 当該テストだけフラグを落として通常式を測る。**検知の合図**: 『デバッグ/テスト時だけ挙動を変える』要望が来たら、そのフラグが autotest 側で立っているかを**必ず数える**。関連 [[N-Project001-20260825d]](ゲートが見ていない種類の衝突)。"
