  - id: N-Project001-20260721n
    text: "Project003(0.2.6.0) ショップ等の右寄せ/列レイアウトの確証(TASK-298): (1) **HTML_PRINT は ALIGNMENT を無視する** — `ALIGNMENT RIGHT` 下でも `<p align='left'>` を出す(probe実証)。TASK-295でグリッドをHTML_PRINT化したのが右寄せ不成立の真因。[[N-058]]の『複数PRINTFORM=merge bug』は**この版では誤診**: 複数 SETCOLOR/PRINTFORM + ALIGNMENT RIGHT は単一の `<p align='right'>` を出しテキストも無破綻=正しく右寄せ。∴右寄せは **SETCOLOR/PRINTFORM(+ALIGNMENT RIGHT)**、単色なら **単一PRINTFORML**。HTML_PRINTは使わない。 (2) **検証手法**: HTML_GETPRINTEDSTR は `<p align>` 属性込みのマークアップを返す → `STRCOUNT(cap, \"align='right'\")` で右寄せを autotest 検証可(表示幅はSTRLENSで測れない=マークアップ長になる)。実描画の**表示幅は Project003.log のプレーン行を Python east_asian_width(W/F=2hw)で計測**して列ズレを定量化(注意: 長い行はlog内で折返す/HTML_PRINT divの値オーバーレイはlog不可視)。 (3) **【重大是正 TASK-308】`PRINTCLENGTH()*PRINTCPERLINE()`=78 は窓の行幅ではなく `PRINTC` のカラムグリッド幅(config `PRINTCの文字数:26`×PRINTCPERLINE3)**。実ゲーム窓の行幅は `CLIENTWIDTH`(px)/文字幅。**【2026-08-24 重大是正 TASK-Project001-20260824-001】『実機は Data/Project003.config の ウィンドウ幅:1200 → CLIENTWIDTH=1200』は誤りだった** — **Project003 が読む config は exe と同じ階層の `Project003.config` だけで、`Data/Project003.config` は読まれない**(決定的実験: サンドボックスのルート config へ `ウィンドウ幅:1200` を足すと CLIENTWIDTH が 800→1200 に変わり、`Data/` 側へ置いても 800 のまま)。ルートの `Project003.config` に幅指定が無かったため、**実機は既定の 800px(=86hw) で動いていた**のに HUD は 1200px(=131hw) 前提で設計されており、ヘッダ行の折り返しと右ブロックの詰まり(§1-U2① の『表示崩壊』)を生んでいた。同タスクでルート config へ `ウィンドウ幅:1200` を移し、autotest サンドボックスの config も同じ幅へ揃えた(揃える前は**テストが実機と違う幅を検証していた**)。∴ **描画幅を語るときは『どの config ファイルが実際に読まれるか』を先に実測する**。autotest はデフォルト窓 **800px** で走り log が実機より狭く折返す。**【再是正 TASK-309】autotest窓を実機configの1200pxへ揃えても実機の折返しは再現しない**(probe では 130半角でも非折返しなのに、実機ではバー+グリッド122hw が折返し破綻)。HTML_PRINT div バー(値オーバーレイ)の実描画幅・実機窓状態が未測で、**幅計測/算出で『収まる』と判断してレイアウトをコミットしてはならない**(TASK-298 幅誤認→308 横並びが実機破綻→309 差し戻し、の二度の失敗)。**視覚レイアウト変更(特にバー横並び・グリッド整列)は、autotestで no-crash を確認した上で、コミット前に必ずユーザープレイテストで折返し/整列を確認する**。横並びには物理的にバー短縮等が要る可能性が高い。なお `│`=1hw、`PRINTCLENGTH*PRINTCPERLINE`=PRINTC列グリッド(窓幅でない)は不変。表示幅統一は `%\"　\"*N%` 文字列反復 + `{,5}` 数値詰め + 表示幅pad関数(STRLENS<幅 で半角空白追加・全角末尾でも幅ちょうど)で実現。実証: 巫女カードを 3スロット×24hw=75hw に統一し崩れ(filled31/empty25・ボタン32hw折返し)解消、グリッドを最上段右寄せ化。 (4) **【視覚確認の決定打 TASK-311】実機 Project003 窓を PNG キャプチャして目視できる**: pwsh7 `Add-Type -AssemblyName System.Drawing.Common` + Win32 `PrintWindow(hwnd, hdc, 2)`(遮蔽に強い。`CopyFromScreen`は前面の別窓を撮るので不可)。サンドボックス `.autotest/Project001-boot/` の `Project003.config` に `ウィンドウ幅:1200/フォントサイズ:18` を足し、`ERB/AUTOTEST.ERB` の `@SYSTEM_TITLE` に[状態セット+描画+WAIT]プレビューを書いて Start-Process 起動→ MainWindowHandle を PrintWindow→ PNG を Read で目視。推測でなく実視できる(launchはサンドボックス経由=N-034尊重・UI駆動なし)。注意: `ERB/` 直下へ二重コピーすると『既に定義』警告(同名関数二重load)、サブdir構造を保つ。pwsh7は System.Drawing.Common 必須(無印 System.Drawing は不可)。 (5) **ショップのバー(`SHOP_BAR_INLINE`)は値オーバーレイ(HTML_PRINT div)が強制改行を起こしバーが2行に割れる**(label+cells / 値以降。298からの既存挙動)。∴バーと同一行に綺麗な右寄せグリッドは原理的に困難(横並びの度重なる失敗の真因)。横並びを綺麗に出すにはバーの%オーバーレイ(div)を除去し1行化が必要。グリッド(右寄せ=右半分)とバー(左半分)は水平に重ならないのでバーが1行なら横並び可。 (6) **【TASK-313 横並びでの実機フラッシュ右】** バーが1行化(上記5)できれば、グリッドを左幅に依らず画面右端へ揃える(フラッシュ右)には: pad関数に(左幅,右幅)を渡し `pad = CLIENTWIDTH()/9 - 2 - 左幅 - 右幅`(font18: 半角≈9px、-2はscrollbar余白)。各行 grid右端 = lineW で固定=右端揃い、左端ラグド(298 ALIGNMENT RIGHTと同じ見た目)。数値は `{,N}` 固定幅で grid幅を一定化。**重要: `█`(U+2588)は Project003描画で約1hw(半角)幅**(緑バー20セル≈190px=9.5px/セル実測)。バー表示幅を算出する RETURN は **`幅*2`でなく`幅`**(全角2hw想定は過大→右寄せがズレる)。east_asian_widthは █ を曖昧(A)扱いするので机上判定不可、実機PrintWindowキャプチャでのみ確定。"
    tags: [Project001, Project003, html, shop, ui, alignment, alignment-right, html-print, p-align, right-align, layout, display-verify, html-getprintedstr, east-asian-width, printclength, console-width, window-width, clientwidth, printwindow, screenshot, bar-wrap, flush-right, block-char-width, u2588, merge-bug, display-width, miko-card, padding]
