  - id: N-096
    text: "Project003: CALL で呼ぶプロシージャに #FUNCTION/#FUNCTIONS を付けてはいけない。#FUNCTION(S) は式メソッド(関数呼び出し+RETURNF で値を返す)であり、`CALL 名前, 引数` で呼ぶと『#FUNCTION(S)として定義された関数に対し通常のCALLが行われました』でロード時エラー。CALL 方式で RESULT を返す補助は RETURN 値で返し #FUNCTION を付けない(既存 @DEBUG_ADD_CHARA/@DEBUG_ENDING_PLAY が手本)。引数は組込み ARG 経由、index 化代入は LOCAL を介す(VAR:TARGET:LOCAL)。N-012 の #FUNCTION/ARG 規約の姉妹則。"
