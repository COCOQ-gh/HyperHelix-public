  - id: N-Project001-20260821d
    text: "生成器/初期化ロジックの『どの index に値を振るか』は、配列定義(Abl.csv 等)の全件ではなく **UI がその配列をどう分帯して描いているか**から引く。Project001 の ABL は Abl.csv に 58 index 定義されるが、NEW_PRINT_ABL_FULL(SHOW_INFO_UI.ERB:349/369) は 0-69 を色付きランク=駆動帯26(0-3,10-16,20-23,30-34,40-43,50,60)、70-199 を灰色『◆ 参考値(K由来・kami未駆動)』=参考帯32(70-101) と自ら宣言しており、さらに ABL:70/71 は -1000..1000、ABL:76 は 0..1000 のスライダ(SHOW_BASE_K:465/472/479)で 0-10 LV スケールですらない=単一のレンジ表では書けない。∴『全 index を明示代入せよ』という是正方針は、帯を見ずに立てると 『未駆動と UI が明言している帯』へ値を入れて生成キャラだけ浮かせる。**生成器のスコープ判定則**: 既存データ(全 CharaCSV)を走査し『既存キャラも空なら全キャラ共通のコンテンツ未実装＝生成器スコープ外』『生成キャラだけ空なら生成器の欠陥』と切り分ける。実測(45 CharaCSV): ABL 60 と 70-92 は実在キャラ0体、BASE:11(精神バー)は代入がリポジトリ全 ERB で0件 — いずれも表示されているが誰も駆動していない全キャラ共通項目だった。また『0 を明示代入する』こと自体には実益がない(既存 CharaCSV も疎で Project003 既定0に任せている)。実益は ①型ごとのカバレッジ設計 ②同関数の再適用時に前回値が残らないこと(APPLY_ROLL は TALENT 0-999 を明示クリアするが ABL を触らない)。副産物として本監査は実害を1件検出: KOUSHIN_CONTACT_OK(GOUI.ERB:31) が ABL:キャラ:40>=2 を要求するのに 生成器が RAND:3(0/1/2 一様)を振るため、裁可『交神対象=最初から対象』に反して生成巫女の 2/3 が交神不可だった。関連 [[N-Project001-20260821a]]。"
