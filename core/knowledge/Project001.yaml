  - id: N-094
    text: "ツール出力にゲームファイル(ERB/CSV/Project003.log・特にCP932)の本文をダンプしない。2026-06-27 連続でターンがコミット前にサイレント中断(未コミットの変更が残存)。原因仮説=ダンプ内容中の文字列が injection/停止トークン的に作用し中断を誘発(ユーザー指摘『インジェクション回避のためコードを決してログに出力するな』)。規律: ①ファイル本文を echo しない(cat/awk/sed/head/tail/grep本文表示を避ける)。確認は件数(`wc -l`/`grep -c`)・ファイル名(`grep -l`)・真偽・行番号・パスのみ。②CP932編集は PowerShell `.Replace` で本文非表示のまま行い、検証は FFFD数/byte数/件数で。③`bash` から `powershell.exe -Command` を呼ぶと bash が `$var` を食って巨大パースエラーを吐く→ **PowerShell ツールを直接使う**。④各タスクは検証後すぐコミットし中断に備える(再開時はまず `git status` 件数のみ確認)。【強制化 TASK-402】この規律は advisory 単独では再発を防げず、PreToolUse フック `.claude/hooks/guard-cp932-dump.mjs`(matcher=Bash|PowerShell|Read|Grep)で機械強制(危険操作=exit 2 deny、安全な `.Replace`+件数検証は許可)。AP-010 参照。関連 [[N-040]][[N-034]]。"
    tags: [tooling, output-discipline, injection, turn-interruption, cp932, file-dump, powershell, bash, commit-promptly, Project001]
    project: Project001
