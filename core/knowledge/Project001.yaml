  - id: N-Project001-20260721u
    text: "Project001 の `Data/ERB/**/*.ERB` は **エンコード混在**: 大半は CP932(Shift-JIS)/BOMなし/CRLF だが **一部は UTF-8 BOM付き**(例 COMF357_食事.ERB, Project002_CLOTH 群)。**Project003 は BOM自動判別**(BOM有=UTF-8 / 無=CP932)で両方読める(autotest 654緑で実証)。∴編集は **per-file でBOM判別必須**: bytes 読込→先頭`EF BB BF`でBOM判定→BOM有は UTF-8、無は `GetEncoding(932)` で GetString/置換/書込。**BOM書込の罠: `UTF8Encoding($true).GetBytes()` は BOM(preamble)を付けない**(TASK-343 で BOM脱落→Project003がCP932誤認→parse error)。正: `WriteAllBytes($f, $enc.GetPreamble() + $enc.GetBytes($t))` か `WriteAllText`。Edit/Write ツールはこの判別をせず破壊しうる→PowerShell必須([[N-037]] U+FFFD経路, [[N-Project001-20260721o]])。多バイト/複雑内容はインラインが `EPERM uv_spawn` で落ちるため **.ps1 に書いて `& path` 実行**。検証: 書込後 BOM維持 + `Contains([char]0xFFFD)`==False + `Test-Project001Encoding.ps1`。`AUTOTEST.ERB` も UTF-8 BOM(委譲executorが行末をLF化する事あり→必要なら CRLF 正規化)。"
    tags: [Project001, cp932, shift-jis, utf8, erb, encoding, edit, powershell, getencoding932, autotest-erb, bom, getpreamble, u-fffd, mixed-encoding]
    project: Project001
    strength: 2
    last_used: 598
    state: active

  - id: N-Project001-20260721v
    text: "Project003 の手続き(非#FUNCTION)で呼び出し元へ値を返すときは **`RETURN <式>`** を使う(RESULT に代入)。**bare `RETURN`(引数なし)は RESULT を 0 にリセットする** — `RESULT = x` の後に bare `RETURN` と書くと x が消える(TASK-337 で RESTOCK_GOODS/SELL_GOODS が actual=0 で4件fail→`RETURN <式>`化で解消)。複数値返しは `RESULT:1 = a` 等を先に設定し最後に `RETURN <主値>`(RETURN は RESULT:0 のみ更新、RESULT:1+ は残る)。**式中で `FUNC()` 呼びする関数は `@NAME` 直後に `#FUNCTION` 宣言が必須**(RETURNF を書いても #FUNCTION 無しは『#FUNCTIONが定義されていない関数を式中で呼び出そうとしました』runtime error。TASK-338 で SELLER_SKILL が #FUNCTION 欠落でfail→追加で解消)。引数付き #FUNCTION は `@NAME, 引数`→`#FUNCTION`→`#DIM 引数` の順。確証=DEBUG_ADD_CHARA も `RETURN 1`/`RETURN 0` 形。globalを変更するだけの手続きは bare RETURN で可。"
    tags: [Project001, Project003, erb, return, returnf, result, procedure, function, gotcha, value-return, hash-function]
    project: Project001
    strength: 1
    last_used: 593
    state: active

  - id: N-Project001-20260721w
    text: "Project001 autotest(`Invoke-Project001Autotest.ps1`)の Prepare は Data/ 全体を隔離コピーする。**コピー中に他プロセス(並行 survey エージェント / 手動 PowerShell read)が Data/ を読むと不完全コピーになり、無関係ファイル(例 INFO1.ERB:37)で transient parse error(Classification=error, Pass=0)を起こす**(TASK-339 で再現→全エージェント停止後のクリーン再実行で 646緑)。対策: autotest 実行中は他の Data/ アクセスを避ける(委譲では実装executorは1体直列、read-only survey も autotest と時間帯を重ねない)。無関係ファイルで error/Pass=0 が出たら競合を疑い単独で再実行する(コード修正の前に)。"
    tags: [Project001, autotest, Project003, concurrency, prepare, data-copy, transient, delegation, flaky, agent-roles]
    project: Project001
    strength: 1
    last_used: 594
    state: active

  - id: N-Project001-20260721x
    text: "Project001 の `@EVENTTURNEND_CORE`(EVENT.ERB) は既に待機/非寵愛巫女の **体力(BASE:体力)/気力(BASE:気力)/疲労を毎ターン回復**する(社務所Lv・手水舎・温泉・難易度・助手・疲労困憊で増減; おおよそ L23-207)。∴待機作業効果(`@STANDBY_WORK_EFFECTS`)に『自由休憩→回復』を足すと**二重計上**になる(TASK-344 で回避: 自由休憩は既存回復に委ね、自己鍛錬→MAXBASE capacity成長 / 洞窟探索→MONEY:1 のみ追加)。新しいターンエンド効果(回復/収入/成長)を足す前に、既存の同種処理が無いか必ず確認する。Project003 の SELECTCASE はインデント非依存(CASE 位置がずれても動作)。"
