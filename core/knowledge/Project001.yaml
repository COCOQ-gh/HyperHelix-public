  - id: N-Project001-20260823d
    text: "**エンティティを別の世界(セーブ/インスタンス)へ運ぶ機能では、壊れるのは配列の中身ではなく「識別子の意味」である。設計の第一手は、その識別子が何層あるかを数えること。** Project001 の巫女は3層あった — ①**個体ID** `CFLAG:3109`(採番カウンタ `FLAG:998`・発行は `SYSTEM_GENERAL.ERB`:278-279 と `SYSTEM_CHILD.ERB`:146-147) ②**キャラ登録番号(index)**(`TARGET`/`ASSI`/`MASTER`、配列の第1添字) ③**キャラ番号 `NO:`**(CharaCSV を引く鍵。`EXISTCSV`/`CSVNAME`/`@CHARA_PROFILE`/口上ディスパッチ)。`SAVECHARA`/`LOADCHARA` は**全配列を忠実に運ぶ**ので①②③も一緒に運ばれ、持ち込み先では**別人を指す**。実害の重さは ①>②>③ で、**①が最も危険なのに最も気づかれない** — `SYSTEM_CHILD.ERB`:119-120 の `FINDCHARA(CFLAG:3109, CFLAG:ARG:3003, 0)` が**別人を親だと判定する**。ユーザー裁可は『相性(RELATION)と親子関係をクリア/NO 衝突は再割当』という②③の言葉で来たが、**①は名指しされていなかった**。∴ 裁可の字面を実装せず、**裁可の意図を変数名の集合へ実測で展開してから書く**。③の再割当先は『CharaCSV が実在する番号』に限る(Project001 では 250-299 帯に実在するのは **250 だけ**＝45ファイルを実測)。また**衝突していない識別子まで潰さない** — 手書きキャラの NO を無条件に 250 化すると CSV 由来の個性(手書き解説・口上)が消える。テスト設計は『**運べたもの**(TALENT/ABL/BASE)』と『**断ち切ったもの**(個体ID/血統/妊娠/RELATION/加入日)』を**別々の assert** に分けると、忠実さと後始末の両方が同時に回帰検知できる。なお副作用として、この種の機能のテストは**エンジンが外部ファイルを作る**(`dat/chara_*.dat`)ため run 間に残る — 『空きスロット前提』の assert を置くと2回目から落ちる。**【2026-08-23 是正・TASK-Project001-20260823-054】本ノートは当初 `RELATION` を『index 参照』と書いていたが誤り。`RELATION:<登録番号>:<相手のキャラ番号 NO>` であり、第2添字は ③の `NO` 層に属する**(権威: `@GET_RELATION` SYSTEM_GET_CHARADATA.ERB:218 `RELATION:(NO:ARG)` / `@PRINT_RERELATION` PRINT_STATE.ERB:148 / `@PRINT_RELATION` の添字が `CSVNAME(NO)` 由来の名前表と対)。この取り違えは実装バグになった — 受け入れ後始末が `RELATION:他:登録番号` で他キャラの行を消し、**`NO` がその登録番号と同値の無関係キャラへの相性を全員分 0 にしていた**。**一般化した教訓: ブラックボックス実測は『値が往復するか』は示せても『添字の意味』は示せない。**配列の意味論は (a) エンジンのソース由来資料 か (b) 自プロジェクトの権威アクセサ関数(`@GET_*`/`@PRINT_*`)から引く。『既存コードがこう書いている』は反証にならない — 主人公は index 0 かつ NO 0 で**たまたま一致する**ため、`RELATION:ARG:MASTER`(SHOP_CHARASALE.ERB:707) のような書き方が動いてしまう。**同 NO のキャラが複数居る設計(生成巫女は全員 NO:250)では、NO キーの配列は枠が共有される**点も併せて効く — 『そのキャラ宛だけ消す』は表現できないので、消せるのは本人の行だけ。関連 [[N-Project001-20260823b]] [[N-Project001-20260821e]] [[N-Project001-20260823e]]。"
