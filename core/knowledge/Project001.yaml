    state: active

  - id: N-Project001-20260818a
    text: "インクリメンタル/経営の『生産式』(信者→参拝者、施設→資源 等)は、必ず『生産(合流率)・減衰(離反)・上限(転換率cap)』を1セットで設計し、同じタスクで入れる。片方だけ先に入れると無制動の複利が即発火する(実例: Project001 P1-3 で布教→信者転換を先行実装し、信者が毎日全員参拝者へ合流+離反ゼロ+上限なしのまま=1日+3.3%の等比→4年で10^20、受入=周回1天井十万に必要なのは+0.5%/日。TASK-Project001-20260817-017 で自己検出、-018 で合流3%/上限25%/離反2%を追加)。受入は『N日シミュレーションを純関数 autotest で回し、到達帯を assert』にする — 係数を触った瞬間に帯超過を検知でき(実際 合流5%→1.3万で帯超過→3%へ)、playtest は手触りだけに専念できる。設計文書に成長式を書くときは、等比になるかを一度手計算(r=日次成長率、(1+r)^期日)してから係数を置く。"
    tags: [Project001, incremental, game-design, growth-formula, compounding, exponential, believers, sanpai, cap, decay, simulation, autotest, pure-function, balance]
    project: Project001
    strength: 3
    last_used: 859
    state: active

  - id: N-Project001-20260817f
    text: "SETCOLOR/RESETCOLOR で色を挟んだ隣接テキスト(例: `PRINTFORM ラベル:` の直後に SETCOLOR して1文字だけ出す)を CAPTURE_HTML(HTML_GETPRINTEDSTR 経由)で assert するとき、`AUTOTEST_ASSERT_HTMLCAP, \"ラベル:値\"` のような隣接文字列一致は失敗しうる — 通常の PRINTFORM ログ(プレーンテキスト)では隣接して見えても、HTML capture 側は SETCOLOR の境界でマークアップが挟まり非隣接になる(実測: TASK-Project001-20260817-008、`巫女ランク:A` のプレーンログは正しく隣接表示されるのに HTML capture の隣接一致だけ actual=0 で FAIL)。安全な代替: (1) ラベル単体の存在確認と (2) 適用されるべき色の hex 文字列(`#RRGGBB`、UI_COLOR.ERH の #DIM CONST 値と同じ表記)の存在確認、の**2アサートに分ける**。色 hex の存在確認は『そのランク/状態の色が実際に使われた』ことをテキスト一致より頑健に証明する(このパターンは既存の `list.life.hp_green`(`#78B783`)等でも使われている=新規発明ではなく確立済みパターンの再確認)。 **【same-problem-twice 追記, TASK-Project001-20260817-015】** CAPTURE_HTML(=`HTML_GETPRINTEDSTR(0)`)は**直前に完了した行**を取る。`CALL 何か描画する関数` の直後に間を置かず `CALL CAPTURE_HTML` すると、その描画がまだ現在行(未確定)のままで**1つ前の行**を掴み、期待した文字列も色hexも一致せず actual=0 で FAIL する(TASK-013 の `@PRINT_MIYANICHI_BAR` 直後、TASK-015 の `SHOP_BAR_INLINE` 直後の**2回**で同型再発)。**恒久ルール: 単発PRINTFORM系で行を完結させていない関数呼び出しの直後は、`CALL CAPTURE_HTML` の前に必ず `PRINTL` を1行はさんで現在行を確定させる**(呼び出し元が既に改行済みなら不要)。TASK-013 では場当たりで直しただけでノート化せず、同じ罠を TASK-015 で再び踏んだ = ノートに『何を確認するか』だけでなく『何をいつ呼ぶか』の手順まで書かないと再発することの実例。"
