  - id: N-Project001-20260828a
    text: "**Project001 メイン画面のクリア設計と、この build 固有の計測上の落とし穴(2026-08-28 実測)。** ① **クリアは「離脱時」ではなく「次の描画の直前」**: `@USERSHOP` はコマンドを分岐する**前**にクリアする ∴ 素朴に書くと「クリア -> コマンド実行(サブ画面が出力)-> メイン画面を描画」となり**サブ画面の出力の下にメイン画面が描かれる**。現行は遅延クリア — `@USERSHOP` 末尾で `TFLAG:908` を立て、`@SHOW_SHOP` 先頭で立っていれば `@SHOP_ENTER_SCREEN` を呼ぶ。**末尾で即クリアしない**のは「読まれる前に消してよい」まで含めないため。副次的に `CALL USERSHOP` 直後を捕捉するテスト4件がそのまま通る。② **縦のズレを行数で説明しようとして4回外した** — 実機の `[DIAG]` で総行数・上下パディング・実コンテンツ・列数・最大表示幅が**両経路で完全一致**。∴ **縦のズレを見たらまず「前の画面が残っていないか」を疑う**。③ **この build 固有**: `OUTPUTLOG \"名前\"` は**ファイルを生成しない**(`AUTOTEST.ERB` の2箇所がずっと無音だった)/ **自己参照の文字列連結 `TSTR:x '= TSTR:x + y` は機能しない**(素の代入と番兵は生き残るのでリセットではない)∴ 蓄積は**添字付きスロット** `TSTR:(80 + n)` で行う/ `TSTR`・`TFLAG` の既定配列は **index 0-99**([[N-105]])。④ **落ちたアサート名は `CLEARLINE` で log ごと消える** ∴ `AUTOTEST_ASSERT` の失敗時に添字スロットへ名前を残し `FAILNAMES` として SUMMARY 直後に出す(§1-V㉖(1) の実装)。**これが無いと赤の特定に実行を3回空費する**。⑤ **ハーネスの窓は実機と同じ 1200x700 に揃える** — 既定(高さ未指定 = `CLIENTHEIGHT` 461 = 可視24行)は**可視31行未満**で行予算の不変条件が原理的に成立せず、そこでの緑は無意味だった。⑥ 最大表示幅は **131 半角**、折り返し閾値は `DrawableWidth = ウィンドウ幅 - max(2, FontSize/6)` = **133** ∴ **余裕は 2 半角しかない**。関連 [[AP-031]] [[AP-028]] [[N-Project001-20260826g]]。"
