  - id: N-Project001-20260721q
    text: "Project003 で `@FUNC(引数A, 引数B)` の **paren(括弧)引数は `#DIM 引数A` / `#DIM 引数B` の明示宣言が必須**(#FUNCTION/#FUNCTIONS でも通常プロシージャでも)。宣言しないと引数が未定義変数になり、**呼び出し側の行で『N行目でエラー』(ロード/実行失敗・autotest Pass=0)** になる(TASK-302: `TBL_COL_CODE(分類,列)` 等で #DIM 欠落→AUTOTEST.ERB の CALL 行でエラー)。手本: `@SHOW_INFO_WITH_UI(対象, ページ移動)` は `#DIM 対象`/`#DIM ページ移動` を持つ。`@CALC_GRID_COLS(ITEM_W)` も `#FUNCTION`+`#DIM ITEM_W`。記述順= `@宣言(...)` → `#FUNCTION(S)` → `#DIM 各引数` → `#DIM ローカル`。日本語引数名/ローカルは可(N-Project001-20260721f)。Project003 のエラー報告は定義側でなく**最初の呼び出し行**を指すことがあるので、未定義変数エラーは呼び先関数の引数宣言を疑う。"
    tags: [Project001, Project003, erb, syntax, function, paren-args, dim, argument, load-error, undefined-variable, erb-port, gotcha]
    project: Project001
    kind: leaf
    topic: N-105
