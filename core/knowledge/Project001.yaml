  - id: N-Project001-20260721f
    text: "Project002→kami の ERB 移植で頻出する Project003 文法/環境の落とし穴: (1) CALL に文字列リテラル引数を渡す時は必ずクォートする(CALL F(\"基礎\",0); 無クォートだと『\"基礎\"は解釈できない識別子です』)。(2) PRINTFORM/PRINTFORML 内で整数式は {式}、文字列式は %式% (整数に %% を使うと『%%の中の式が文字列式ではありません』)。(3) #DIM I / #DIM N は Project003 予約変数名と衝突し警告Lv2(『変数名\"I\"はProject003の変数名として使われています』)→ ローカルは L_I 等にする。(4) autotest 回帰ブロックで ADDCHARA など CHARANUM/キャラ前提を変える処理を suite 途中に置くと後続テストの index 前提を撹乱し count 不一致(fail=0 のまま pass が1足りない)→ chara 変異を伴う回帰は suite 末尾に置く。(5) literal 丸写しは依存差で不能なことが多く『構造を忠実移植+kamiデータ流用(ABLNAME名前ベース反復)+未実装はプレースホルダ/仮値』が現実解。実証: 能力表示8タブUI移植(TASK-235)。"
