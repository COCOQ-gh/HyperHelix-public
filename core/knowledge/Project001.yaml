  - id: N-Project001-20260825b
    text: "**Project001 同梱ビルド(0.2.6.0+7b7dd3bf)の部分背景色: ガイド docs/53 の前提が2点反転している(spike 実測 2026-08-25)。**① `<div background_color>` は **GRAPHICS でも塗られる**(ガイドは「無効」と断定するが、その根拠ソースは同梱 exe より古い別コミット — 同梱ビルドのハッシュはソースリポジトリの全履歴に存在しない)。行全体ハイライト+`<nonbutton title>` ツールチップ併用まで成立。ただし**行の一部だけ**塗ると div の幅計測ずれ(罠③)で後続テキストが重なる — 塗る区間は行末に置くか行全体を div 化するか island 絶対配置にする。② **`GSETBRUSH` は使用禁止**: 格納 brush を使う塗りは**塗り命令の種類を問わず** access violation(0xC0000005)でプロセスごと即死する(G_POLYGON_FILL も GFILLRECTANGLE も。ガイドの「G_POLYGON_FILL なら安全」は誤り)。brush 未設定の fallback 経路のみ安全。矩形パネルは brush 不要 — **`GCLEAR gid, ARGB` が全面塗り**なので `GCREATE -> GCLEAR(色) -> SPRITECREATE -> island <img>` で任意色(半透明 0x80… も可・GGETCOLOR 読み戻し一致)のsprite が作れる。**クラッシュ地点の特定手順**: 各ステップ後に `OUTPUTLOG` を挟んで起動 — プロセスが AV で死んでも直前までのログが残るので、最後のマーカーがクラッシュ命令の直前を指す(exit code -1073741819 = 0xC0000005)。正本 = doc/project-notes/spike-bg-partial-color.md。関連 [[N-Project001-20260824c]](HTML_PRINT の行分断規則は不変)。"
    tags: [background-color, div, graphics, gsetbrush, gclear, sprite, island, crash, access-violation, setbgcolor, Project003, build-drift, docs53, html-print]
    project: Project001
    strength: 3
    last_used: 1000
    state: active
  - id: N-Project001-20260825c
    text: "**Project001 に画面クリア機構は無かった(全画面が DRAWLINE から印字を始めるだけ)。`CLEARLINE LINECOUNT` で導入できることを実機で確認(spike 2026-08-25)。** ① **本文層は種類を問わず全消し**(素テキスト/DRAWLINE/PRINTBUTTON/HTML_PRINT の div いずれも残らない。11->0・226->0)。**過大値はクランプ**され例外にならない(`requested=1002 -> after=0`)ので、呼び出し側が行数を管理する必要はない。② **island は本文層の外**: `LINECOUNT` 2->0 でも `SPRITECREATED` は 1 のまま。消すには `HTML_PRINT_ISLAND_CLEAR`(+資源を捨てるなら `SPRITEDISPOSE`/`GDISPOSE`)が要る。∴ **画面クリアの共通部品は2層を対で消す**。③ **【最重要の副作用】消した行は `Project003.log` からも消える** — log は印字履歴ではなく**最終表示バッファの写し**。∴ **クリアより前の画面を照合していた `EXPECT_TEXT` は落ちうる**。**【2026-08-28 重大是正】ここに書いていた『本作は 1600件超』は誤り** — 実数は **47件**で、すべて `tools/Project003-autotest/AUTOTEST_INTERACTIVE.ERB` にある(`AUTOTEST.ERB` の `EXPECT_TEXT` は **0件**)。この誤った数字を根拠に、私は `@EVENTSHOP` へ画面クリアを入れる案を2つの WO で**名指しで禁止**し、その結果ユーザーが同じ案を提案するまで2ラウンド遠回りした。実際に入れて測ったところ**影響は 0件**(本体 1890/0・interactive 40/0 TextPass 48/0)。∴ **禁止事項を書くときは、その根拠の数を必ず自分で数える。引き継いだ数字を繰り返し書くと、書くたびに硬化して疑いにくくなる**。関連 [[AP-030]]。クリアを入れる変更は**着手第1手が旧契約 grep**で、アサートは「クリア前に計測」か「1画面ぶんの狭い窓」([[N-Project001-20260824b]] の作法)へ寄せる。④ コストは **5.55ms/回**(全消し+41行再構築)で、軽量化ガイドが挙げる「毎ターン全 CLEARLINE」の警告水準に届かない。⑤ **spike の停止条件は『全部測れたか』ではなく『判断が決まったか』** — island が描画から消えたかは PNG 不成立で未確定のままだが、**残るなら ISLAND_CLEAR が必要・消えるなら無害**で安全形が同一なので、追加委託(推定300K tokens)を打ち切って設計を確定できた。正本 = doc/project-notes/spike-screen-clear.md。関連 [[N-Project001-20260825b]] [[N-034]]。"
    tags: [Project001, Project003, clearline, linecount, screen-clear, screen-transition, residual-display, island, sprite, html_print_island_clear, spritedispose, gdispose, spritecreated, Project003-log, expect_text, autotest, assert-design, legacy-contract-grep, cost, redraw, spike, stop-condition, printwindow, capture-regression]
