  - id: N-109
    text: "UTF-8 BOM ゲームファイル(例: Project001 COMF357)を編集時、`[IO.File]::WriteAllBytes(p, enc.GetBytes(text))` は **BOM を失う**＝`Encoding.GetBytes()` はプリアンブル(BOM)を出力しない(BOM は StreamWriter/`File.WriteAllText` が別途 GetPreamble で付与)。BOM が消えると Project003 が encoding を CP932 と誤検出し、UTF-8 3byte 文字(例:食事)直後の `\"` が食われ『文字列が閉じられていない』等の parse エラー(見かけ上は無関係な行番号で報告)。対策: BOM ファイルは `[IO.File]::WriteAllText(p, text, [Text.UTF8Encoding]::new($true))` で書く(プリアンブル付与)か、`GetPreamble()+GetBytes()` を WriteAllBytes。検証: 書込み後に先頭3byte==EF BB BF を必ず確認(FFFD 検査だけでは BOM 欠落を見逃す)。CP932(BOMなし)ファイルは GetBytes/WriteAllBytes で可。"
    tags: [encoding, utf8-bom, powershell, getbytes, preamble, corruption, safe-edit, Project003, Project001]
    project: Project001
    kind: leaf
    topic: N-104
    strength: 1
    last_used: 762
    state: active

  - id: N-110
    text: "Project001/Project003 の TRAIN コマンド表示ゲートは **@COM_ABLE{N}(Project003 予約関数)が駆動**。@SHOW_USERCOM はメタボタン(700-999)のみ描画し、訓練コマンド(COMFxxx)はエンジンが @COM_ABLE{N} を自動呼出して表示可否を決める。Project001 では @COM_ABLE{N}→`CALL COM_ABLE_COMMON,{N}`→`COM_ABLE_FLAG:N` を参照(==-1→RETURN0 / ==1→RETURN1 / ==0→ARG<300は非交神で0・ARG>=300は交神中で0、それ以外 fall-through=表示)。**@CREATE_COMABLE_LIST は COM_ABLE_FLAG を事前計算するだけで、それ単体では表示を止めない**(CONTINUE で未設定=0 のままだと COM_ABLE_COMMON が fall-through して表示される)。∴ コマンド可視性を変える改修は **COM_ABLE_COMMON(=@COM_ABLE が実際に読む関数)側**でゲートする。教訓(verify-layer): ゲームの表示/可否を autotest 検証する時は『エンジンが実際に読む関数の戻り値』層(ここでは COM_ABLE_COMMON の RESULT)で assert する。中間状態(COM_ABLE_FLAG 値)だけの検証は通っても実挙動と乖離する(TASK-029 で COM_ABLE_FLAG を検証し集約が効かず playtest で発覚→TASK-20260702-001 で COM_ABLE_COMMON 層に修正+検証)。永続 flag(COM_ABLE_FLAG)に -1 を残すと後続で恒久無効化=VARSET クリアない前提では live 関数ゲートが安全。"
    tags: [Project003, com-able, command-display, train, autotest, verify-layer, gate, Project001]
    project: Project001
    strength: 2
    last_used: 764
    state: active

  - id: N-111
    text: "行 index 挿入(line-array Insert)で文/ボタンを『アンカー行の直後』に入れる時、そのアンカーが IF/ELSEIF の**本体**でまだ ENDIF が来ていないと、挿入物は意図せず**その制御ブロック内にネスト**する。実害例(Project001 TASK-029→20260702-003): SHOP `[116]人化逢瀬` を `PRINTBUTTON [101]` の直後に挿入したら [101](交神条件)IF の内側に入り、交神条件を満たさない限り非表示になっていた(playtest 送りだったため見逃し→autotest 化で検出)。対策: (1)挿入後は**囲む制御ブロックを必ず確認**(前方の IF と後方の ENDIF の対応)。(2)兄弟位置に置きたいなら、先行ブロックの ENDIF の**後**をアンカーにする。(3)可能なら挿入対象を一意な ENDIF や関数境界に取る。教訓の一般化: 表示/条件つき要素の autotest は『その要素が出る/出ない』を両条件(Lv3表示/Lv1非表示 等)で assert すると、この種の誤ネストを捕捉できる。"
    tags: [Project001, Project003, editing, line-insert, control-block, nesting, if-endif, autotest, regression, shop]
    project: Project001
    strength: 4
    last_used: 949
    state: active

