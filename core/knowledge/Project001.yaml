  - id: N-053
    text: "Project003 のレイアウト/配色は HTML_GETPRINTEDSTR で autotest 自動検証できる(『ピクセルが見えない』を構造検証で代替)。HTML_GETPRINTEDSTR(0)=最新の論理行(末尾相対, LINECOUNT とは別系。0が最新)。色=<font color='#RRGGBB'>, 太字=<b>, 整列=<p align='..'>, ボタン=<button value='..'>。使い方: PRINTL で行を確定→ %HTML_GETPRINTEDSTR(0)% を RESULTS:n 等の組込文字列配列に form 代入(#DIMS ローカルへの form 代入は『式が異常』で不可)→ STRCOUNT(cap, needle)>=N で検査。重要: 同一行に複数 needle を当てる時は『一度キャプチャしてから複数 assert』にする(AUTOTEST_ASSERT が PASS/FAIL を PRINTL して line0 を次行へずらすため、2回目の HTML_GETPRINTEDSTR(0) は assert 行を読んでしまう)。版確認: HSV_TO_RGB/CSVEXIST 不在・EXISTCSV/CLIENTWIDTH/PRINTCLENGTH/STRCOUNT 在(Project003-builtins.json)。MaxLog 既定5000(Project001 は config 500→5000 に是正、E-5)。UTF-8 ERB 不可(CP932 固定)。kit 実装例: dev-support/erb-v2/tests/AUTOTEST_V2_DISPLAY.ERB。"
    tags: [Project001, Project003, autotest, html-getprintedstr, display-verify, layout, builtins, spec]
    project: Project001
    strength: 3
    last_used: 463
    state: active

  - id: N-054
    text: "Project001 のキャラ項目(能力ABL/素質TALENT/経験EXP/基礎BASE)は定義CSV(CP932)に index 追記で増やせる。配列余裕: VariableSize ABL=1000(max92)/TALENT=1000(max400)/BASE=100(max11) は余裕、EXP=100(max99)は満杯=拡張要(EXP,100→200)。新ラベルは既存 index を変えないため**追加自体は回帰なし**(autotest緑のまま)。ただし能力表示は各ループが境界付きで、追加項目は**表示に出ない(inert)**: NEW_PRINT_ABL_FULL=FOR 0..92, 参考値 70..92 / SHOW_INFO_ABL は PRINT_ABL_COUNT の22枠ホワイトリスト / SHOW_INFO_TALENT=REPEAT 270 / SHOW_INFO_EXP=固定セット / SHOW_BODY_K=BASE 6-10。表示するには各ループ/ホワイトリストの範囲拡張が必要。CSTR(口上)はカテゴリごと kami 未実装で消費エンジン無=データ追加しても inert。実証: K-only 108項目を Chara201 へ全移植(TASK-255)、起動/551アサート緑・0警告だが新項目は能力表示に非表示。"
    tags: [Project001, chara-csv, ablup, variablesize, display-loop, inert, erb-port, csv]
    project: Project001
    strength: 4
    last_used: 468
    state: active

  - id: N-055
    text: "Project003: 添字付き変数(LOCAL:81 等)を別のキャラ変数のキャラ/要素添字に使うときは**括弧必須** — TALENT:(LOCAL:81):238 / BASE:(LOCAL:81):6 / BASE:(LOCAL:81):8 > 0。括弧なし TALENT:LOCAL:81:238 はコロン過多でパース失敗し『NN行目でエラー』=suite全体がload不可(pass=0)になる。CALL の引数位置(CALL F, LOCAL:81)は括弧不要。単純な #DIM 変数(対象 等)を添字に使う場合は TALENT:対象:238 で可(括弧不要)。STUB差替(N-050系)で関数を実装へ移す時は元STUBを必ず削除(二重定義=システム関数上書き禁止でエラー)し、既存実装(例 GET_PENISSIZE は _COM_COMMON 既存)は再定義しない。"
    tags: [Project003, erb, syntax, indexing, parens, stub, erb-port, autotest]
    project: Project001
    strength: 6
    last_used: 519
    state: active

  - id: N-056
    text: "客観ソースの無い per-entity データ(例: Project001 体型素質=既存キャラが体型ヒント素質を皆無)は『安定キー(NO/番号)由来の決定的割当 + 非破壊(値0=未設定のときだけ書込, CSV値優先) + 素数係数で隣接キーの分散確保』で自動差別化できる。注意: 単純な NO/divisor (例 (NO/5)%7) だと低番号がクラスタ(主要キャラが偏る)→ ((NO*3)%7) 等の乗算modで隣接を散らす。populate と派生計算は ENSURE_*(ガード付き冪等: 算出済なら即RETURN)に統合し、初期化(CHARA_INIT)と表示(SHOW_*)の両経路から呼ぶと取りこぼさない。実証: TASK-260 で 44キャラに体格/体型/バスト/ヒップサイズを番号割当しスリーサイズ差別化(569緑)。"
    tags: [Project001, data-population, deterministic, idempotent, chara-init, erb, design]
    project: Project001
    strength: 1
    last_used: 472
    state: active

  - id: N-057
    text: "Project003: 単一英字ローカル名(h/v/s/N/I 等多数)は予約変数名と衝突し #DIM が無効化→そのグローバル変数を破壊する。ローカルは日本語名(算出値/種 等)か L_ 接頭辞で。**重大**: この種は autotest を偽通過する — (1)autotest config は @SYSTEM_TITLE 注入のため『システム関数の上書き:YES』で実 config(NO)と乖離、(2)autotest は ERB の load 警告(警告Lv2)を fail にしない、(3)autotest は CHARA_INIT 等の実起動経路を経由しない。結果、予約変数の global 破壊が起動経路(CHARA_INIT→ENSURE→SET_BODYSIZE 等)でのみ顕在化し『起動時エラー落ち』になるのに 569緑。対策: Run-Project001Autotest に reserved-name 警告ガード追加(『Project003の変数名として』を検出→classification=reserved-var, HH-028陽性テスト済)。load系/起動系の疑いは『実 config を逐語コピー(バイナリ型セーブ:YES 保持)+上書きだけYES+@SYSTEM_TITLEで LOAD_OK_MARKER 到達』を確認する実 config ブートで切り分ける。"
    tags: [Project003, erb, reserved-variable, autotest-gap, config-divergence, startup-crash, harness, erb-port]
    project: Project001
    strength: 5
    last_used: 520
    state: active

  - id: N-058
    text: "kami Project003(0.2.6.0) HTML描画 spike(TASK-268): SETCOLOR+文字バー(■□)は <font color='#RRGGBB'> として通常行に出力されHTML_GETPRINTEDSTRで捕捉=検証可・推奨。HTML_RECT_BAR の <shape type='rect'> も行内で捕捉可。だが HTML_PRINT \"<div display='absolute-lefttop'>...\" は0エラーだがHTML_GETPRINTEDSTRで空=オーバーレイ層描画(視認はプレイテストのみ・autotest検証不可)。∴リッチUIは色付き文字バー+SETCOLORで作ると検証可、絶対配置カードは視認をユーザー playtest に委ねる。参照テンプレ doc/project-notes/SHOP.ERB は描画層のみ(C_SHOP_*_Y定数/列挙欠落・30プレースホルダ)で直接ロード不可=見た目仕様の参照に留め、移植先(現行SHOW_SHOP)が実データを持つなら見た目だけ再現が最効率。訂正(TASK-270): **SETBGCOLOR はこの Project003 で全画面(コンソール)背景色を変える=全画面点滅・バー不可視**(span背景ではない)→ バー・ボタン・任意の印字を含む**全コンテキストで使用不可**。TASK-286 でタブボタン背景色に誤用→再発(TASK-287 で再修正)。正解=前景色のみ: 充填/残を `█`(UNICODE(0x2588), 隙間なし全角ブロック)で SETCOLOR 描画し、値は**全角**にして(TOFULL_K: 半角→全角)バー中央セルへ重ねる(全角同士で桁が揃う)。■(U+25A0)は字間に隙間。全角混在の文字数えは STRLENS=表示幅(全角2)/STRLENSU=文字数(全角1)、SUBSTRING vs SUBSTRINGU も同様→全角セル処理は **STRLENSU+SUBSTRINGU で統一**(混在すると値が崩れる)。追記(TASK-295 S-1〜S-10調査): (1) HTML_PRINT第2引数デフォルト0→lineEnd=true→毎回改行。インラインは`, 1`必須。(2) div width属性は背景矩形幅のみ、レイアウト幅=テキスト幅(横並びカードは不可)。(3) **ALIGNMENT RIGHT + 複数PRINTFORM = merge bug**(ShiftPositionX累積でX座標が画面外へ飛ぶ)→1行1命令(HTML_PRINT+<font>タグ)が正解。(4) バー値テキスト背景色の正解: HTML_PRINT @\"<div background_color='%TOSTR_HTML(色)%'><font color='#FFF'>..字..</font></div>\", 1。TOSTR_HTML()は汎用関数v2(COLOR.ERB)のユーザー定義関数で整数→#RRGGBB変換。(5) padding='3'はpx無しだとFontSize/100の整数除算=0px。必ず'3px'を付ける。"
    tags: [Project001, Project003, html, shop, ui, setcolor, setbgcolor, bgcolor, background-color, tab, highlight, prohibition, forbidden, spike, display-verify, alignment-right, html-print, tostr-html, inline, padding]
    project: Project001
    strength: 9
    last_used: 550
    state: active

  - id: N-Project001-20260721a
    text: "Project001の対話UI(INPUT/ONEINPUT/PRINTW)はautotest化できる: autotest-kitのPostMessage注入(`Run-Project001Autotest.ps1 -EnableInputInjection`)でERB側の`[[AUTOTEST]] WAITING_INPUT <値>`/`WAITING_ONEKEY <c|ENTER>`+OUTPUTLOGマーカーを検知し、RICHEDIT子窓へWM_CHAR/WM_KEYDOWNを送る。注入時はHidden不可でMinimized(AK-003)。注意: (1)kitの汎用ランナーはerrorLine正規表現が良性の起動時`警告Lv2`を誤fatal扱いし中断するため、Project001自前ランナー(errorLineは`エラーが発生しました|例外|未定義`のみ・SUMMARY待ち)を使う。(2)注入ERBはCP932 no-BOMで配置(UTF-8 BOMのままだとload失敗、Project003.log空)。実証: WAITING_INPUT 7/42→INPUT受領 pass=2/2。"
    tags: [Project001, autotest, input-injection, postmessage, playtest, tooling]
    project: Project001
    strength: 4
    last_used: 441
    state: archived

