  - id: N-Project001-20260829a
    text: "**常に赤いゲートは、その場の判断に置き換わって消える — そして規定の正しいゲートは一段下の節に居たまま届かない(2026-08-29 /cycle ordinal 13 実測)。** `evaluate.md` V1 は staged whitespace gate を `git diff --cached -U0 | grep '^+' | tr -d '\r' | grep -cE '[[:space:]]+$'` = 0 と規定し、**同じ節で「`git diff --cached --check` の出力長で判定するな(CRLF リポジトリでは毎回 nonzero)」とまで明記している**。にもかかわらず同一セッションの 14 コミットで規定ゲートの実行は **0/14** で、代わりに禁止された `--check` を回して常時赤に当たり、その既知事実をゼロから調べ直した(直前コミットで同じ警告が出ることを確認する、という遠回りまでした)。**実害**: host `bf2272a` の追加行に末尾空白が1件通過し、同じ編集が `履歴` ラベルの重複行も残していた — 遡及検査で初めて発見。**機序は2段**: (1) 先に走らせたゲートが常時赤なので「これは無視してよい既知の赤」と判断する必要が生じ、その判断で checklist 全体を「済んだ」ことにしてしまう (2) 正しいゲートは checklist の該当節を開かないと届かず、`finish` のような必ず通る入口には載っていない。**同ファイルは同じルールについて uptake 0/6 を既に記録しており、これが2度目の測定** ∴ 資材の再掲・強調では届かないことが確定した。**対策**: ①常時赤になりうるコマンドはゲートに使わない(赤の意味が消える) ②遵守を要求したい検査は checklist 行ではなく**必ず通る実行経路**(`finish` の fail-closed チェーン)へ移す ③行を差し替える編集では、**置換後の行が直後の行と意味的に重複していないか**を必ず見る(文を跨いで続く行の前半だけを置換すると、ラベルだけの宙ぶらりんな行と末尾空白が残る)。関連 [[N-Project001-20260826d]](禁止の射程)・AP-032(資材に答えがあるのに手順が届かない)。"
