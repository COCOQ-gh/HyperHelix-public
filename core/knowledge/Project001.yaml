  - id: N-093
    text: "Project003 の `||`/`&&` は**短絡評価しない**(両辺を必ず評価)。範囲外indexを渡しうる関数で片側だけガードしても、もう片側の `TALENT:(ARG):x`/`CFLAG:(ARG):x` 等が index=-1 を評価して『キャラ登録番号の範囲外』でクラッシュする(例: `@HAS_PENIS` の `RETURNF IS_MALE(ARG) || TALENT:(ARG):ふたなり` は IS_MALE をガードしても TALENT:(-1) で落ちる)。対策: キャラindexを引数に取る #FUNCTION/helper は**関数先頭で `SIF ARG<0 || ARG>=CHARANUM RETURNF 0`** とガードする。背景: 巫女生活(BEGIN TRAIN, FLAG:2=0)は MTAR/MPLY を初期化せず(交神の KOUSHIN_SELECT のみ設定・AFTERTRA で CLEAR)、移植元 Project002_COMF の target系コマンド(COM_ABLE367等)が `HAS_PENIS(MTAR:0=-1)` を渡してクラッシュ(TASK-393)。既存の堅牢な COM_ABLE は `SIF MTAR_NUM<=0 RETURN 0` でガード済(移植時に踏襲漏れ)。crashは helper ガードで封止できるが、巫女生活で当該コマンドを使えるようにするには MTAR populate が別途必要。関連 [[N-092]]。"
