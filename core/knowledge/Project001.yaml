  - id: N-107
    text: "cp932 ゲームファイルの表示用語 一括改称(例: 評判->知名度)を guard(Read/無制限grep 不可)下で安全に行う手順。(1)全文ダンプせず PowerShell cp932 で該当語の件数・行番号のみ取得。(2)文法/意味リスクを content 非出力で判定=各ヒット行を『トークン構造分類』(複合語で使われるか/形容用法か 例:`評判の…`->知名度だと不自然/コメント行か/対象変数(FLAG:84)紐付けか/PRINT・GRID・LABEL 表示か)。形容用法ゼロなら blanket 置換で文法崩れなし・複合語のみ別処理と判る。(3)置換は順序固定(複合語->単体)で一貫適用し ReadAllText/WriteAllText cp932 で書戻し。(4)検証=対象語 残0・置換語 増・FFFD=0・主 autotest 無回帰・起動警告0。最終見た目/HUD桁揃えは playtest 委譲。"
