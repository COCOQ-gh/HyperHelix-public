  - id: N-Project001-20260825d
    text: "**並行セッションの衝突には「ファイル単位」と「内容単位」の2種類があり、既存のゲートは前者しか見ていない。** concurrency.md / HH-058 が守るのは P6 target set の disjoint 性と hunk 単位コミット = **同じ行を同時に書かないこと**。しかし **ファイルが完全に disjoint でも、片方の設計判断が他方の前提を無効化する**ことがあり、この衝突はどのゲートも発火しない。実測(2026-08-25 /cycle ordinal 7・同一日に2件): ① §1-V⑯ の spike が **island** の挙動を測っている間に、並行セッションは §1-V⑮ の実装で **island->CBG へ設計転換**していた(island は OnPaint で常に最前面に描かれ本文を塗り潰したため)。∴ spike は**実装が既に捨てた機構**を測っていた。② 同じ spike が「PNG キャプチャは退行して使えない」と結論した一方、並行セッションは**同じリポジトリ・同じビルドで PNG 検証を3〜4周成立**させ、さらに自前スタブの欠陥まで是正していた。∴ spike は**実装が証明済みの事実を否定**していた。どちらも commit 後に /cycle で発見して事後是正した。**対策(安価・機械化不要)**: 並行セッションが既知なら **S2 で `git log --oneline tasks/records/` を見て自タスク開始以降の peer record を読む**。台帳ノートの tag 検索は「過去の教訓」しか返さず、**「いま隣で決まったこと」は原理的に入っていない** — S2 の retrieval には時間方向の穴がある。**関連する一般形**: 技法の spike は「最終的に使う層/構成の組み合わせ」まで再現して初めて導入可否の根拠になる(並行セッションも同型の D2 を記録している — spike ではテキストも island に載せたため層順の罠が見えなかった)。正本 = doc/project-notes/spike-screen-clear.md §9。関連 [[N-Project001-20260825c]] [[N-Project001-20260825b]]。"
