  - id: N-108
    text: "guard で既存本文を読めない CP932 ゲームファイルを大改修する時は、部分編集(anchor 依存)より『全面リライト』が安全＝表示テキストを全て新規作成し不可視の既存文への依存を断つ(MVP テキストは placeholder ゆえ再作成可)。安全策2点: (1)書込みは例外フォールバック エンコーダ `[Text.Encoding]::GetEncoding(932, [Text.EncoderExceptionFallback]::new(), [Text.DecoderExceptionFallback]::new())` を使い、CP932 非対応文字(波ダッシュ〜/em-dash 等 [[N-027]])を silent '?' 置換でなく throw で検知(FFFD 検査は '?' を見逃す)。(2)書込み後に cp932 read で FFFD=0・`^@\\w+` 関数数・byte数を確認し Project003 ロード(autotest)で #FUNCTION 署名/SELECTCASE 崩れを検知。%は全角％で PRINTFORM の %var% 誤解釈を回避。"
