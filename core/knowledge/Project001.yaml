  - id: N-Project001-20260826d
    text: "**自分が「実装不可能」と結論したときは、禁止の *射程* を疑う。禁止だけを書いた資材は過剰適用される。** 実測(2026-08-26): 神域 HUD の右側項目に背景色を付ける要望に対し、`ui-style-guide.md` §5 の禁止事項「**行の一部を塗る div**」(幅計測ずれで後続テキストが重なる=`spike-bg-partial-color.md` 罠③)を根拠に「実装方式が未確定・既知の不具合を再現する」と判定し、**ユーザーへ裁可を求めた**。しかし正解は **禁止の射程を読み違えていた** — 禁止されていたのは「**本文行に**部分幅 div を混ぜること」であって塗りそのものではない。塗り div を本文行に入れず**直前の空行を `HTML_PRINT` へ置き換えてキャリア行にまとめ `ypos` で送れば**、本文行に1文字も足さないのでズレは構造的に発生しない(engine 根拠: div の `width` は flow 幅に反映されない・空 div は要素が生成されない・後続要素の出発点は `PointX + Width` — 資料 `Project003LabH/.../docs/57`)。**しかもこの回避策は同一リポジトリの `SHOP_TAB_DIVS` が既に実装していた** — 手元に実例がありながら気づかなかった。**教訓は2つ**: ① **『不可能』の結論は、禁止の *理由* まで遡って射程を確認してから出す**。特に裁可を求める前に一度疑う — **不要な裁可要求はユーザーの判断という最も高価なリソースを浪費する**。② **禁止事項を書くときは『何が禁止か / なぜか / 代わりに何をするか』の3点を揃える**。回避策への参照が無い禁止行は、既存の解決策を読み手から見えなくする。関連 [[N-Project001-20260825d]](ゲートが見ていない種類の衝突)。"
