  - id: N-Project001-20260722a
    text: "Project001 の guard-cp932-dump 下で ERB 実装を調査する安全レシピ: PowerShell で該当行±2行だけを UTF-8 の scratchpad ファイルへ抽出し、それを Read する(本文の直接ダンプをしない)。ただし CP932 の decode は必ず [System.Text.Encoding]::GetEncoding(932) を使う — pwsh7 の `Get-Content -Encoding Default` は UTF-8 の意味で、CP932 コメント/文字列が U+FFFD 化する(識別子・数値・FLAG参照は ASCII なので生存し、式の解析だけなら可能。実証: TASK-Project001-20260722-002 の FLAG:87 調査)。同じ理由で hook 提示の `-Encoding Default` 編集レシピを pwsh7 で ERB に使うと破損する(capture: TASK-Project001-20260722-003)。"
