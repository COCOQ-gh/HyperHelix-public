  - id: N-Project001-20260721h
    text: "Project003 のレイアウト/配色は HTML_GETPRINTEDSTR で autotest 自動検証できる(『ピクセルが見えない』を構造検証で代替)。HTML_GETPRINTEDSTR(0)=最新の論理行(末尾相対, LINECOUNT とは別系。0が最新)。色=<font color='#RRGGBB'>, 太字=<b>, 整列=<p align='..'>, ボタン=<button value='..'>。使い方: PRINTL で行を確定→ %HTML_GETPRINTEDSTR(0)% を RESULTS:n 等の組込文字列配列に form 代入(#DIMS ローカルへの form 代入は『式が異常』で不可)→ STRCOUNT(cap, needle)>=N で検査。重要: 同一行に複数 needle を当てる時は『一度キャプチャしてから複数 assert』にする(AUTOTEST_ASSERT が PASS/FAIL を PRINTL して line0 を次行へずらすため、2回目の HTML_GETPRINTEDSTR(0) は assert 行を読んでしまう)。版確認: HSV_TO_RGB/CSVEXIST 不在・EXISTCSV/CLIENTWIDTH/PRINTCLENGTH/STRCOUNT 在(Project003-builtins.json)。MaxLog 既定5000(Project001 は config 500→5000 に是正、E-5)。UTF-8 ERB 不可(CP932 固定)。kit 実装例: dev-support/erb-v2/tests/AUTOTEST_V2_DISPLAY.ERB。"
    tags: [Project001, Project003, autotest, html-getprintedstr, display-verify, layout, builtins, spec]
    project: Project001
    strength: 3
