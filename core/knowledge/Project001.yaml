    text: "**自分の測定を疑う順序 — 数が合わないとき、第一の容疑者は相手ではなく自分の測り方である(2026-08-29 に実測4件)。** ①**『実測した』は『全数を測った』ではない**: `N-Project001-20260826a` は ERB の encoding を『実在4種』と記していたが、それは4例を見つけただけで母集団を数えていなかった。全 807 ファイルを分類すると **8 種**で、最多の UTF-8 BOM+CRLF ですら 431/807 = 53%。このノートは当時セッション中の全 WO の encoding 節の根拠に使われており、**誤りがそのまま下流へ伝播していた**。∴ ノートに件数・種類数を書くときは**標本か全数かを明記する**。②**他者の数値と食い違ったら、まず自分が何をどこで数えたかを確定させる**: (a) executor の『95件』を `FLAG:5 == 9` の件数と解して自分の 26 と比較し食い違いと判断したが、実際は `FLAG:5` の**参照数**が95で executor が正しかった(数えた**対象**の取り違え)。(b) `MODC_PRINT_LIVE_PAGE` を1ファイルだけ数えて『3画面が同型』と合わないと判断したが、全 ERB では定義1+呼出3で完全に整合した(**走査範囲**の不足)。(c) 別セッションも同型を踏んでいる — 実装の語が『総合**神社**レベル』なのに `総合レベル` で検索して『0出現』と誤測定した(**検索語**の不一致)。③**CP932 のファイルへ UTF-8 の検索語を当てると一致しない**ため件数が過少に出る(私自身が §1-V㊴ の規模を6ファイルと誤測定し、正しい decoder で数え直して 23ファイル/64件になった)。日本語語句の照合は**ファイルごとに実測した encoding で復号してから**行う。**一般形**: 検証で不一致が出たときの調査順序は『対象 → 範囲 → 検索語 → 復号』を自分側で先に潰し、そのうえで相手を疑う。関連 [[N-Project001-20260826a]] [[N-Project001-20260825a]]・AP-032。"
