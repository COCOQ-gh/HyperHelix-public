  - id: N-091
    text: "Project001/Project003 の SHOP は **クリック→buy/@USERSHOP のルーティングと対話メニューを autotest で再現できない**(boot smokeはコード経路のみ)。診断は **可視デバッグ(`PRINTFORML [DBG] ...{var}`)を仕込み→ユーザー playtest で実測**するのが確実(`PRINTFORMW`はautotestをキー待ちでハングさせるので`PRINTFORML`を使う)。実例(TASK-357): 『巫女カードのコマンドが機能しない』の表層報告→静的にはdispatch正常(`card.dispatch_usershop_820`を追加し RESULT=820→@USERSHOP→@MIKO_CARD_ACTION を682緑で確認)→buy-range実測(`VariableSize.CSV ITEMSALES=1000`, `@SHOW_SHOP`が`VARSET ITEMSALES,0`で全非売=全クリック@USERSHOP行き)→[DBG]+playtestで**真因=空スロットのno-op**(巫女セット済カードは正常動作)と判明。教訓: 表層症状(不動作)は鵜呑みにせずランタイム実測で切り分ける。Project003のSHOP buy判定は ITEMSALES≠0 のみ購入、他は@USERSHOP。関連[[N-088]](値域)[[N-089]](UI playtest)[[N-090]](ボタン幅)。"
