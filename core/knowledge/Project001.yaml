  - id: N-Project001-20260721p
    text: "Project003 で状態を持つ一覧/テーブル画面(ソート/ページ)を1関数で実装する型(K移植 TASK-301): @関数内の **LOCAL 配列は同一CALL内の GOTO 再描画ループをまたいで永続**するため、`LOCAL:(100+i)`=対象index配列 / `LOCAL:(500+i)`=ソート値 のように**関数スコープの動的配列**として使える(global TFLAG等を汚さない)。CALL する行レンダラ/色関数は別フレームなので LOCAL を破壊しない(ARRANGE_*/SHOP_PCTCOLOR_K と共存実証)。stateless 再描画= `$DRAW … INPUT … 分岐 … GOTO DRAW`。value 名前空間: 列ソート=小番号 / ナビ=1000系 / 行選択は **キャラindex + 大オフセット(10000+)** で衝突回避(K の NO+100→NO_TO_CHARA は不要、kami は RESULT=index 直接で `SHOW_INFO_WITH_UI(index,1)`)。挿入ソート= `FOR i,1,N / FOR j,i,0,-1 / 比較で SWAP(index配列とキー配列を並行) / 整列済で BREAK`、`NOW_SORT==PREV_SORT → DESC=!DESC` で昇降トグル(初回=昇順)。**ソート順の決定的検証**= 注入で多様データ列をソート→ Project003.log のプレーン行順を Python で読む(EXPECT_TEXT は順序を assert 不可だが log 実順は確認可、[[N-Project001-20260721n]]の発展)。表は表示幅で `|` を揃える(全行 ≤78hw、ヘッダ filler を行 pre-`|` 幅に合わせる)。実証: 能力一覧テーブルを体力降順 5000/5000/2000/300 で確認、列|が表示列[13,18,23,28,33]一致。"
    tags: [Project001, Project003, ui, table, list-screen, sort, insertion-sort, local-array, function-scope, goto, stateful-screen, injection, display-verify, erb-port, value-namespace, charadata, shop]
    project: Project001
