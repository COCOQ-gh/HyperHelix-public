  - id: N-Project001-20260721o
    text: "CP932(Shift-JIS)の ERB を日本語/記号リテラルで内容検索するとき、Grep(ripgrep)ツールは**偽陰性**を返す — クエリの UTF-8 バイト列をファイルの CP932 バイト列に当てるため不一致になる(TASK-299: `◇` を grep して0件→『存在しない』と誤判断しかけたが、Python cp932 デコードで実在を確認)。対策: CP932 ファイルの内容照合は **Python で `open(path,'rb').read().decode('cp932')` してから Python 側で検索**する(編集も同様: read cp932→置換→write cp932)。ASCII(関数名 `@FOO`・変数 `CFLAG:4`・英数)の grep は CP932 でも ASCII 互換なので一致するため、grep が使えるのは ASCII パターンに限る。AUTOTEST.ERB だけは UTF-8 BOM(Prepare が CP932 変換)なので `utf-8-sig` で扱う。関連: 表示確認は Project003.log(UTF-8)を Python で読む(N-Project001-20260721n)。**追記(TASK-305): Data/ERB の ERB も CP932 一律でなく UTF-8(BOM) が混在する**(例 `システム/UTIL_AFTERTRA.ERB`=UTF-8 BOM、Project003 は BOM 検出で読む)。∴read/write 前に**先頭3バイト `EF BB BF` を判定**し、検出 enc で読み書きする(`raw[:3]==b'\\xef\\xbb\\xbf' → utf-8-sig else cp932`)。cp932 決め打ち read は BOM ファイルで `UnicodeDecodeError: 0xef`。encoding ガードの U+FFFD(`EF BF BD`)とは別(BOM は `EF BB BF`)。"
    tags: [Project001, Project003, erb, cp932, shift-jis, utf-8, bom, encoding, grep, ripgrep, false-negative, search-miss, python, tooling, content-search]
    project: Project001
    strength: 3
    last_used: 560
