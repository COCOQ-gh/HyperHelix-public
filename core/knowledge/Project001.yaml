    text: "Project001 の口上(調教中キャラ別セリフ)は engine 移植済+調教フローに配線済だが実データ皆無=現状無音。① dispatch engine=`Data/ERB/コマンド/TEXT_KOJO.ERB`(442行, ヘッダ『調教時キャラ別口上を一括管理』= Project002 口上 EVENT system 本体, 47 @関数: @EVENTSHOP/@KOJO_MESSAGE_COM_MASTER/COM_ASSI/PLAYERCHANGE/CHANGEASSI 等)が `TRYCALLFORM KOJO_MESSAGE_*_{NO:キャラ}`+`TRYCCALLFORM TRY_{NO}` でキャラ番号別へ dispatch、不在は CATCH→`_X` 既定へフォールバック(=キャラ個別ドロップイン設計)。② 呼出サイト=SOURCE.ERB/SOURCE_SYSTEM.ERB/USERCOM.ERB。ON/OFF=FLAG:11, キャラ別有効=CFLAG:キャラ:5000。③ 不足=キャラ別 @KOJO_MESSAGE_*_{N}/@TRY_{N} と _X 既定が現状ゼロ(TRYCALLFORM が安全に空振り=autotest緑)。別系統: 状況index型 @KOJO_EVENT(n)(合意/JUDGE_PUSHDOWN 用)は _STUBS.ERB の no-op スタブ。CSTR配列(K9咲夜/K10レミリアの高度状態分岐)のみ真に inert=[[N-054]]/[[N-Project001-20260721i]] の『口上未実装』は CSTR に限る補正。**キャラはオリジナル(kami Chara1=神塚みゆき, 東方でない)=Project002 口上コンテンツは流用不可・kami オリジナルを書き起こす**(TASK-710 是正; TASK-709 の『Project002 と整合』は誤り)。追加レシピ: 新ERB(UTF-8 BOM, `Data/ERB/コマンド/口上/`)に `@TRY_{N}`(存在マーカー RETURN)+`@KOJO_MESSAGE_COM_{N}`(PRINTL 口上) を定義するだけで engine が `{NO:TARGET}` で自動 dispatch、FLAG:11=1 で有効化。autotest=CALL+CAPTURE_HTML+ASSERT_HTMLCAP(+ADDCHARA で dispatch 検証)。パイロット `KOJO_1_神塚みゆき.ERB` 実装済(TASK-710, kojo.chara1.renders/dispatch, 700緑, 起動警告0)。実証: TASK-709 調査+TASK-710 パイロット。"
