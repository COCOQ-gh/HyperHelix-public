  - id: N-Project001-20260721s
    text: "Project001 の設計文書(`doc/project-notes/GAME-DESIGN.md`)は**実装に追随しておらず、提案/レビューの一次情報にしてはならない**。実証(TASK-318): §8「拡張設計(採用予定)」と記された4システムのうち**3つが既に実装済み**だった — §8.1伝承=`LORE.ERB`(@LORE_ADD, FLAG:820-861 最大20件)、§8.2素質変容=`TALENT_HENYOU.ERB`(@TALENT_HENYOU_CHECK, 好感度CFLAG:2/ABL/EXP閾値で8種以上の変容, IP_ADD/LORE_ADD連動)、§8.3 IP/実績=`IP.ERB`(FLAG:810累計IP・IPショップ・FLAG:812アンロックbitmask)+`TROPHY.ERB`(約50実績)。未実装は§8.4神格共鳴のみ。同様に提案前提も誤: 巫女差別化は既にCSV(Chara*.csv の TALENT/ABL個体差)+`TRAIN_COMORDER.ERB`の素質分岐(好奇心+7/保守的-13)で実装済、勝敗も `MONEY<MONEY:100`→`BADEND_1` のcrisp gate+20エンド+目標常時表示(@SHOW_GOAL)で概ね実現済。神力(MONEY:2)だけは青天井(器キャップ未実装)、期日は`ENDING_TIMEUP`でFLAG:5==1→5年(難易度はエントリで通常/デバッグのみ=実質固定、旧FLAG:5=2/3/4分岐は死にコード)。∴**ゲーム改善/工数見積もりは必ずコードで現状を裏取りしてから断定する**([[feedback-verify-before-commit]]のドキュメント版)。手法: 並列Exploreで領域分担調査→意外/重要な主張(実装済み判定・勝敗条件)はオーケストレータが該当ERBを直読して確定。CP932はPython cp932で読む([[N-Project001-20260721o]])。"
