  - id: N-092
    text: "既存関数を**流用・配線する前に、その関数の実際の役割とフィルタ/ガード条件を実装で確認**する(名前や見た目で判断しない)。2026-06-26 巫女カードで2度の手戻り: (a)『変更』を `SHOW_CHARADATA_MENU`(=能力表示ビューア・命令[102]の実体)に配線し、設定のつもりが能力閲覧画面に遷移(TASK-359)→setter(独自`SELECT_CARD_MIKO`+`CARD_SET_OR_SWAP`)に是正。(b)その一覧を `CHANGE_TARGET`(筆頭=MASTER以外を全表示)から流用した際、流用元に無い `SIF CFLAG:COUNT:1<1` を足し、CFLAG:1<1 の所持キャラを全除外→空一覧(TASK-361→362)。教訓: ①呼ぶ前に関数の役割(viewer/setter/selector)を実装で確認 ②流用時はフィルタ/ガード条件を流用元と1対1で突き合わせ、変えるのは意図的にのみ ③変数の意味を確認(`CFLAG:1`=カードミコ階層 0/1/2、≧1でカード表示・≧2で助手可、**所持判定ではない**; 所持=非MASTERの全CHARANUM)。対話UIの実挙動は [[N-091]] どおり playtest で確認。**(2026-06-27 再発 TASK-392)** 同じ `SIF CFLAG:COUNT:1<1` が `@SHOW_MIKO_CARDS` の**補充ループ**にも残存し、巫女生活(BEGIN TRAIN)の `VARSET TFLAG,0` でカード永続化(TFLAG:761-763)がクリアされた後、未成長巫女が補充されず空カード化。撤去+回帰 `mikocard.fill_nongrown` 追加で是正。**同種フィルタは複数のカード関数に複製され得る→全カード経路(表示/補充/選択一覧)を1対1で突合せよ**。S2でノート検索を怠り本ノートを見落とした(search-miss)。関連 [[N-090]][[feedback-realtime-rework-fix]]。"
