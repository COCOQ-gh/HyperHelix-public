  - id: N-027
    text: "Python で `open(p,'wb').write(text.encode('cp932'))` は危険: open('wb') がファイルを先に0バイトへ切詰めてから write 引数(.encode())を評価するため、encode 例外(CP932に無い文字 例: em-dash —/U+2014)が起きるとファイルが空になり破壊される。対策: encode を先に実行して bytes を得てから open/write する(`out=text.encode(...); open(p,'wb').write(out)`)。CP932ドキュメント編集では em-dash/波ダッシュ等の非CP932文字も混入回避。破壊時は `git checkout HEAD -- <file>` で復旧。"
