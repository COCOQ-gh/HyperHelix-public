  - id: N-050
    text: "Project001 の能力表示 ABL リスト(SHOW_INFO_ABL/INFO1)は全 ABL を走査せず、PRINT_ABL_COUNT(SHOW_CHARA)という『COUNT 0-N の算術写像ホワイトリスト』+ REPEAT 数で表示対象を決める。写像に無い ABL は値があっても恒久非表示(Project001 では既定で 15 性技/16 奉仕 が 10-14 で写像が止まり抜けていた、70-92 感度/性傾向/SLG も非表示)。ABL を表示追加する時は[PRINT_ABL_COUNT の写像/INFO1 の REPEAT 数/既存 autotest カバレッジテスト]を同時更新する——既存テスト(abl.display_covers_*)は旧仕様(写像/REPEAT)を符号化しており、写像変更で 50/60 が COUNT 22/23 へ動くと REPEAT 22 のテスト側ループが取りこぼし fail する(=テストがバグを符号化していた典型)。SHOW_CHARA の表示順コメントは Project002 由来で陳腐化(実 ABL 名と不一致)につき信用しない。実証: 15/16 を自然順写像に追加(TASK-234)。"
