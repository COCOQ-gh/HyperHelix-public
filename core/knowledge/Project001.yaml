  - id: N-Project001-20260826e
    text: "**TODO・設計文書の記述には「実測した事実」と「未実測の推測」が混在している。区別せずに引用すると、推測が事実として下流へ伝播する。** 実測(2026-08-26): 委託順の計画を立てた際、TODO §1-V㉚ の受入欄にあった『行の高さが増えて総行数が変わっていない(変わるなら §1-V㉘ と衝突するので要調整)』を根拠に、**Wave 2 の順序を『§1-V㉘ で総行数の基準を先に固定してから §1-V㉚』と決めた**。しかし直後に別レーンが実測したところ、**初回表示/タブ選択後とも総行数は 38/38 で不変**(項目増は既存の下限9行パディングが吸収する)であり、**この順序制約は最初から存在しなかった**。元の記述は起票者の推測(『変わるなら』という条件形)だったのに、私は**確定した制約として読んで計画の骨格に据えた**。∴ 誤った順序を根拠つきで文書化し、着手者を誤誘導する一歩手前だった。**対策**: ① 他人(過去の自分を含む)の文書を**計画の根拠**にするときは、その記述が実測か推測かを**書式で判別する**(『はず』『疑わしい』『可能性がある』『変わるなら』= 推測)。推測を根拠にするなら**まず測る**か、計画側に『未実測の前提』と明記する。② 自分が書く側では **実測には日付と根拠コミットを添え、推測には推測と書く**。本プロジェクトの TODO は両者が同じ書式で並ぶので、添えないと区別できない。関連 [[N-Project001-20260825d]](並行レーンの決定は S2 の retrieval に入らない)・[[N-Project001-20260826d]](禁止の射程を疑う)。"
