  - id: N-Project001-20260823a
    text: "**ファイルを編集する前に実測するのは encoding だけではない — 行末(CRLF/LF)も同じくファイルごとに違う**。実測(TASK-Project001-20260823-045): 同じ `Data/ERB/システム/` 配下でも `CHARA_DESC_GEN.ERB` だけが LF で、他は CRLF。encoding を実測する習慣は身についていたのに『encoding を実測する』という個別則として学習していたため、CRLF を決め打ちして LF ファイルへ CRLF を1行混入させた(行数検査が 232→3 と出て即露見)。**一般則は『ファイルごとに違いうる属性は書く前に測る』**で、その属性には encoding / 行末 / BOM の有無 / 末尾改行 / 字下げ(タブ vs スペース)が含まれる。対策=編集スクリプトの冒頭で対象ファイルの属性を実測する関数(`Get-Eol` 等)を通し、書いた後ではなく**書く内容に対して**事前検査する。関連: [[N-Project001-20260722a]](CP932 の編集レシピ)。"
