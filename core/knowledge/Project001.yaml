    text: "Project001でコマンド単位に @COM_ABLE<n> を autotest 隔離検証する際は、本体全文の inline SIF 状態ゲート(例: COM18 `SIF TEQUIP:58==0 RETURN 0`=お風呂場必須、COM43 `BASE:TARGET:潤滑<2000`/`GET_PENIS,PLAYER`=潤滑・主神penis必須)まで読む。CALL する再利用述語(COM_ABLE_*)の抽出だけでは前提状態を見落とし baseline が偽 fail する。状態前提の重いコマンドは isolated 検証に不適=述語テスト(P0)+全件 smoke(CREATE_COMABLE_LIST)で担保し、command-level spot-check は inline ゲート無しの代表に絞る。"
