  - id: N-Project001-20260824b
    text: "**『直近N行を捕る』共有バッファでアサートするテストは、N と1画面の行数の関係を明示していないと前の描画を数えて偽陽性になる。とくに『個数を数える/存在を見る』側が危ない。** 実例(TASK-Project001-20260824-004 / §1-V⑥): Project001 の autotest は `CAPTURE_HTML_RANGE, 120` で `RESULTS:60` に直近120行を積むが、ショップ1画面は約43行しかない。∴ 窓は**常に2〜3画面ぶんを含む**。その上で『交神の儀が未達ならボタンとして出ないこと』を見るはずの `goui.shop.koushin_button_hidden` は `STRCOUNT(RESULTS:60, ...) == 0` ではなく **`== LOCAL:339`(解放時に数えた個数)** と書かれていた — 窓に前の(解放時の)描画が残るので 0 にならず、**辻褄を合わせるために期待値が定数でなくなっていた**。名前と中身が食い違ったまま生き延び、§1-V⑥ で描画を1回増やしたら窓から押し出されて初めて落ちた。**一般形**: (1) 『無いこと』のアサートは窓が広いほど厳しくなるので安全側だが、**『あること・個数』のアサートは窓が広いほど前の状態を拾う**。同じ API でも向きで危険度が逆になる。(2) **期待値が定数でなく別の測定値との比較になっていたら、汚染を吸収するために書かれた疑いを持つ** — テスト名が主張していることを式が言っているか読み直す。(3) 直し方は最小で済む: **描画し直してから1画面より狭い窓(Project001 では 20行)で捕る**。なお同じ理由で『計測はアサートより先に済ませる』も要る(アサートの PRINTFORML が最新行を汚す。[[N-Project001-20260824a]])。 **同時に踏んだ小さな罠**: ①`#FUNCTIONS` の `RETURNF` は**式**しか取れないので、FORM 記法の日本語文字列は一度変数へ代入してから返す(`L_R = %…%` → `RETURNF L_R`)。②既存コードの日本語を移設するときは**読まずに行ごとコピーする**スクリプトを書くと、文字化けも書き間違いも起きない(本タスクは条件文9件をこの方法で無改変に移した)。③その際 Python の `open(newline='\r

      ')` と `'\r

      '.join` を併用すると CR が二重になり、.NET 側で1行ごとに空行が入る。**生成側は `

      ` で書き、変換は1箇所に集約する**。**設計面の収穫**: 『画面外から解放条件を出す』が成立したのは、`@SHOW_SHOP` が `LOCAL:0-9` を `SET_LIST` で LIST へ複製していたから (`GET_LIST(0)`/`GET_LIST(2)` で同じ値が読める)。**関数ローカルに見える値でも、永続配列への複製があれば画面外の再利用口になる** — 切り出す前にその複製を探す。これにより条件文は `@SHOP_CMD_LOCK_REASON` 一箇所になり、[[N-Project001-20260821b]] が勧めていた `<nonbutton title>` ツールチップ方式は §1-V④/⑥ で置き換わった。関連 [[N-Project001-20260824a]] [[N-Project001-20260721n]] [[N-111]]。"
