  - id: N-Project001-20260823c
    text: "**索引(TODO/設計文書)に書いた行番号とコード前提は数日で腐る — 着手時に必ず採り直す**。同日に2例(same-problem-twice): ①§1-V④ の S4(2026-08-22)が記録した `SHOP.ERB` のアンカー(L261/L298/L332-349/L384)が翌日以降のタスク(-038 ほか)で**最大10行ずれ**ていた ②§1-K③(起票 2026-06-28)の『主HUD が過密だから経営詳細を神社運営タブへ移す』という前提が、2026-08-19 の HUD 再設計(裁可 Q1-Q9・§1-V② で実装)により**主HUD に置くのが正**へ反転していたのに更新されていなかった。**根は同じで『索引に書いた事実が実体の変化に追随しない』**。loop.yaml の dispatch freshness gate は同一セッション内の並行計画を守るが、**日をまたいで索引に置いたアンカー/前提は射程外**。対策は『索引にアンカーを書かない』ではない(書くと着手が速い)——**書いたうえで、着手した実装タスクの S4 で必ず採り直す**。採り直しは安く、①アンカーは一意文字列で grep して行番号を取り直す ②前提は『この単位を上書きしうる裁可がその後に無いか』を設計文書の日付順で1回見る、の2手で済む。索引側には**採り直しの起点になる不変の手がかり**(ファイル名・関数名・一意なリテラル)を残し、行番号は補助として書く。関連 [[N-Project001-20260817a]]。"
