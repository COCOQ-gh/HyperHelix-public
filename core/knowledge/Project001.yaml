  - id: N-Project001-20260821a
    text: "ABL(能力)とTALENT(素質)は配列の性質が違い、生成/初期化ロジックを混同すると欠陥になる。TALENTは疎な二値配列(持つ/持たない、未言及=0が正しい設計)——CSVで数個だけ列挙し残りは黙って0のままで問題ない。ABLは全キャラが持つ数値スキル配列(Project001ではAbl.csvに58種定義、ABL_MENU.ERBで0-10のLvスケール表示)であり、値が0でも『その能力の水準を0と決定した』ことを生成ロジックが明示的に扱う必要がある。実例(2026-08-19): RANDCHARA_GEN.ERB(手続き生成巫女、TASK-Project001-20260818-012で出荷済み)がABL:40とABL:13/41の**2つだけ**にRAND:3を代入し残り56種を一切参照しなかった——TALENT的な『1-2個選んで残りは触れない』パターンをABLへ誤って適用していた。この誤りは事前の設計文書(design-random-chara-gen.md §5.4)に『能力ABLは0〜2を1〜2種のみ=初期巫女は伸びしろを残す』と明記され、裁可済み文書として無検証で引用されたまま実装に反映されていた(TASK-Project001-20260819-017が同じ誤りを『意図的仕様』と断定して踏襲し、ユーザー指摘で発覚)。教訓: (1) 数値配列/二値配列が混在する設計文書は、裁可済みでも記述の妥当性を実コード(配列定義・既存生成ロジック)で裏取りしてから引用する。(2) 新規キャラ/エンティティ生成ロジックを書く/監査するときは、対象の各パラメータが『疎で正しい(TALENT型)』か『密で全設定が要る(ABL型)』かを先に分類する。(3) 修整方針=全indexを走査し型別レンジ表に従って明示的に代入するループ構造にする(既存の『特別扱いする2箇所』はそのまま高めに振る枠として残してよい)。"
    tags: [Project001, character-generation, abl, talent, data-model, sparse-vs-dense, design-review, self-rework, hh-043, randchara]
    project: Project001
    strength: 2
    last_used: 896
