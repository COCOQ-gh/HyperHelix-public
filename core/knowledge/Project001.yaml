    text: "Project001 起動時(load)警告は0件を維持する(コミット前ゲート)。ERB の追加/編集後、特に GOTO/JUMP・ラベル・新規@関数を触ったら起動時警告を必ず捕捉して確認・解消する。通常の autotest は Project003.log がプレイ末尾のみで起動警告を surface しないため見逃す。**捕捉は 1コマンド: `tools/Project003-autotest/Invoke-Project001BootWarnings.ps1`**(TASK-20260702-002 で手動手順を自動化: Prepare -SkipAutotest→最小スタブ @SYSTEM_TITLE/OUTPUTLOG/QUIT 注入→Hidden 起動→警告/エラー行を件数のみ報告・警告>0 で exit 1。行本文は .autotest/Project001-title/boot-warnings.txt へ=AP-010 安全。負性テスト=重複@関数で検出能力を実証済)。検出例(TASK-704): 『警告Lv2:...指定されたラベル名は現在の関数内に存在しません』=未解決 GOTO(ラベルとバイト一致でも Project003 が load 時に解決できない場合あり)→ `GOTO` を `RESTART` 等へ置換して除去。修正→再実行 0件でコミット。関連 [[N-034]] [[N-037]]。"
