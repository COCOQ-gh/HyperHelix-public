  - id: N-102
    text: "Project001 非訓練フロー(巫女生活・交神以外=イベント/SLG/ED)のキャラ別口上化。**全詳細(手順/状況ID台帳/進捗/render検証)=`doc/project-notes/kojo-extraction-procedure.md`(§0.5 ModeA/B・§1 ModeA verbatim・§1B ModeB SELF_KOJO状況ID・§5 状況ID台帳・§6 worklist・§7 注入render検証)**。要点: engine=`Data/ERB/コマンド/TEXT_KOJO.ERB`(移植済/配線済)、`@SELF_KOJO`=状況ID dispatcher(TARGET=話者/TFLAG:250=ID→`@SELF_KOJO_X` SELECTCASE)。大半は ModeB(開発者既定 `;CALL SELF_KOJO,話者,ID` を有効化、台詞は `口上まとめ.ERB` へ verbatim/置換移設し SHA立証)。置換型=値渡し(ARG:2→TFLAG:99)・話者置換(ARG→TARGET)。@TRY_{NO}持ちキャラは _X に落ちない→`@SELF_KOJO_K{NO}=TFLAG:223=1` forwarder。検証=compile緑+verbatim SHA+起動警告0+**注入render(`WAITING_ONEKEY ENTER`×CASE内PRINTFORMW数+`EXPECT_TEXT`, Invoke-Project001Interactive)**=実表示も機械照合(playtest委譲を解消, 出典 Project003LabH TASK-213)。実装済=32 CASE(70-74/81-84/120-121/173/101/102/131/109/140/133/30/122/123/50/51)。**verbatim 抽出フェーズ完了(TASK-20260701-008/procedure §6-E): 残62 の大半は空プレースホルダ=要オリジナル台詞 authoring(創作/設計・ユーザー方針待ち)＋非抽出複雑(69)。engine/配線/render 基盤は完備=台詞を書けば即動く**。実証: TASK-709〜725 / 20260701-001〜008。関連 [[N-101]] [[N-046]]。"
