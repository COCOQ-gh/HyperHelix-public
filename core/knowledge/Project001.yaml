  - id: N-Project001-20260821e
    text: "手書きテーブル(SELECTCASE/IF連鎖)で個別対応しているものに『それ以外』の受け皿を足すときは、対象リストを呼出側へ複製せず**既存連鎖の末尾に ELSEIF を1本**足す。実例(2026-08-21): @CHARA_PROFILE(SHOP_CHARALIST.ERB:65-410)は TFLAG:201=Chara番号 の IF 連鎖で 0-32/100-104/148/149 に手書き解説を持ち ELSE が無いため、手続き生成巫女(NO:250)は番号行だけで説明が空だった。呼出側に『どの番号が手書きを持つか』を書くと二重管理(AP-003 declare-consume)になるので、連鎖末尾に ELSEIF を1本 + 呼出側は index を渡すだけ、にした(既存340行は無変更)。なお TFLAG:201 は **番号** であり index ではない — 生成キャラは全員同じ番号なので個体を特定できず、index を運ぶチャネル(未使用の TFLAG:210 を実測で確保し index+1・0=実体なし)が別途要る点が S4 の肝。もう一点: 生成する文の語彙は名前 CSV(TALENTNAME/ABLNAME)から引き、生成器側に素質名・能力名の文字列を焼き付けない。Talent.csv/Abl.csv が単一の権威になり、出力を完全一致で固定した autotest が名前の乖離検知も兼ねる。文の組み立てを全て #FUNCTIONS 純関数にすれば、乱数を含む fixture(RANDCHARA_MATERIALIZE)の上でも出力文字列を完全一致で assert できる。関連 [[N-Project001-20260821d]] [[N-093]]。"
