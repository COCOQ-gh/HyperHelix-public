  - id: N-086
    text: "Project001 の **スカラー CHARADATA 配列**(1キャラ1値だが内部は配列, 例 WOMB/ANUS/STOMACH_TOTAL_CREAMPIED_AMOUNT, VARIABLE.ERH宣言)は `VAR:(char):0` と**要素index `:0` を明示**してアクセスする。`VAR:(char)` だけだと Project003 が char を要素indexと解釈し既定キャラ(-1等)を char とみなして『第2引数…はキャラ登録番号の範囲外』runtime error になる(中出し量>0 等、実行時にのみ発火する潜在バグ; TASK-345 で @RECORD_CREAMPIE 3箇所を修正)。参照は既存の動作箇所のパターン(例 SEXUAL_PREFERENCE:(char):0)に合わせる。boot smoke では未発火(該当行が条件分岐内)なので、CHARADATA書込を足したら必ず非ゼロ経路の autotest を書く。"
