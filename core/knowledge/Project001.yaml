  - id: N-Project001-20260721t
    text: "Project001 の巫女生活コマンドの解禁(表示可否)は **Project002由来の `COM_ABLE` 基盤**で制御する(新規UI不要)。機構: (1) **Train番号≥300=巫女生活コマンド / <300=交神の儀**(`COMABLE_COMMON.ERB:16-24`、`FLAG:2`が交神中フラグ)。(2) `Data/CSV/Train.csv`(`番号,名称`)に登録すると `CREATE_COMABLE_LIST`(`USERCOM_DISPATCH.ERB`)が全TRAINNAMEを走査し各 `@COM_ABLE{N}` を評価→`COM_ABLE_FLAG:(N)=1` でメニュー自動表示。(3) **解禁条件は各 `@COM_ABLE{N}` に1行足すだけ**: `CALL COM_ABLE_COMMON,N` / `SIF !RESULT RETURN 0` の後に `SIF <条件> RETURN 0`。施設レベルでゲートするなら施設変数(鳥居`FLAG:79`/授与所`80`/社務所`81`/拝殿`82`/本殿`83`、各Lv0-5、`SHRINE_MANAGE.ERB`で神位+信仰点+資金を払い`FLAG:8x+=1`)を見る。空きTrain番号: 318-324,335+。この基盤自体がProject002移植済み(PORTING-Project002.md:67,95)なので、Project002の日常/デート系コマンド(../Project002 の 会話/食事/料理/買い物/縁日デート/子供と遊ぶ等)を番号≥300で移植すれば巫女生活に追加できる([[N-008]]の移植パターン+ラベル参照のまま)。交神開放=本殿`FLAG:83`≥1+神霊具現`TALENT:MASTER:201`+信仰心`ABL:40`≥2(`SHOP.ERB:305`)も同型のゲート。資料: `doc/project-notes/design-humanform-command-unlock.md`。"
