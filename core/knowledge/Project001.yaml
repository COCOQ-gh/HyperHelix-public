  - id: N-Project001-20260823b
    text: "**「エンジンにその機能があるか」は、自プロジェクトの使用実績ではなくエンジンの命令表から引く — そして表に載っていることを証拠にせず実呼び出しで確かめる**。実例(TASK-Project001-20260823-047 / §1-W① キャラ import-export): 先行 S4 は『本プロジェクトの ERB は保存系命令を一度も使っていない(使用実績0件)』まで正しく測ったうえで、搬送媒体の候補を SAVEGLOBAL / SAVETEXT / OUTPUTLOG の3つに絞り『23,000要素をどう疎エンコードするか』という大きな設計課題を立てていた。実際には **SAVECHARA / LOADCHARA というキャラ1体専用のシリアライズ命令**があり、実測で別プロセス起動を跨いだ 11項目の往復に成功(出力は dat/chara_<名前>.dat・1体≒1.4KB のバイナリ・magic \\x89ERA・セーブ枠の外なのでコピーで別インストールへも渡せる)。**設計課題そのものが消えた**。∴ 新機能の S4 では『自分が何を使っているか』の走査で止めず、**エンジンの命令表を目的語(chara/save/file)で一度 grep する**工程を必ず挟む。ただし表は証拠にならない — doc/Project003-v2-portable/data/Project003-builtins.json は別ビルド(Project003LabH)由来で、実際 SAVECHARA は載っていたが**第1引数の型が違って初回は実行時エラー**だった(正: SAVECHARA <ファイル名:文字列>, <コメント:文字列>, <キャラ登録番号...> / LOADCHARA <ファイル名> は ADDCHARA 相当で追加 / CHKCHARADATA(名前) は 0=あり・1=なし)。実測レシピ: Prepare-Project001Autotest -SkipAutotest でサンドボックスを作り @SYSTEM_TITLE スタブを CP932 で注入して**1段階=1起動**(未実装や型不一致はロード時でなく実行時に落ちるため、1本に詰めると最初の失敗で以降が測れない)。**付随の落とし穴**: Project003 は `QUIT` を書いてもプロセスが残ることがある(実測)ので、ad-hoc ランチャは成功パスでも無条件に Stop-Process する — 『END マーカーを見たら break』だけで抜けたら 11本のプロセスが残ってサンドボックス削除がロックされた。既存の Invoke-Project001BootWarnings.ps1 は無条件停止で正しく、写さず自作したのが原因。関連 [[N-034]] [[N-104]] [[N-Project001-20260817b]]。"
