  - id: N-069
    text: "Project003 の ERB サブフォルダ再編の定石: ①ローダー仕様は Config.getFiles(ルート直下→サブフォルダ名順・再帰。SortWithFilename は Array.Sort=カルチャ依存なのでフォルダ名は ASCII 数字接頭辞で順序固定) ②Project003.config の『サブディレクトリを検索する』『読み込み順をファイル名順にソートする』を YES 化 ③無印イベント関数(#PRI/#LATER なし)の全数棚卸しで順序依存を確認(相互排他ガードなら制約なし) ④検証は隔離コピーで TITLE.ERB を無効化し AUTOTEST.ERB(@SYSTEM_TITLE)から各フォルダ代表関数を TRYCCALL/CATCH で存在確認(probe は WAIT/INPUT 非含有の小関数を機械選定)。Project007 271ファイルで pass=9 fail=0 実証。"
