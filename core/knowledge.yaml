  - id: N-071
    text: "ツール拡張(既存コマンドへの警告追加・validate check 追加等)は amendment 級ではない — routing の capability-addition。実装コメントに未裁可の HH 番号を発明して付けない(amendment は phase構造/gate規則/θ/憲法/ノート昇華/大規模統廃合のみ)。/cycle の発見は机上でなく直近の実使用(dogfood)で遭遇した摩擦から採ると質が高い(finish の Distill 資材ステージ漏れは実 orphan commit から発見)。"
