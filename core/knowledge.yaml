    text: "Project001 のキャラ項目(能力ABL/素質TALENT/経験EXP/基礎BASE)は定義CSV(CP932)に index 追記で増やせる。配列余裕: VariableSize ABL=1000(max92)/TALENT=1000(max400)/BASE=100(max11) は余裕、EXP=100(max99)は満杯=拡張要(EXP,100→200)。新ラベルは既存 index を変えないため**追加自体は回帰なし**(autotest緑のまま)。ただし能力表示は各ループが境界付きで、追加項目は**表示に出ない(inert)**: NEW_PRINT_ABL_FULL=FOR 0..92, 参考値 70..92 / SHOW_INFO_ABL は PRINT_ABL_COUNT の22枠ホワイトリスト / SHOW_INFO_TALENT=REPEAT 270 / SHOW_INFO_EXP=固定セット / SHOW_BODY_K=BASE 6-10。表示するには各ループ/ホワイトリストの範囲拡張が必要。CSTR(口上)はカテゴリごと kami 未実装で消費エンジン無=データ追加しても inert。実証: K-only 108項目を Chara201 へ全移植(TASK-255)、起動/551アサート緑・0警告だが新項目は能力表示に非表示。"
