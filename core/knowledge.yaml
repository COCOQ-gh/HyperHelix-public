    text: "Before a change that REVERSES a prior reasoned decision, check the design doc / amendments for a settled ruling first. A cross-session review (e.g. another branch's task) re-added brief anchors that the doc explicitly excluded with reasons (HH:COMMIT circularity, FRAMEWORK_REVIEW bloat) — it 'aligned to the design' but missed that the design had already settled the opposite. A second pair of eyes catches real bugs but can also undo deliberate decisions; reconcile against the written ruling, not the older intent."
