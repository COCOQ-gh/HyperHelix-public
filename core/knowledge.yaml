  - id: N-049
    text: "Project001 はキャラ番号が疎(実在 Chara CSV=0-32,100-104,148-151;33-99 等は欠番)。Project003 の CSVNAME(n,x) は未定義テンプレートで **エラー『定義していないキャラクタを参照しようとしました』**(空文字を返さない)→ STRLENS(CSVNAME(..)) ガード不可。CSVEXIST は本 Project003 で **未対応**(『解釈できない識別子』)、Project003.config が SPキャラ:NO のため CSVTALENT 第3引数(SPキャラ)も使用不可。さらにアイテム ID と『キャラ購入アイテム ID=100+キャラ番号』が一部重複(例: item264 ピアス=100+164)。よって ITEMPRICE:(100+n)>0 を『キャラ存在』の代理にした 0-199 走査は非キャラ(ピアス)を誤検出し CSVNAME で落ちる。対策: GETCHARA(n)>=0(在籍=テンプレート確実)でガード(SHOP_CHARABUY:120 既存イディオム)。相性(RELATION)は在籍キャラ間でのみ発生するため表示は保全。実証: 能力表示 PAGE_2→PRINT_RELATION→SET_CALLNAME のクラッシュを修正(TASK-233)。移植元 Project002 はキャラ連番密で顕在化しなかった前提崩れ。"
