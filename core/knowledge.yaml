  - id: N-Project001-20260811a
    text: "Claude Code の PowerShell ツールは長い複数行インラインスクリプト(数KB・here-string/日本語混在)で `EPERM uv_spawn pwsh.exe` を出して spawn 自体に失敗することがある(短いコマンドは同時点でも成功)。回避: スクリプトを scratchpad の .ps1 ファイルに書き出して `& script.ps1` で実行する。.ps1 は UTF-8 BOM 必須(AGENTS 規約)— Write ツールは BOM なしで書くので、実行前に先頭3バイト EF BB BF を確認し無ければ付与する。CP932 ERB のブラインド一括編集(anchor-assert→Replace→byte/FFFD検証)は長スクリプト化しやすく、この経路が常用になる。"
    tags: [powershell, eperm, uv-spawn, long-command, ps1-file, scratchpad, utf8-bom, tooling, claude-code]
