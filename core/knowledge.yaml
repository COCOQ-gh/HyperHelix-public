  - id: N-Project005-20260901w
    text: "自作/ローカル HTTP サーバの path traversal 受入検証は curl `--path-as-is` で行う — 既定の curl はクライアント側で `../` を正規化して送るため、脆弱な実装でも 404 が返り『拒否された』と誤判定する(TASK-20260813-001 で誤 Pass しかけた)。検証は3系: 生 `../` / `%2e%2e` エンコード / 絶対パス(Windows はドライブレター形も)。実装側の定石: decodeURIComponent 後に path.resolve → path.relative(root, target) の `..` prefix 検査 + null byte・絶対パス拒否(resolveSafe を純関数化してユニットテスト)。"
