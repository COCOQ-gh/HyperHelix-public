  - id: N-063
    text: "transcript の .jsonl は追記専用ログで /compact しても縮まない。だから transcript ファイルサイズを context 占有率の代理にすると初回充填にしか正しく効かず、圧縮後も高いまま = 警告が嘘をつく(圧縮したのに未圧縮に見える)。是正: PostCompact フックで圧縮時点サイズを baseline 記録し、context-warn は『現在サイズ − baseline』= 圧縮後の増分で測る(delta-baseline)。単調増加ログをレベル指標に使うときは基準点を圧縮境界でリセットせよ。"
