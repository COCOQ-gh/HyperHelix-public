    text: "テスト用隔離サンドボックス準備で大物の全コピーを避ける。同一ボリュームなら巨大単一ファイル(exe等)はハードリンク(New-Item -ItemType HardLink、失敗時Copy-Itemフォールバック)、多数ファイルのツリーは robocopy /MIR 差分ミラー(初回全コピー・再実行は変更分のみ、終了コード<8が成功)。隔離・再現性・読み取り専用は維持される。注意: /MIRはdestの余剰を purge するため、テスト専用注入ファイル(AUTOTEST.ERB等)はミラー後に注入する。実測: Project001 autotest で 1ラン23.3MB中88%がexe→ハードリンク化で実コピー2.9MB、再実行4.0s。"
