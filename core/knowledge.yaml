  - id: N-hyperhelix-20260831a
    text: "CLI の list 値フラグを `args.indexOf(flag)` で解決すると、**繰り返し指定の2つ目以降が無言で捨てられる**(/cycle 2026-08-31 実測: `bump --use A --use B` が B を落とし、気づけたのは事後の validate NOTE_ATTRIBUTION warning だけだった)。単発読みは list 値フラグでは欠陥、単一値フラグ(cliFlagValue/strArg/num)では正しい — **フラグの arity で使い分ける**。修正時の教訓が2つ: ①**関数名ではなくパターンで grep する** — `listArg` を追うと inline 実装の `noteLedgerFilesForBump` と転送用 `sliceFlag` を取り逃がす。`indexOf(flag)` で打てば全 hit が出る。②**producer だけ直すと declare↔consume がズレる**(AP-003 型): listArg だけ反復対応にすると『note は両方適用されるがロックする ledger file と finish→bump 転送は1つ目だけ』になる。R1 掃引の (a3)『新機構は同一変更で全 consumer を配線』はこの形を指す。陽性 fixture は『2つ目の出現が効いたこと』を主張する(test/repeated-list-flag.test.mjs RT-21/22)。③`/` 始まり引数の MSYS パス変換も同経路で実測(2026-08-31、stdout エコーのみで台帳無傷)— 詳細と対策は AP-024 が正典。"
    tags: [framework, tooling, cli, argument-parsing, declare-consume, ap-003, listarg, grep-strategy, positive-fixture, scope:framework, project:hyperhelix]
    project: hyperhelix
    strength: 1
