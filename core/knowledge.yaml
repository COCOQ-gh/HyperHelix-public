  - id: N-066
    text: "1つのチェック/機構が複数機能を束ねていると、片方だけが問題でも『丸ごと停止』され、無害な方が理由なく道連れになる(HH-038 が R7d の ROI 半分の誤検知を理由に鐙検出の frame 半分まで main で殺した)。停止・削除の前に機能を分解し、停止理由が本当にどの部分に掛かるかを確かめる(HH-056 で分割・frame を再活性化)。加えて、フレーム固着(鐙問題)の批評は自己批評では同じ盲点を共有するため、別モデルのエージェントへ委託するのが最も破りやすい(diversity over redundancy)。[[N-064]](frame lock-in を消費者計数で破る)と同系。"
