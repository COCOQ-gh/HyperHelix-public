  - id: N-067
    text: "検出器の基準点/閾値ロジックを修正したとき、修正は『次のイベントから有効』になりがちで、既存セッション(旧ロジックの汚染状態: 偽警告が消費した cooldown・未記録の baseline)は自己回復しない(移行ギャップ)。delta-baseline 修正後も当該セッションは baseline 無し+cooldown 消費済みで警告が完全沈黙した。設計原則: (1) 汚染状態を検出したら無音で基準点を再設定する lazy 回復パスを検出器自身に持たせる(baseline 無し+cooldown 無し+異常値→rebase)。(2) 一回きりの通知は無視シナリオで死ぬ — 増分ステップごとの再通知にする。[[N-063]](基準点は圧縮境界でリセット)の続編。"
