  - id: N-056
    text: "客観ソースの無い per-entity データ(例: Project001 体型素質=既存キャラが体型ヒント素質を皆無)は『安定キー(NO/番号)由来の決定的割当 + 非破壊(値0=未設定のときだけ書込, CSV値優先) + 素数係数で隣接キーの分散確保』で自動差別化できる。注意: 単純な NO/divisor (例 (NO/5)%7) だと低番号がクラスタ(主要キャラが偏る)→ ((NO*3)%7) 等の乗算modで隣接を散らす。populate と派生計算は ENSURE_*(ガード付き冪等: 算出済なら即RETURN)に統合し、初期化(CHARA_INIT)と表示(SHOW_*)の両経路から呼ぶと取りこぼさない。実証: TASK-260 で 44キャラに体格/体型/バスト/ヒップサイズを番号割当しスリーサイズ差別化(569緑)。"
