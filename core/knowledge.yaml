  - id: N-057
    text: "Project003: 単一英字ローカル名(h/v/s/N/I 等多数)は予約変数名と衝突し #DIM が無効化→そのグローバル変数を破壊する。ローカルは日本語名(算出値/種 等)か L_ 接頭辞で。**重大**: この種は autotest を偽通過する — (1)autotest config は @SYSTEM_TITLE 注入のため『システム関数の上書き:YES』で実 config(NO)と乖離、(2)autotest は ERB の load 警告(警告Lv2)を fail にしない、(3)autotest は CHARA_INIT 等の実起動経路を経由しない。結果、予約変数の global 破壊が起動経路(CHARA_INIT→ENSURE→SET_BODYSIZE 等)でのみ顕在化し『起動時エラー落ち』になるのに 569緑。対策: Run-Project001Autotest に reserved-name 警告ガード追加(『Project003の変数名として』を検出→classification=reserved-var, HH-028陽性テスト済)。load系/起動系の疑いは『実 config を逐語コピー(バイナリ型セーブ:YES 保持)+上書きだけYES+@SYSTEM_TITLEで LOAD_OK_MARKER 到達』を確認する実 config ブートで切り分ける。"
