  - id: N-073
    text: "計測/記帳ツールの副作用(convergence baseline の書込等)は、それを消費する手順(/cycle)専用のフラグ配下へ置き既定を読み取り専用にする。実害: cost-report が baseline を every run で無条件 write していたため、別タスクの Search 中の探索実行が 452→455 を消費し、無関係コミットへ混入 → 次 /cycle が真の +3 を『±0』と読んだ(『growing = finding』シグナルの喪失)。**本質はフラグの有無ではなく宣言と実装の食い違い** — コメントは『written by cost-report each /cycle run』と宣言しながら実装は every run だった(AP-003 の宣言↔実装版)。**既定を反転するだけでは不十分**: 『無音で書く』を『無音で捨てる』に置換すると罠が裏返るだけなので、書かなかった時は『baseline N は未更新』と明示表示する。検証は HH-028 に従い陽性/陰性の両方向(baseline を意図的にずらして SHA256 で不変/変化を実証)— 片方向だけでは『そもそも書けない実装』と区別できない。[[N-064]](手書きカウンタはキャッシュ)と同系。"
    tags: [tooling, side-effect, baseline, convergence, cost-report, consolidation-report, cycle, declare-consume, silent-failure, ap-003, ap-010, framework]
