    text: "『UI変更が反映されない』報告は、同一機能の入口経路を全 grep して真因を特定する。Project001 の能力表示は2経路: (A) ステータスメニュー SHOP→SHOW_CHARADATA_MENU→SHOW_CHARADATA_PAGE(+SHOP_SEARCHCHARA) は TASK-235 で新8タブUI に差替済、(B) 調教画面 PRINT_TRAIN→SHOW_INFO_PAGE_1→SHOW_INFO_ABL は旧共有レンダラのまま。最頻は (B)。新UIだけ作っても (B) には波及しないので『反映されない』。共有レンダラ(SHOW_INFO_ABL)を直すと両経路に効く=波及効率が高い。また SHOW_INFO_ABL は ABL>0 でレベル0能力を隠していた→全mapped能力を常時表示に(性技/奉仕が値0でも見える)。"
