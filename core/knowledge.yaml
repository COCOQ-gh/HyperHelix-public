  - id: N-Project005-20260901q
    text: "offset/limit ページングの定型: **窓の幅(limit)で offset を進め**、終端判定は『空ページ』または `offset >= total` に限る。返却件数(pageSize)で進めたり `pageSize < limit` を終端とみなすと、欠番(削除・退会・非公開化された要素がサーバ側で除かれるが total には残る)を含むページで**以降が丸ごと取得漏れ**になる(TASK-20260813-013: Project005 フォロー一覧が途中で打ち切られ全件取り込めなかった)。仕様が不明でも窓ベースなら安全側。total 破損に備え最大ページ数ガードも置く。委任 WO には『短いページの扱い』を明示すること — 書かないと executor は『短い=終端』と推測実装する([[N-Project005-20260901f]] 空データで応答形を推測しない、と同型の誤り)。"
