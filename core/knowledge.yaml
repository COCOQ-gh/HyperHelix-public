  - id: N-Project009-20260918a
    text: "テンプレートやスキルに同梱する『完全な作例』は、検証スクリプトの回帰テスト fixture と兼用する。作例を読むだけの資料にすると仕様変更のたびに静かにドリフトし、誤った手本を配り続ける。実例(TASK-Project009-20260918-001): validate の対象ディレクトリを環境変数(Project009_CHARACTERS_DIR)で差し替え可能にし、(1) 作例そのものが 0 error / 0 warning であること (2) 作例を一時ディレクトリへ複製して 1 箇所ずつ壊し、各違反が検出されること、の両方をテストにした。陰性ケースを作例の変異で作ると fixture を別に持たずに済み、作例と検証器が同じ契約を見続ける。routing.yaml の『テンプレートには完全な非自明例を最低 1 つ』の実装形。"
