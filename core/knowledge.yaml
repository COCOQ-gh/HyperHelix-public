  - id: N-main-20260728a
    text: "Git Bash(MSYS)は先頭 `/` の CLI 引数を Windows パスへ自動変換する — `bump --review-source /cycle` が `C:/Program Files/Git/cycle` として記録され provenance を汚染した(TASK-main-20260728-002 で是正)。hyperhelix.mjs を Git Bash から呼ぶとき、値が `/` で始まる引数(--review-source /cycle 等)には `MSYS_NO_PATHCONV=1` を付けるか PowerShell から呼ぶ。**ただし `finish` は PowerShell から呼べない**(L3 が pre-push 構文テストで `sh -n` を spawn し、PowerShell セッションでは sh が PATH 未解決 → ENOENT で verify FAIL・fail-closed 中断。実測 2026-08-24)— finish は Git Bash + `MSYS_NO_PATHCONV=1` を使う。PowerShell 可なのは bump 単体等 sh 非依存のサブコマンドのみ。ツール出力・record への書込値は書いた直後に目視確認する(検出は grep 'Program Files' で可能)。"
