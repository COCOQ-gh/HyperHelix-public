  - id: N-Project005-20260901r
    text: "background 委任(Codex 等)にウォッチドッグ予算を『記録』しても、**期限に実際チェックする行動が無ければ無意味**(TASK-20260813-012: 10分予算の WO が31分・成果物0件で放置され、ユーザーの『動いてるか確認して』で初めて発覚)。実務的な検知手順: ①ログの**最終更新時刻**と現在時刻の差 ②`git status` で期待成果物ファイルの有無 ③ログ内の再接続/エラー行の数。この3点で『生きているが進んでいない』を判別できる(プロセス生存だけでは不十分)。予算超過かつ成果物ゼロなら §9c: 停止 → 同一 WO 再発行1回 → EX-1 で直接実装。純ロジック中心のタスクは直接実装が確実に速いことも多い。関連: [[N-Project005-20260901t]] 訂正継続 WO。"
