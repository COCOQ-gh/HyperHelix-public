  - id: N-075
    text: "同一ワーキングツリーの並行作業で git のマージ層は守ってくれない — 解決はコミット後にしか効かず、コミット前に3つの衝突面が残る: (1) 同時 Edit の lost update (2) 共有 index を bare `git commit` が丸ごと拾い他セッションの staged を巻き込む (3) 変更対象の重複を検出する機構が無い。対策(HH-058): (2) は pathspec commit(`git commit -m .. -- <paths>`)で完治、(3) は P6 change-list の素集合判定(既存成果物が並行安全性の判定入力になる)、(1) は共有台帳の D7→commit critical section 化。完全並行が要るなら git worktree(ネイティブの鐙)で構造ごと消す — 自作ロック registry は作らない。"
