  - id: N-Project001-20260821c
    text: "長い編集スクリプトを bash の quoted heredoc 経由でファイルへ書き込む経路は本環境(Windows/Git Bash)で非決定的に壊れる。実測2件: JS 正規表現中のバックスラッシュが欠落して SyntaxError(/\\\\/g が /\\/g になる) / 100行超のスクリプトで shell が unexpected EOF while looking for matching quote。共通根本=長文を shell の引用越しに渡すこと。恒久対策=**長い(目安 30 行超、または正規表現・バックスラッシュを含む)スクリプトは Write ツールでファイル化してから Bash で実行する**。短い一行 sed/grep は従来どおり Bash 直書きでよい。失敗しても書込自体が起きないため被害は再実行のみだが、YAML/コードを直接 heredoc で書くと壊れた内容が着地しうるので、書込後は必ず検証コマンド(validate/実測)を同一ターンで回す。"
