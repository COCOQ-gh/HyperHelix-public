  - id: N-040
    text: "encoding鋭敏ファイル(UTF-8 BOMのAUTOTEST.ERB / CP932のERB・CSV)へPowerShellで行挿入する時は .NET String.Split([string[]]@(\"\\r\\n\"),None) で分割する。-split \"\\r\\n\", -1 は第2引数が配列束縛され分割失敗→全文が1行に潰れ破損する。UTF8Encoding.GetBytes() はBOMを出力しないのでEF BB BFを明示付与する。編集後は byte数・BOM・FFFD=0・git diff --stat の加算性を必ず確認。新規ERBは可能ならASCII限定にしてencoding問題を回避(N-308併用)。"
    tags: [powershell, encoding, cp932, utf8-bom, file-edit, autotest]
    project: Project001
