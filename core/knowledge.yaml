  - id: N-084
    text: "監視・検知器の初回実地適用は『較正イベント』として扱い、偽シグナルを前提に人手プローブ(プロセス生存・出力実体の確認)を併走させる — wo-watch 初回で2つの偽シグナル源が同日に出た: (1) **prompt echo**: codex exec は WO プロンプト本文を出力へ echo するため、非アンカーの完了マーカーが WO 指示文中の文字列に 0 秒でマッチ(偽 DONE)→ マーカーは行頭アンカー化 + 指示文ではマーカーを行頭に書かない。(2) **block buffering**: ファイルリダイレクト時の stdout は約 8KB 単位で flush され、生存・作業中でも数分無出力に見える(偽 STALL)→ ファイル成長だけを liveness にしない(--pid のプロセス生存を副信号に。Git Bash は /proc/$!/winpid の Windows pid を渡す)。机上テスト(自作の整形済み入力)はこの2つを構造的に見逃す — 実戦入力(echo・バッファ・エンコーディング)での較正が別途要る。 encoding を誤った grep と同族。"
    tags: [detector, calibration, wo-watch, false-positive, prompt-echo, block-buffering, liveness, pid, delegation, HH-063, framework]
    project: hyperhelix
    strength: 1
    last_used: 533
    state: active

