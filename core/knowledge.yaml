  - id: N-Project005-20260901u
    text: "MV3 拡張の長時間逐次処理(レート制御付きスキャン等)は background SW でなく**拡張ページ(タブ)で直接実行**する — host_permissions があれば拡張ページも SW と同じ特権 fetch が可能で、SW の30秒 idle 停止と無縁・進捗 UI が自然に置ける・タブを閉じれば止まる(暴走安全)。中断/再開は storage にカーソル(残りID配列)を10件ごと等で永続化。保存時は最新 state を再取得して1件だけマージ(並行書込破壊の回避)。実例: Project005 ユーザー全作品スキャン(TASK-20260813-005)。関連: [[N-Project005-20260901c]] SW の制約, 旧Project005台帳#073(未移設) 純ロジック分離。"
