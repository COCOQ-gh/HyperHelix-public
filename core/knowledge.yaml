    text: "拡張の action popup 内でリンク/候補を『フォアグラウンドの新規タブ』で開くと popup がフォーカスを失って閉じ、一覧が消える(Project005 拡張『傾向に合う新作を探す』で1件開くと候補一覧ごと消えて次を見られない苦情)。一括で見せたい時は browser.tabs.create({url, active:false}) で**バックグラウンドタブ**として開くと popup は開いたまま。tabs.create は URL 指定のみなら 'tabs' 権限不要。UI は候補スクロール領域の外(別コンテナ)にボタンを置き常時可視化し、再描画のたびクリアして stale を防ぐ。大量(>N)タブは confirm を挟む。"
