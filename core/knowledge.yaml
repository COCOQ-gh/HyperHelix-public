  - id: N-038
    text: "多部にわたるユーザー指示(『効率順に〜まで実装』等)は1タスクに束ね、スコープを完了させてからコミットする(repo毎に1コミット)。指示を小タスクに刻んで各々逐次 micro-commit すると履歴が細切れになりレビュー困難。複数の実装単位は1タスクの TL として扱い、外側repoとネストrepoで各1コミットに集約する。例外: 真に独立した別タスクは別コミットで可(細切れとは別物)。"
    tags: [git, commit-granularity, workflow, task-scoping]
    project: shared
    strength: 1
    last_used: 404
    state: active

  - id: N-039
    text: "ツール呼び出しは常に正規の function-call 書式のみで出力する。呼び出し直前に余計なトークン(例: 'count')を置かない/素の <invoke>・<parameter> タグを単独で出さない。書式崩れは致命的=未パースで未実行→ターンがサイレント終了し作業停止・直前編集が未コミットで放置・状態不整合になる(AP-007, 人間ゲート HH-029)。『malformed』を受けたら即座に正規書式で再送し、実行成立を確認してから次へ進む。"
    tags: [tool-call, execution, fatal, serialization, discipline]
    project: shared
    strength: 2
    last_used: 406
    state: active

  - id: N-041
    text: "Framework AP-003 (a declaration shipped without its consumer — a dead gate param, a brief/template field nothing fills, a dangling destination like 'project TODO', a declared-but-unconsumed action like prune) is the MOST-recurring framework miss; omissions (a rule not covering all states, e.g. S2 retrieval ignoring archived) are its cousin. Routine catches: framework-review R1 declare↔consume + omission sweep (manual) and validate GATE_DEAD_CONFIG (gate params unreferenced in core/assets/tools). Semantic/omission cases that resist a mechanical check need a periodic Codex adversarial audit (process-backlog standing practice). Always wire declaration + consumer in the SAME change."
    tags: [framework, ap-003, declare-consume, detection, validator]
    project: shared
    strength: 8
    last_used: 518
    state: active

  - id: N-042
    text: "After a long run of framework-only self-improvement (audit -> fix -> add detector -> audit again), R7d/R7e flag a SELF-REFERENTIAL cadence: validate is green and mechanical checks pass, but external ROI is unproven and per-task ceremony keeps growing. The tell is N consecutive framework-only tasks + new required steps each cycle. On main R6 is STOPPED (no auto-enforcement), so the HUMAN decides — SURFACE it, don't bury it: the fix is to apply the framework to a REAL project and validate ROI before adding more rigor (constitution governance axiom 5 spirit)."
    tags: [framework, roi, self-referential, r7, governance]
    project: shared
    strength: 3
    last_used: 590
    state: active

  - id: N-043
    text: "PowerShellで読み取り補助の短い関数名(例 Rd/R/Cp/Mv)を定義すると組込みエイリアス(rd=Remove-Item, ri=Remove-Item, cp=Copy-Item, mv=Move-Item, sc=Set-Content等)に解決され、意図せず破壊的コマンドが走る。実例: CP932 CSV を読む関数 Rd($p) のつもりが `Rd \"Palam.csv\"` が `rd Palam.csv`=Remove-Item となり tracked な Abl.csv/Palam.csv を削除→PALAM/ABL名テーブル未読込で autotest が無関係な既存行から全崩れ。対策: 補助関数は破壊的動詞と衝突しない明確な独自名(ReadCp932 等)にする。誤削除した tracked file は `git checkout HEAD -- <file>` で復元。回帰autotestが silent data loss の即時検知に有効。CP932/non-ASCIIパスは『ファイル不在』に見え原因を取り違えやすい→git status の D 行で削除を確認する。"
