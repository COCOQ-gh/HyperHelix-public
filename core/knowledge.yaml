    state: active

  - id: N-Project007-20260717a
    text: "HH-064 恒久ノートID の運用と落とし穴(本ノートが恒久ID の初使用=dogfood)。(1)新規ノートは `hyperhelix.mjs next-id` が生成する N-<proj>-<YYYYMMDD><連番英字> を使う(slug はブランチ由来: main→main / project|variant/ 接頭辞除去。英字は bijective base-26 で a,b..z,aa..)。legacy N-NNN は据え置き有効・改番禁止。adopt-notes は HH-061 残存仮ID専用(deprecated)。(2)残存リスク: 同一ブランチ・同一日の並行セッションが同じ英字を取る窓は残る(HH-058 L1 の領分)— ブランチ跨ぎ衝突(実害6回/日)は根絶。(3)委任の実測: codex のモデルは CLI バージョンでゲートされる — gpt-5.6-terra は CLI 0.139 で 400 エラー『requires a newer version of Codex』、0.144.5 へ `npm i -g @openai/codex@latest` で解消。モデル指名の WO を投げる前に CLI 更新を確認する。(4)検証の型: ID 生成器の受入は 正(形式・受理・インクリメント)+負(重複・不正形式)+dogfood(D7 ノート自身が初使用)の三点で機械確認できる。"
    tags: [note-id, permanent-id, hh-064, next-id, adopt-notes, bijective-base26, collision-free, codex-cli, model-version-gate, dogfood]
    project: hyperhelix
    strength: 3
    last_used: 933
    state: active

  - id: N-Project007-20260717b
    text: "委任 WO の計装3教訓(TASK-main-20260717-004 実測)。(1)非 Anthropic executor への WO では token_budget/effort が『計画メタデータであり停止条件ではない』と本文に明記する — 裸の `token_budget: 30K` を codex が拘束上限と解釈し、Execute 前に 50k 消費で自主停止した(agent-roles §10c の意味論は WO 本文に書かないと伝わらない)。あわせて reading_scope で governance 資材の再読を禁じると読込コストが激減する。(2)wo-watch の done-marker は WO 本文へエコーされる文字列と衝突させない — 出力ファイル先頭に WO 全文が写るため、本文に書いた `[WO-DONE]` に 0 秒で誤反応する(2回実測)。マーカーは本文中で分割表記するか、stall/budget 監視のみにする。(3)追跡フックの E2E テストで clone を使うときは、フックが『コミット済み』であることを確認する — 未追跡フックは clone に存在せず git は無音で素通しし、テスト全通過に見える偽陰性を作る(hooksPath 設定だけでは何も保証されない)。"
    tags: [delegation, wo, codex, token-budget, metadata, wo-watch, done-marker, false-positive, hooks, pre-push, clone, false-negative, testing]
    project: hyperhelix
    strength: 2
    last_used: 933
    state: active

