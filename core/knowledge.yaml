  - id: N-058
    text: "kami Project003(0.2.6.0) HTML描画 spike(TASK-268): SETCOLOR+文字バー(■□)は <font color='#RRGGBB'> として通常行に出力されHTML_GETPRINTEDSTRで捕捉=検証可・推奨。HTML_RECT_BAR の <shape type='rect'> も行内で捕捉可。だが HTML_PRINT \"<div display='absolute-lefttop'>...\" は0エラーだがHTML_GETPRINTEDSTRで空=オーバーレイ層描画(視認はプレイテストのみ・autotest検証不可)。∴リッチUIは色付き文字バー+SETCOLORで作ると検証可、絶対配置カードは視認をユーザー playtest に委ねる。参照テンプレ doc/project-notes/SHOP.ERB は描画層のみ(C_SHOP_*_Y定数/列挙欠落・30プレースホルダ)で直接ロード不可=見た目仕様の参照に留め、移植先(現行SHOW_SHOP)が実データを持つなら見た目だけ再現が最効率。訂正(TASK-270): **SETBGCOLOR はこの Project003 で全画面(コンソール)背景色を変える=全画面点滅・バー不可視**(span背景ではない)→ バー・ボタン・任意の印字を含む**全コンテキストで使用不可**。TASK-286 でタブボタン背景色に誤用→再発(TASK-287 で再修正)。正解=前景色のみ: 充填/残を `█`(UNICODE(0x2588), 隙間なし全角ブロック)で SETCOLOR 描画し、値は**全角**にして(TOFULL_K: 半角→全角)バー中央セルへ重ねる(全角同士で桁が揃う)。■(U+25A0)は字間に隙間。全角混在の文字数えは STRLENS=表示幅(全角2)/STRLENSU=文字数(全角1)、SUBSTRING vs SUBSTRINGU も同様→全角セル処理は **STRLENSU+SUBSTRINGU で統一**(混在すると値が崩れる)。追記(TASK-295 S-1〜S-10調査): (1) HTML_PRINT第2引数デフォルト0→lineEnd=true→毎回改行。インラインは`, 1`必須。(2) div width属性は背景矩形幅のみ、レイアウト幅=テキスト幅(横並びカードは不可)。(3) **ALIGNMENT RIGHT + 複数PRINTFORM = merge bug**(ShiftPositionX累積でX座標が画面外へ飛ぶ)→1行1命令(HTML_PRINT+<font>タグ)が正解。(4) バー値テキスト背景色の正解: HTML_PRINT @\"<div background_color='%TOSTR_HTML(色)%'><font color='#FFF'>..字..</font></div>\", 1。TOSTR_HTML()は汎用関数v2(COLOR.ERB)のユーザー定義関数で整数→#RRGGBB変換。(5) padding='3'はpx無しだとFontSize/100の整数除算=0px。必ず'3px'を付ける。"
