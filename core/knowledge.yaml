    text: "『集計列が空のまま』系のバグは実装ミスでなく**導線欠落**であることが多い — 値を書く処理(採点/集計)が1件ずつの手動ボタンしか起動点を持たないと、一覧は運用上ずっと空のまま(TASK-20260813-010: 上位候補の topScore/作品数が全行『—』)。設計時の受入条件に『その列が通常運用で埋まるか(一括/自動の起動点があるか)』を入れる。もう一つの定番は**探索パラメータが値の暗黙の天井**になる型(検索閾値ラダーの最大値が maxN の上限になっていた)。探索範囲の定数は entrypoint 直書きでなく純ロジック層へ置き、境界をテストで固定すると天井が可視化される。関連: [[N-Project005-20260901h]] ソース別シグナル, [[N-Project005-20260901l]] users入り 閾値。"
