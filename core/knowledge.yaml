  - id: N-Project001-20260818c
    text: "薄い起動コマンド(.claude/commands/skills/*.md)にルール本体を書くと、裁可済み改正から静かに乖離して**誤った操作を指示する資材**になる。実例(2026-08-18 sync 実行中に発見): sync スキル本文が (1)『task_index は累積=base+Σδ(max ではない)』= **HH-057 で撤去された旧規則**(現行 concurrency.md §3 は high-water=max) (2)『next_note_id は high-water=max』= **HH-064 で廃止**(保存も導出もしない) (3) コンフリクト解決③『ノート ID を採番し直し [[N-XXX]] 参照も更新』= **HH-064 が明示的に禁止**(per-file union・改番も参照書換もしない) の3件を保持していた。③に従うと裁可済み規則違反を実行する。憲法の環境制約の公理は『.claude/commands は薄い起動コマンド専用・ルール本体を記述しない』と定めており、規則本体の混入自体が公理違反。**教訓**: 起動コマンド/スキルに手順の実体(閾値・式・解決規則)が書かれているのを見たら、それは資材への参照へ畳むべき負債とみなす。改正(HH)は core/ と assets/ を更新しても .claude/commands までは追わないため、乖離は検出されずに残る。validate にも起動コマンド↔資材の整合検査は無い。同種の資材が他にもないか(compaction 手順・conflict guide 等)を横断確認する価値がある。"
