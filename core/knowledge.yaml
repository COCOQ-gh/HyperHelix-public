  - id: N-017
    text: "Before implementing a tool/format design, delegate an independent read-only review (survey WO) to a separate executor (e.g. Codex). It catches design holes the orchestrator missed — e.g. a re-run double-count in a counter bump that the orchestrator's own ordering fix did not cover. Spot-check every cited file:line (HH-012 §5) before adopting, but the second pair of eyes pays for itself on pre-implementation design review. Playbook for the wider delegated-review practice: value (this note) is bounded by two guardrails — a reviewer's suggestion can undo an ALREADY-settled design decision if not checked against the record ([[N-020]]), and a reviewer's NEGATIVE claims and secondhand numbers need the same file:line verification as its positive ones before they land in a deliverable ([[N-068]])."
    tags: [delegation, survey, review, design]
    project: shared
    kind: playbook
    leaves: [N-020, N-068]
    strength: 9
    last_used: 929
    state: active

  - id: N-018
    text: "When implementing a DETECTOR (validator scan, anchor parser, lint rule), always write a positive test — an input that SHOULD be flagged — not just a negative one. A silent miss looks identical to 'clean'. Example: a marker name regex [A-Z_]+ silently skipped HH:D7 because the name has a digit; only a positive test caught it. Also: a detector that scans active docs will flag its own spec and migration-explanation comments — give it a file-level + range allow mechanism and dogfood it."
