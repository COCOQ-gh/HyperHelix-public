  - id: N-main-20260821c
    text: "**ローカルゲートは『検査』を前倒しできるが『環境』は前倒しできない** — pre-push で CI と同一の `verify --base` を走らせても、走る場所は自分のクローン(named branch・既存 node_modules・単一 OS)であり、CI は fresh checkout(**detached HEAD**)+ lockfile install + ubuntu/windows 両方。実例(TASK-main-20260821-004): `brief` はブランチ名前空間からタスク ID を採るため detached HEAD で exit 1 になり、それを前提にしなかった CLI テストが**ローカル全 pass・CI 両 fail**になった。対策: 外部コマンドを叩くテストは環境前提(ブランチ・OS・インストール状態)を**明示的に検査して skip** し、環境非依存の純関数側に本体カバレッジを置く。一般則: green なローカルゲートは『検査漏れが無い』証明であって『環境差が無い』証明ではない。関連: [[N-main-20260821a]](強制機構それ自体の有効性を検査する)。"
    tags: [ci, local-gate, environment-drift, detached-head, actions-checkout, test-design, skip, cross-platform, pre-push, verify, framework]
    project: hyperhelix
    strength: 3
    last_used: 1137
