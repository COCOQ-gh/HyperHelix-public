# =============================================================================
# HyperHelix — core/knowledge.yaml
# Learning-note ledger. AI-facing artifact (English only).
#
# MODEL (HH-016): flat notes, not tiered materials. Purpose is narrow — at task
# start, surface relevant past lessons so the next task is a little better.
# No automatic ranking/promotion. "Don't aim for perfect; improve a bit next time."
#
# INDEX / 索引 (retrieval — this ledger is NOT read in full): S2 retrieves notes by
# TAG MATCH (core/gates.yaml search.top_n, ordered by last_used desc = recency,
# HH-045; active only). The tag set IS the index; only the header + counters below
# are always-read. INDEX TIER (HH-045): playbook notes (kind: playbook) are the
# PRIMARY retrieval target — one authoritative note per recurring topic, pointing
# via `leaves:` to its leaf notes (kind: leaf) for drill-down. This mirrors
# amendments.md's HH-024 index→drill (HH-026 R7b: a mandatory-tier file's index need
# not be a literal table when tag-search is its lookup). Grep a tag to find a
# playbook (or a plain note); open its leaves only when you need the evidence.
#
# NOTE FIELDS (10; kind/leaves/topic are the HH-045 playbook tier, OPTIONAL):
#   id        : new notes take a permanent N-<proj>-<YYYYMMDD><letters> id from
#               `hyperhelix.mjs next-id` (branch-derived slug; fixed at creation and
#               collision-free, HH-064). Legacy N-NNN ids remain valid and unchanged.
#               HH-061 provisional ids are deprecated and rejected on main; migrate
#               at the producer with `next-id`. `adopt-notes` is a no-op alias.
#   text      : ONE lesson and when it applies, on one line. Operating language OK.
#               New notes have a soft maximum length (validate NOTE_TEXT_LENGTH warn,
#               set in core/contracts.json note_text_soft_max, HH-082). Put the evidence
#               (measurements, history) in a leaf note or the commit hh-record.
#   tags      : free words (>=1), for retrieval match. No dictionary gate.
#               PROHIBITION notes: always tag the PROHIBITED term (not just the
#               preferred alternative) — searchers look for what they're about
#               to use, not its replacement (TASK-288: SETBGCOLOR note missing
#               "setbgcolor" tag → S2 miss even if run).
#   project   : OPTIONAL scope slug (HH-032). The project the lesson belongs to
#               (e.g. Project001, hyperhelix) or `shared` for cross-project. ABSENT ==
#               shared (backward-compatible). S2 retrieves only current-project +
#               shared notes (core/gates.yaml search.project_scope). Free string, no gate.
#   strength  : integer legacy hint. start 1; +1 when the note helped a passing
#               artifact; -1 when it was wrong/insufficient on a failing one.
#               Not a gate; not auto-promoted (avoids Goodhart; HH-009 spirit).
#               HH-045: DEMOTED from primary sort key to a secondary tiebreak.
#   last_used : counters.task_index when last used. HH-045: PRIMARY retrieval sort
#               key (recency desc) — a fact, not a score. Also the prune hint.
#   state     : active | archived. Archiving is a HUMAN action at /cycle (glance
#               stale / least-recently-used notes). No automatic orphaning.
#   kind      : playbook | leaf (HH-045 index tier, OPTIONAL; absent == plain note).
#               playbook = authoritative topic note (S2 primary target). leaf =
#               evidence note folded under a playbook. Plain notes omit kind.
#   leaves    : playbook only — inline single-line list of leaf ids it indexes
#               (e.g. [N-011, N-019]). Keep single-line flow style (readability;
#               the SC-05 formal parser reads any YAML, N-005's parser limit is gone).
#   topic     : leaf only — the playbook id this note drills down from (e.g. N-059).
#
# PER-TASK (D7): at most one move — add a note, or nudge a note's strength +/-1
# (with last_used). No recompute, no derived fields, no global consistency pass.
# See core/loop.yaml D7 and assets/checklists/distill.md.
#
# CANON LIVES IN THE USER LAYER: when a lesson is important/durable enough, a
# human lifts it into constitution.md or files it via amendments.md. There is no
# automatic axiom path here. The ledger is working memory, not law.
#
# CONCURRENCY (HH-015 / HH-057): task_index & last_framework_review are HIGH-WATER
# (max) marks, NOT cross-branch accumulators — a merge/reflux takes max(ours,theirs)
# (reflux auto-resolves this; no base+Σδ formula). They are branch-local monotonic
# counters used only for cadence + note recency; the absolute value carries no
# cross-branch meaning. Permanent IDs are fixed at creation, so they need neither
# derivation nor sequential allocation (HH-064); `hyperhelix.mjs next-id` is a generator.
# FILE ROUTING (HH-045 (2)): each note lives in the ledger file matching `project:`.
# Shared and hyperhelix notes (including playbooks such as N-059) stay here; project
# leaves live at core/knowledge/<project>.yaml. Merge each file by union of its notes.
# Counters exist only in this main ledger. Strength nudges are last-writer-small and
# tolerated (imperfection is acceptable — fix next time).
# MANIFEST (SC-05a): core/knowledge/manifest.yaml declares the ledger list and
# project ownership; the formal reader (tools/lib/knowledge.mjs, validate
# KNOWLEDGE_READER) reads only declared ledgers. Adding a project ledger =
# add the file AND its manifest entry in the same change.
# WRITER (SC-05b): every ledger write (bump counters/nudges, baseline counters,
# reflux counter merge) goes through the repository's atomic commit — validate
# the post-state, same-directory temp file, fsync, fixed-order rename; a failed
# write leaves nothing partially visible. Direct writeFileSync on a ledger is a
# forbidden live expression in the notes/next-id/bump/sync/reflux/report paths.
#
# REVIEW-ONLY (HH-023/068): a pure inspect-and-report session with ZERO session-
# owned repository writes does NOT increment task_index (it is not a task).
# Pre-existing/verified-foreign dirtiness alone does not promote it; baseline +
# ownership journal proves the boundary. Any owned write is a task, while unknown
# or same-path ownership fails closed. Authority: assets/workflows/review-only.md.
# =============================================================================
schema_version: 1

# --- persistent counters (HH-057: high-water marks; next_note_id derived) ---
counters:
  # HH-057: task_index & last_framework_review are HIGH-WATER (max on merge), NOT
  # accumulators. reflux auto-resolves counter conflicts by max. Permanent IDs are
  # fixed at creation, so next_note_id is neither stored nor derived; `next-id` generates them (HH-064).
  # HH:ACTIVE-SCAN-ALLOW reason="names the HH-016-abolished counters as history"
  # (Legacy: old-schema counters tasks_since_tuning / tuning_signals / id_seq are abolished by HH-016.)
  # /HH:ACTIVE-SCAN-ALLOW
  # SC-05b: last_bump_task is the bump idempotency provenance (the task that last
  # incremented task_index) as a STRUCTURED field — per-task inline comments on
  # these counters are retired (machine values never live in prose, HH-067).
  # Review-source provenance lives in the task record (d7.review).
  # 各コメントは「値の意味」だけを述べる。過去の値・次回予定などの機械値を書かない
  # (HH-067: machine values never live in prose。実測 2026-08-29 /cycle ordinal 13 —
  #  review_ordinal のコメントが「次回 heavy レンズは ordinal 10」のまま陳腐化し、
  #  そのまま読むと cadence を誤算する罠になっていた)。
  task_index: 1140 # マージ時 high-water(HH-057)
  last_framework_review: 1136 # マージ時 high-water(HH-057)
  review_ordinal: 19 # HH-080 producer: bump --review が +1(high-water merge)。heavy レンズは (ordinal+1) % 5 == 0 の回
  last_bump_task: TASK-publicz2fv0z2e1z2e0z2dclean-20261018-001 # bump 冪等性の provenance(SC-05b)
  last_always_read_lines: 464 # convergence R7a baseline: written ONLY by `cost-report --write-baseline` (/cycle only; plain runs are read-only — TASK-20260715-005)
  last_always_read_chars: 34031 # convergence R7a ratchet gauge, always-read part, in characters (HH-073): written ONLY by `cost-report --write-baseline` (/cycle only); null until the first /cycle seeds it
  last_index_read_chars: 25651 # convergence R7a ratchet gauge, index-read heads part (HH-082 A): same writer; judged as the sum with last_always_read_chars
  last_backlog_open_count: 17 # convergence R8c baseline: SYNC-20260823b で ours(27)を採用。**次 /cycle の初回計測は main 由来の open 行を含むため一度だけ上振れする** — 累積(accretion)ではなくマージ由来なのでラチェット発火は棄却してよい

# --- learning notes (flat; retrieval sorts by last_used desc = recency, HH-045) ---
notes:
