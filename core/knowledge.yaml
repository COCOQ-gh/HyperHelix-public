  - id: N-Project006-20260719b
    text: "**収束ゲージは「削減したい実コスト」と同じ単位で測る — 単位がずれると是正インセンティブが逆を向く**。実証(/cycle TASK-20260719-002): HH-050 ラチェットと cost-report は常時必読を**行数**で測るが、実コストは文字/トークン。実測で constitution.md=**80行/12,274字(153字/行)** は行数17%に対し**文字数31%**、gates.yaml=**49行/3,103字**は**33行がコメント**。帰結 (1)574字の散文1行を半分に縮めても gauge は**1行も動かない** (2)gauge を動かす最短手が**コメント行の削除**になり、実コスト削減と逆方向へ誘導する。ラチェット発火時の D5 slim は『行を消す』最適化に堕しうる。一般則: **ゲージを設計したら『この数値を最小化する最短手』を1つ書き出し、それが本来の目的と一致するか確認する**(Goodhart の事前チェック)。単位変更は θ/gate 意味変更=人間ゲート。関連: [[N-066]](stirrup=減算レンズ)・[[N-064]](手書きカウンタは導出可能なら消す)。"
