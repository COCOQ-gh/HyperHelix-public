  - id: N-Project005-20260901v
    text: "ローカル開発/閲覧サーバの Cache-Control は資産種別で分ける — 静的 UI(html/js/css)に長い max-age を付けると、更新後も旧 JS が挙動し『直したのに変わらない』手戻りを誘発する(TASK-20260813-003: 画像用 max-age=3600 が UI にも適用されていた)。定石: UI は no-cache、不変アセット(内容がパスで一意になる画像等)のみ max-age。greenfield WO にはキャッシュポリシーを仕様として明記する。ブラウザ側で旧キャッシュを踏んだ時は fetch(url, {cache:'reload'}) で HTTP キャッシュをバストしてから reload(location.reload は max-age 内の再利用を防げない)。"
