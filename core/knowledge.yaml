  - id: N-037
    text: "CP932 の ERB/CSV を UTF-8 として読み書きすると、非UTF-8バイトが U+FFFD(バイト EF BF BD)へ化けて原文字が永久消失し、Project003 は ERB を CP932 として読むため日本語リテラルが全画面化けする(変数展開は無傷なので『リテラルだけ化ける』のが特徴)。検知: Data配下を `EF BF BD` バイト走査(コード構造は無傷なので autotest 関数検証は素通り=test-plan §3B)。原因commit特定: 各ファイルの履歴blobをCP932妥当性とFFFD数で二分。復旧: U+FFFDは復元不能なので git親commitのクリーンCP932版から復元し、破損commitの機能差分のみ再適用(.gitattributes * -text でバイト保全)。実例: Project001 TASK-187で COM_ACT/INFO1/SHOW_CHARA の3ファイルが encoding『正規化』commitで破損。予防: コミット前のEF BF BD走査を回帰ガード化。"
    tags: [erb, encoding, cp932, utf8, corruption, u-fffd, regression-guard]
    project: Project001
    strength: 4
    last_used: 420
    state: active

