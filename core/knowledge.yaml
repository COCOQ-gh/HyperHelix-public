  - id: N-Project001-20260824d
    text: "**教訓を『チェックリスト行』へ置くと、次のタスクへの配送経路が無い。** 実測(2026-08-24 /cycle, ordinal 4): 前回 /cycle が `assets/checklists/evaluate.md` V2 へ追加した「失敗したチェックは修正前に (a)検査が誤り/(b)出所が誤り/(c)回避 を分類して記録する」ルールは、直後の6タスクで **採用 0/6** だった — うち2タスク(-010/-011)には実際に赤くなったチェックがあったのに、である。**根本原因は規則の質ではなく配送**: S2 は `notes --tags` でノートを機械的に引き、search.md は anti-patterns.md の参照をチェック項目として持つが、**フェーズ別チェックリストには retrieval のレールが無い** — loop がすでに文脈に載っている実行者は、該当ファイルの該当節を開く機会が無いまま Evaluate を通過する。∴ **恒久化の宛先は『どこが内容的に正しいか』だけでなく『どこなら次に読まれるか』で選ぶ**: (1) 規則の権威はフェーズ資材に置いてよいが、(2) **retrieval のあるレール(note / anti-pattern)から必ず1本ポインタを張る**(本件は AP-021 の prefer 欄へ「分類は evaluate.md V2」を追記し、V1 側にも失敗が実際に露出する位置へポインタを置いた)。副次の一般形: **AP-003(宣言↔消費)は「消費者コードが無い」だけでなく『人間/AI 読者に届く経路が無い』形でも起きる** — 消費者が読者であるときは配送経路が消費者配線である。関連 [[N-Project001-20260824b]]。"
