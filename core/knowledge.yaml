  - id: N-Project008-20261002b
    text: "**forge-std の `vm.expectRevert()` は『次の外部呼び出し』に掛かる。ヘルパー関数の中の外部 view 呼び出しも数に入る。** 実測(TASK-Project008-20261002-002): `vm.expectRevert(X); gateway.pay(intent, _sign(key, intent));` で、引数を評価する `_sign` の中の `gateway.hashIntent()`(外部 view)が先に実行され、そこで期待が消費された。結果は 'next call did not revert as expected' で、エラーの行番号はヘルパーを指す。∴ (1) 署名・ハッシュ・残高取得など、外部呼び出しを含む引数は expectRevert の**前に**ローカル変数で作る。(2) この失敗メッセージを見たら、本体の不具合を疑う前に、expectRevert と対象呼び出しの間に外部呼び出しが挟まっていないか確認する。vm.prank も同じく『次の呼び出し』に掛かるので、同じ形で崩れる。"
    tags: [solidity, forge-std, hardhat, testing, expectRevert, prank, cheatcodes, test-bug]
    project: shared
    strength: 1
    last_used: 1115
    state: active
  - id: N-Project008-20261002a
    text: "**長時間コマンドを『止まっている』と判定する前に、ストレージの実測を取る。** 実測(TASK-Project008-20261002-001): 外付け USB HDD(H:)上で `npm ci`(約140パッケージ)が 10 分を超えても終わらず、stuck と判断して kill した。実際は低速 I/O で進行中だった。200 個の小ファイル書き込みが H: で 18.5 秒、C:(NVMe)で 0.19 秒で、約 100 倍遅い。node_modules の削除に約 15 分、再 install に 17 分かかった。∴ (1) 新しい作業ディレクトリで install やビルドを始める前に(S3 の unknown として)小ファイルの書き込み速度を 1 回測る。(2) 遅いドライブでは run_in_background と長いタイムアウトを最初から使い、kill の判断は出力やファイル数の増加で進捗を確かめてからにする。(3) 配置換えやジャンクションはユーザーの判断事項なので、測定値を添えて選択肢を出す。"
