    text: "Project003 は Project003.log(OUTPUTLOG 出力)を UTF-8(BOMなし)で書く。autotest ランナーの text-assert(EXPECT_TEXT/EXPECT_NO_MOJIBAKE)は Project003.log を **UTF-8 で読む**こと。Default(CP932)で読むと日本語が化け、marker と描画が両方同じ化け方をして present-check が偶然一致する(=脆い偽 pass)。ASCII は不変。UTF-8 読みなら日本語照合が正しく、U+FFFD(EF BF BD)も検出可。加えて、最終 EXPECT marker が SUMMARY と同 flush で取りこぼされるため、ポーリングループ後に最終 text-scan を1回行う。実証: 508/対話スイートとも UTF-8 読みで TextPass 正常化(神位/助手/title)。"
