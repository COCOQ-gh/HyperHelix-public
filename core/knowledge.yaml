  - id: N-main-20260728a
    text: "Git Bash(MSYS)は先頭 `/` の CLI 引数を Windows パスへ自動変換する — `bump --review-source /cycle` が `C:/Program Files/Git/cycle` として記録され provenance を汚染した(TASK-main-20260728-002 で是正)。hyperhelix.mjs を Git Bash から呼ぶとき、値が `/` で始まる引数(--review-source /cycle 等)には `MSYS_NO_PATHCONV=1` を付けるか PowerShell から呼ぶ。**ただし `finish` は PowerShell から呼べない**(L3 が pre-push 構文テストで `sh -n` を spawn し、PowerShell セッションでは sh が PATH 未解決 → ENOENT で verify FAIL・fail-closed 中断。実測 2026-08-24 TASK-Project003z2dlabz2dh-20260824-010)— finish は Git Bash + `MSYS_NO_PATHCONV=1` を使う。PowerShell 可なのは bump 単体等 sh 非依存のサブコマンドのみ。ツール出力・record への書込値は書いた直後に目視確認する(検出は grep 'Program Files' で可能)。"
    tags: [msys, git-bash, path-conversion, windows, cli, bump, review-source, provenance, framework]
    project: hyperhelix
    strength: 2
    last_used: 957
    state: active

  - id: N-Project001-20260822a
    text: "ホストが検証する構造化フック出力(hook JSON)は**イベントごとにスキーマが違う** — Claude Code の `hookSpecificOutput.additionalContext` は prompt 系イベント(UserPromptSubmit ほか)専用で、PreCompact には受け皿が無く、不正キー1個で**出力全体が破棄**される(`Hook JSON output validation failed — (root): Invalid input`)。ユニットテストはハンドラの戻り値しか見ないためホストの拒否を観測できず、RT-19 は逆に不正形式を assert して固定していた=HH-055 以降ずっと圧縮契約がどの圧縮器にも届いていなかった(HH-079 / AP-019)。対策: (1)フック出力形式は実ホストで1回実測し、その測定を『許可されたトップレベルキー集合』の assert として固定する(単一フィールドの存在 assert にしない) (2)届け先が存在しないと判明した payload は、チャネルではなく**自力で生き延びる成果物**(state file 等)へ移す。"
    tags: [hooks, host-contract, output-schema, precompact, compaction, claude-code, codex, unit-test-blindspot, silent-failure, boundary-verification, hh-079, ap-019, framework]
    project: hyperhelix
    strength: 1
    last_used: 917
    state: active

  - id: N-main-20260821a
    text: "**強制機構それ自体が有効かを検査する** — 配線を宣言した資材(session-bootstrap §3c の `core.hooksPath = tools/hooks`)があっても、機械が見ていなければ無効化に誰も気づかない。実例(TASK-main-20260728-011): pre-push gate を強化した直後に、そのクローンで hooksPath が未設定=gate が一度も発火していなかったと判明。宣言→消費者(AP-003)の消費者側が『検査』である場合も同じで、gate/hook/CI の**存在**ではなく**有効性**を検査対象にする。CI や bare checkout を壊さないため warn 級が妥当。関連: [[N-059]](declare↔consume playbook)。"
