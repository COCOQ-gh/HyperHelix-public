  - id: N-064
    text: "手書きカウンタは『git から導出できる事実のキャッシュ』であり、分岐で必ず drift し、その補償として突合工程が生まれる。是正の第一手はキャッシュ自体を消すこと(next_note_id → 台帳 max+1 の導出)。ただし全カウンタが導出可能とは限らない — task_index は全ブランチ横断の accumulator で main 一本の git 履歴からは再構成不能(実測 510≠232)だった。しかし用途を精査すると cadence と note recency の順序付けだけで、cross-branch の絶対値は誰も使っていなかった。そこで accumulator を捨て branch-local high-water(max)へ。『動いている自作機構が必要』という思い込み(frame lock-in)は、実際の消費者を数えて破る。HH-057・[[N-063]](単調増加の基準点)と同系。"
    tags: [counters, derivation, cache, frame-lock-in, high-water, sync, HH-057]
    project: hyperhelix
    strength: 4
    last_used: 530
    state: active

  - id: N-065
    text: "スキル/手順のトークン消費は『本文注入(毎回)』と『手順の tool 往復』に分解して測る。注入コストは fast path で読まれない部分(コンフリクト解決ガイド等)を on-demand 資材へ分離して削る(sync.md 10055→1295 chars: fail 時のみ Read)。往復コストは決定的な規則(S2 の top_n/recency/scope/playbook 優先)をツール化して 1 コマンドに畳む(`notes`/`compact-prep` サブコマンド)。判定基準: 手順のうち機械的に決定できる部分はツールへ、意味判断だけをモデルに残す。副次効果: ルールのツール実装は解釈ゆらぎも消す。"
