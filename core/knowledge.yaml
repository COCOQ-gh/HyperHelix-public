  - id: N-main-20260823a
    text: "**『構造的に不可能』と書く前に回避策を1つ実測する** — 制約の記述は、試した経路の失敗を制約そのものへ一般化しやすい。実例(TASK-main-20260823-001): backlog の high 行が『finish と archive-briefs は構造的に併用できず、迂回すると L3 が走らない』と断じ、実際に2回連続で迂回して壊れたテストを commit していたが、実装(`fs.existsSync`、tools/hyperhelix.mjs:1631)は**個別ファイルパスのみ**を弾く。親ディレクトリを渡せば `git add <dir>` が削除も stage し、L1-L4 は完走する(実測: ある commit が 40 件の削除を含んで通過)。一般則: 『できない』を資材へ書くときは (1) 失敗した具体的な呼び方 (2) 実装のどの行がそう決めているか (3) 隣接する呼び方を1つ試した結果 を添える。添えられないなら『この呼び方では失敗する』と書く。関連: [[N-main-20260821c]](ローカル green は環境差の証明ではない)・AP-015(負の主張にも証拠を)。"
