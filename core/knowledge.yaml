# =============================================================================
# HyperHelix — core/knowledge.yaml
# Learning-note ledger. AI-facing artifact (English only).
#
# MODEL (HH-016): flat notes, not tiered materials. Purpose is narrow — at task
# start, surface relevant past lessons so the next task is a little better.
# No automatic ranking/promotion. "Don't aim for perfect; improve a bit next time."
#
# INDEX / 索引 (retrieval — this ledger is NOT read in full): S2 retrieves notes by
# TAG MATCH (core/gates.yaml search.top_n, ordered by last_used desc = recency,
# HH-045; active only). The tag set IS the index; only the header + counters below
# are always-read. INDEX TIER (HH-045): playbook notes (kind: playbook) are the
# PRIMARY retrieval target — one authoritative note per recurring topic, pointing
# via `leaves:` to its leaf notes (kind: leaf) for drill-down. This mirrors
# amendments.md's HH-024 index→drill (HH-026 R7b: a mandatory-tier file's index need
# not be a literal table when tag-search is its lookup). Grep a tag to find a
# playbook (or a plain note); open its leaves only when you need the evidence.
#
# NOTE FIELDS (10; kind/leaves/topic are the HH-045 playbook tier, OPTIONAL):
#   id        : N-NNN, unique, never reused.
#   text      : the lesson, one line. Operating language OK.
#   tags      : free words (>=1), for retrieval match. No dictionary gate.
#               PROHIBITION notes: always tag the PROHIBITED term (not just the
#               preferred alternative) — searchers look for what they're about
#               to use, not its replacement (TASK-288: SETBGCOLOR note missing
#               "setbgcolor" tag → S2 miss even if run).
#   project   : OPTIONAL scope slug (HH-032). The project the lesson belongs to
#               (e.g. Project001, hyperhelix) or `shared` for cross-project. ABSENT ==
#               shared (backward-compatible). S2 retrieves only current-project +
#               shared notes (core/gates.yaml search.project_scope). Free string, no gate.
#   strength  : integer legacy hint. start 1; +1 when the note helped a passing
#               artifact; -1 when it was wrong/insufficient on a failing one.
#               Not a gate; not auto-promoted (avoids Goodhart; HH-009 spirit).
#               HH-045: DEMOTED from primary sort key to a secondary tiebreak.
#   last_used : counters.task_index when last used. HH-045: PRIMARY retrieval sort
#               key (recency desc) — a fact, not a score. Also the prune hint.
#   state     : active | archived. Archiving is a HUMAN action at /cycle (glance
#               stale / least-recently-used notes). No automatic orphaning.
#   kind      : playbook | leaf (HH-045 index tier, OPTIONAL; absent == plain note).
#               playbook = authoritative topic note (S2 primary target). leaf =
#               evidence note folded under a playbook. Plain notes omit kind.
#   leaves    : playbook only — inline single-line list of leaf ids it indexes
#               (e.g. [N-011, N-019]). Single line (N-005: fixed-schema parser).
#   topic     : leaf only — the playbook id this note drills down from (e.g. N-059).
#
# PER-TASK (D7): at most one move — add a note, or nudge a note's strength +/-1
# (with last_used). No recompute, no derived fields, no global consistency pass.
# See core/loop.yaml D7 and assets/checklists/distill.md.
#
# CANON LIVES IN THE USER LAYER: when a lesson is important/durable enough, a
# human lifts it into constitution.md or files it via amendments.md. There is no
# automatic axiom path here. The ledger is working memory, not law.
#
# CONCURRENCY (HH-015): counters update by commutative +1 delta; never overwrite
# with a stale absolute. notes append; strength nudges are last-writer-small and
# tolerated (imperfection is acceptable — fix next time).
#
# REVIEW-ONLY (HH-023): a pure inspect-and-report session with ZERO tracked-file
# change does NOT increment task_index (it is not a task). The instant any tracked
# file changes it is a real task and task_index applies. Authority:
# assets/workflows/review-only.md.
# =============================================================================
