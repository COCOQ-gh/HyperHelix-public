  - id: N-main-20260823a
    text: "**『構造的に不可能』と書く前に回避策を1つ実測する** — 制約の記述は、試した経路の失敗を制約そのものへ一般化しやすい。実例(TASK-main-20260823-001): backlog の high 行が『finish と archive-briefs は構造的に併用できず、迂回すると L3 が走らない』と断じ、実際に2回連続で迂回して壊れたテストを commit していたが、実装(`fs.existsSync`、tools/hyperhelix.mjs:1631)は**個別ファイルパスのみ**を弾く。親ディレクトリを渡せば `git add <dir>` が削除も stage し、L1-L4 は完走する(実測: commit 8519e46 が 40 件の削除を含んで通過)。一般則: 『できない』を資材へ書くときは (1) 失敗した具体的な呼び方 (2) 実装のどの行がそう決めているか (3) 隣接する呼び方を1つ試した結果 を添える。添えられないなら『この呼び方では失敗する』と書く。関連: [[N-main-20260821c]](ローカル green は環境差の証明ではない)・AP-015(負の主張にも証拠を)。"
    tags: [constraint-claim, workaround, negative-claim, backlog, finish, archive-briefs, path, enforcement-gap, evidence, framework, ap-015]
    project: hyperhelix
    strength: 1
    last_used: 928
    state: active

  - id: N-Project001-20260825a
    text: "**WO を6本まとめて委託して実測(2026-08-25 /cycle ordinal 6): executor が上申してきた『指示と実装の食い違い』は 5件すべてオーケストレータ側の誤りで、実装側の誤りはゼロだった。**内訳 = 期待値の対を反転して転記 / 陳腐化した行番号2件(`WHILE < 29` は実際には `< 25`、フッタ `< 10` は `< 9`)/ 図が実装より古い2件(除外済みの品目を描いている・軸の中立値が旧値)。∴ **WO の価値は「何を書くか」より「自分の誤りが黙って実装に入らない構造を作るか」にある**。効いた指定は4つ: (1) **権威順序を明示して異議を義務づける**(『設計書 > HEAD > 本 WO。食い違ったら上位に従い、食い違いを報告せよ』)— 6本中3本でこれが発火した。(2) **仕様値と行番号を WO へ転記せず、読みに行かせる** — 行番号は最速で腐る(同一ファイルが1セッションで4回コミットされ、S4 実測の行番号が着手時には無効だった)。**数値を一切書かなかった1本だけがオーケストレータ由来の誤りゼロ**。(3) 未知が1点に集中する単位は**第1手をその未知の実測に固定し、失敗したら止まれと書く**(実測: 使い捨てプローブで検証→除去→本実装、という運びを executor が自分で選んだ)。(4) **『意図的に変更しなかったものとその理由』を報告項目にする** — 判断の質を最も安く点検できる。**同時に踏んだ自分の失敗**: 6本すべてで **S2 のノート検索を実行しなかった**(全 record の notes.retrieved が空)。そのうち1件は [[N-Project001-20260811d]](WO 発行前に scope 各ファイルのBOM を機械確認してから encoding を書け)が**タグ一致で引ける状態で存在していた**のに、同じ誤り(テストファイルを CP932 と誤指定)を繰り返した。**委託が速いほど S2 を飛ばしやすい** — 委託の直前こそ `notes --tags <domain>,work-order,delegation` を回す。資材側の権威は agent-roles.md §3a。関連 [[N-Project001-20260811d]]・AP-018・AP-023。"
    tags: [work-order, delegation, codex, executor, orchestrator-error, authority-order, line-number-rot, stale-figure, s2, retrieval-gap, framework, spec, review]
    project: shared
    strength: 12
    last_used: 1098
    state: active

  - id: N-Project001-20260826b
    text: "**手法を外部資料から輸入する前に、同じファイル/同じ資材の中で『既に正しく動いている隣の実装』を探す。** 実測(2026-08-26 TASK-Project001-20260826-004): メイン画面の背景がスクロールに追随しない不具合で、外部ガイドは新しい手法を薦めていたが、正解は**同一ファイル内で既に追随していた `SHOP_FRAME_DIV`(相対 div)の水平展開**だった。パネルだけが古い機構(固定レイヤー)のまま取り残されていた形である。**外部資料からの輸入は常に版ずれのリスクを負う** — 実測では同梱ビルドのハッシュが資料の参照した checkout の履歴に存在せず、資料の中心的な主張2点が当該ビルドでは誤りだった。対して**隣の実装は『当該環境で現に動いている』という証拠そのもの**であり、検証コストがゼロに近い。∴ 手法選定の順序は (1) 同一資材内の実証済みパターン -> (2) 同一プロジェクト内の別資材 -> (3) 外部資料(採用前に対象環境で smoke)。副次: 隣に正しい実装があるのに古い機構が残っている箇所は、**一括移行が途中で止まった痕跡**であることが多く、他にも取り残しがないか同じ観点で洗う価値がある。"
    tags: [design-selection, prior-art, external-doc, version-skew, smoke-test, migration-leftover, framework, scope:framework, measured]
    project: shared
    strength: 1
    last_used: 1021
    state: active

  - id: N-Project001-20260830a
    text: "**ツールが生成した直後の成果物が、同じツールのゲートに落ちることがある — 生成側と検証側が別の契約(epoch / schema 版)を見ているとき。** 実測 2026-08-30(/cycle ordinal 15・TASK-Project001-20260829-027): `brief --mode micro` は `tasks/TASK-<id>.md`(Markdown ブリーフ)を**正常に作成**するが、task domain の epoch は `new-read-write` で SC-RT-12 は NEW epoch のブリーフに structured record を要求する ∴ その Markdown が `legacy-live`(rejected=1)と判定され、`finish` の L3 が `node --test exited 1` で fail-closed 停止した。**資材3箇所 — `core/loop.yaml depth_modes.micro.record_in` / `core/routing.yaml routing[task working record]` / `assets/checklists/search.md` S1 前提 — はこの Markdown を有効と宣言している** ∴ 宣言側と検証側が別の版で凍っていた(AP-003 declare↔consume が epoch 層で開いた形)。**回復手順**: `--mode` を付けずに `brief --task <id>` を打ち直すと record-only YAML が作られて通る。**bump は先に走り終えているが冪等**(`counters.last_bump_task` がキー)なので task_index は二重に進まない — ただしそのことは出力に現れないので、止まった直後に `git status` と counters を必ず見る。**一般則**: 深度モード・出力形式・スキーマ版のような**めったに使わない生成オプションを初めて使うときは、成果物ができた直後に受け側のゲートを1回空打ちして通るか確かめる** — **生成が成功したことは、受理されることの証拠ではない**。関連 [[N-main-20260821a]](強制機構それ自体の有効性を検査する)・[[N-main-20260823a]](『できない』を書く前に隣の呼び方を1つ試す)。"
    tags: [brief, micro, depth-mode, epoch, schema-version, migrate-canon, finish, fail-closed, generator-validator-mismatch, declare-consume, ap-003, framework, scope:framework, measured]
    project: shared
    strength: 1
    last_used: 1083
    state: active

  - id: N-Project001-20260830b
    text: "**タスク ID はレコード(`brief`)を作ってからコミットメッセージで名乗る — 逆順にすると採番が飛んで ID がずれる。** 実測 2026-08-30(wave-1): ホスト側コミットで TASK-…-008/-009 を先に名乗った後に `brief --date` を打ったところ、採番器がコミット済み ID を使用済みと見なして -010/-011 を返し、**コミットとレコードの ID が恒久的に食い違った**(是正はレコード側 evidence への注記のみ・履歴改変はしない)。正順 = (1) `brief` でレコード作成と claim (2) 実装/適用 (3) そのレコードの task_id をコミットで名乗る。orchestrator 直の小タスクほどコミットを先に打ちたくなるので注意。関連 AP-016(claim 照合)。"
