  - id: N-Project001-20260818b
    text: "HyperHelix をホストプロジェクトにネスト配置(doc/HyperHelix/)して Claude Code をホスト root で起動する場合、有効な hooks 設定は **ホスト側** `<host>/.claude/settings.json` であり、HyperHelix リポジトリ内の `.claude/settings.json`(validate が検査するもの)は一切効かない。実害: Project001 で PreCompact/PostCompact/UserPromptSubmit(compaction-hooks.mjs precompact/postcompact/prompt)が数週間未登録のまま=transcript 6.7MB(警告閾値の10倍超)でも context 警告・compact-prep・圧縮後 recovery が一度も発火しなかった(ユーザー指摘で発覚, TASK-Project001-20260818-001)。runtime 自体は非ASCII ホストパス(Project001(改))でも完全動作(実測)し、resolveProjectDir が scriptRoot へフォールバックするので `node <host>/doc/HyperHelix/tools/compaction-hooks.mjs <mode>` をホスト settings に直接登録すればよい(bash 不要・node のみ)。ホスト `.claude/` は通常 gitignore なので、フレッシュ clone ごとに手で復元が要る=ホスト README に登録スニペットを置く。session-bootstrap §3b(HH-055)は『.claude/settings.json に登録必須』としか書いておらず、§2(スキルのネストパス注意)と対になる注意が欠けていた=資材の盲点。"
