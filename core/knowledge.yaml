  - id: N-043
    text: "PowerShellで読み取り補助の短い関数名(例 Rd/R/Cp/Mv)を定義すると組込みエイリアス(rd=Remove-Item, ri=Remove-Item, cp=Copy-Item, mv=Move-Item, sc=Set-Content等)に解決され、意図せず破壊的コマンドが走る。実例: CP932 CSV を読む関数 Rd($p) のつもりが `Rd \"Palam.csv\"` が `rd Palam.csv`=Remove-Item となり tracked な Abl.csv/Palam.csv を削除→PALAM/ABL名テーブル未読込で autotest が無関係な既存行から全崩れ。対策: 補助関数は破壊的動詞と衝突しない明確な独自名(ReadCp932 等)にする。誤削除した tracked file は `git checkout HEAD -- <file>` で復元。回帰autotestが silent data loss の即時検知に有効。CP932/non-ASCIIパスは『ファイル不在』に見え原因を取り違えやすい→git status の D 行で削除を確認する。"
