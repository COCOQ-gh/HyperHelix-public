    text: "epoch/cutover producerの回帰は『新artifactが存在する』だけで閉じず、禁止したlegacy artifactが存在しないことも同じE2Eで主張する。実例: task epochはnew-read-writeだったが、brief実装がdomainEpoch(task)の戻りobjectを文字列と比較し、schema v1 record+Markdown pairを生成した。testはrecord directoryだけを見て通過していた。対策は(1)accessorの戻りshapeをpure selectorへ閉じる、(2)schema/versionの正assert、(3)同ID legacy view不在のnegative assertion、(4)archive後もtest fixtureはlive taskを参照せず自己完結生成する。"
