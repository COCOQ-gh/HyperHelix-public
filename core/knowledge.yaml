  - id: N-084
    text: "監視・検知器の初回実地適用は『較正イベント』として扱い、偽シグナルを前提に人手プローブ(プロセス生存・出力実体の確認)を併走させる — wo-watch 初回で2つの偽シグナル源が同日に出た: (1) **prompt echo**: codex exec は WO プロンプト本文を出力へ echo するため、非アンカーの完了マーカーが WO 指示文中の文字列に 0 秒でマッチ(偽 DONE)→ マーカーは行頭アンカー化 + 指示文ではマーカーを行頭に書かない。(2) **block buffering**: ファイルリダイレクト時の stdout は約 8KB 単位で flush され、生存・作業中でも数分無出力に見える(偽 STALL)→ ファイル成長だけを liveness にしない(--pid のプロセス生存を副信号に。Git Bash は /proc/$!/winpid の Windows pid を渡す)。机上テスト(自作の整形済み入力)はこの2つを構造的に見逃す — 実戦入力(echo・バッファ・エンコーディング)での較正が別途要る。[[N-072]](5) の encoding-grep と同族。"
    tags: [detector, calibration, wo-watch, false-positive, prompt-echo, block-buffering, liveness, pid, delegation, HH-063, framework]
    project: hyperhelix
    strength: 1
    last_used: 533
    state: active

  - id: N-081
    text: "深度 micro の判定は use_when 固定語彙(typo-fix/link-fix/heading-number-fix/obvious-removed-term-replacement/readme-1-2-line)への**一致照合のみ**で行う — 『変更が小さい/儀式を省きたい』という印象は判定入力ではない。any-logic-change / any-gate-or-axiom-touch は行数に関係なく micro 禁止(ツール・フックの1行変更も logic)。実害: TASK-20260716-007/008(ツール+フック logic・amendments 変更)を brief なし micro で処理し、外部モデルレビュー(Codex R4)で初めて発覚 — 自己判定は自分の省力バイアスに盲目。救済は loop.yaml micro note の規定どおり: 次タスクから standard へエスカレーション + D2 蒸留。判定時は一致した語彙を brief または commit body に明記する(明記できない=micro ではない)。"
    tags: [depth-mode, micro, phase-gate, fixed-vocabulary, misclassification, self-bias, framework]
    project: hyperhelix
    strength: 2
