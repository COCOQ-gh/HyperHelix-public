  - id: N-main-20260821b
    text: "**恒久 ID へ焼き込む値(日付)はセッションの記憶でなく実時刻から採る** — 1 セッションが実時間で数日〜数週間に跨ると、最初に決めた `--date` を無意識に再利用し、恒久 ID(HH-065 タスク ID)と統治証跡(HH-046 `ratified_at`)に誤った日付が焼き付く。実例(TASK-main-20260821-001): 2026-07-28→08-11→08-21 に跨るセッションで `--date 20260728` を使い続け、タスク ID 5 件と HH-076 の裁可日が最大 24 日ずれた。**ID は改名禁止のため事後訂正できるのは証跡側だけ**(HH-076 は本文へ訂正記録付きで是正)。一般則: 恒久識別子・監査証跡を書く直前に `date`/`next-id` 等で**実時刻を確認**する。`brief --date` は今日から 2 日以上ずれると warn する(ブロックはしない — 意図的なバックデートは正当)。関連: [[N-main-20260728a]](書込値は直後に目視確認)。"
    tags: [provenance, date, task-id, permanent-id, ratified-at, attestation, long-session, brief, drift, framework, hh-065, hh-046]
    project: hyperhelix
    strength: 1
