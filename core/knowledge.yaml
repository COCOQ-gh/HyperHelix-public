  - id: N-039
    text: "ツール呼び出しは常に正規の function-call 書式のみで出力する。呼び出し直前に余計なトークン(例: 'count')を置かない/素の <invoke>・<parameter> タグを単独で出さない。書式崩れは致命的=未パースで未実行→ターンがサイレント終了し作業停止・直前編集が未コミットで放置・状態不整合になる(AP-007, 人間ゲート HH-029)。『malformed』を受けたら即座に正規書式で再送し、実行成立を確認してから次へ進む。"
