  - id: N-Project001-20260824e
    text: "**ゲージが『この主体には動かせない量』を数えていると、収束メトリクスは静かに嘘をつく。** 実測(2026-08-24 /cycle ordinal 5, project/Project001): process-backlog の open 22行のうち **5行は是正先が main にしか無い**(tools/CLI の書き換え・main 所有ノート・cross-branch sync)。project ブランチでは**構造的に焼却できない**のに、R8c のラチェットはそれを accretion として数え、R8d の class 集計にも参加していた — `enforcement-gap` は 1件かつ **100% が焼却不能**なのに K 判定に乗り、`measurement-gap`(1/3)と `drift`(2/3)も発火の実体が同じだった。∴ ゲージは『総量』と『**この主体が動かせる量**』を分けて出す必要がある。**一般形**: (1) 収束ゲージを作るときは『測る対象を、測られる側が変えられるか』を先に問う — 変えられない量を混ぜると、努力しても数字が動かず、ラチェットは誤発火し、統合レンズは統合対象の無いクラスで発火する。(2) 免除は**明示だけを根拠にする**(無印は既定で『動かせる』側)。推定で免除すると今度は過小報告になる。(3) 分類マーカーを足すときは**同一コミットで消費者まで配線する**(本件は lib の集計2値 → CLI 出力 → R8c の burn 義務規則 → チェックリスト行 → 陽性テストまで)。宣言だけ足すと AP-003 の再演になる。**発見できた条件**: bounded sweep(上位5行)では焼却不能行が decision set に入らず3回連続で見えていなかった。**5回に1回の heavy(--full)回が唯一の捕捉機会**だった — cadence を下げていたら見つからない種類の欠陥である。関連 [[N-Project001-20260824d]]。"
    tags: [hyperhelix, framework, metrics, convergence, ratchet, backlog, r8c, r8d, gauge-design, branch-scope, declare-consume, ap-003, cadence, full-sweep, scope:framework]
