  - id: N-043
    text: "PowerShellで読み取り補助の短い関数名(例 Rd/R/Cp/Mv)を定義すると組込みエイリアス(rd=Remove-Item, ri=Remove-Item, cp=Copy-Item, mv=Move-Item, sc=Set-Content等)に解決され、意図せず破壊的コマンドが走る。実例: 読み取り用のつもりで定義した短い名前の関数が削除コマンドに解決され、tracked なファイルを消した。対策: 補助関数は破壊的動詞と衝突しない明確な独自名(ReadData 等)にする。誤削除した tracked file は `git checkout HEAD -- <file>` で復元。回帰テストが silent data loss の即時検知に有効。非 ASCII のパスは『ファイル不在』に見え原因を取り違えやすい→git status の D 行で削除を確認する。"
